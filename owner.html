<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Eksekutif Owner & Modal - BosJus</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Preloaded Data from Server (Unified Database) -->
  <script id="preloaded-data" type="application/json">
    <?!= typeof serverPreloadedData !== 'undefined' ? serverPreloadedData : '{}' ?>
  </script>
  <script>
    window.__WEB_APP_URL__ = "<?= typeof webAppUrl !== 'undefined' ? webAppUrl : '' ?>";
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper Format Rupiah
    function formatRp(val) {
      const num = Number(val) || 0;
      return 'Rp ' + Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    // Helper Format Tanggal
    function formatDate(isoStr) {
      if (!isoStr) return '-';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return String(isoStr);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        const hours = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${mins}`;
      } catch (e) {
        return String(isoStr);
      }
    }

    // Icon Component (Pure SVG - 100% ASCII)
    function Icon({ name, className = 'w-5 h-5' }) {
      const icons = {
        briefcase: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />,
        cash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />,
        users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
        debt: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        refresh: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
        arrowRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />,
        arrowDown: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />,
        arrowUp: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />,
        shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        link: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />,
        building: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />,
        store: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />,
        wallet: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />,
        arrowLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      };
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name] || icons.briefcase}
        </svg>
      );
    }

    // Default Capital Config
    const DEFAULT_CAPITAL_CONFIG = {
      totalTargetModal: 25000000,
      owners: [
        { id: 'sindu', name: 'Sindu', sharePct: 33.33, targetModal: 8333333, initialDeposit: 23000000, role: 'creditor' },
        { id: 'iky', name: 'Iky', sharePct: 33.33, targetModal: 8333333, initialDeposit: 0, role: 'debtor', debtTo: 'sindu', initialDebt: 8333333 },
        { id: 'yusuf', name: 'Yusuf', sharePct: 33.33, targetModal: 8333333, initialDeposit: 0, role: 'debtor', debtTo: 'sindu', initialDebt: 8333333 }
      ]
    };

    function App() {
      // States
      const [activeTab, setActiveTab] = useState('summary'); // 'summary' | 'cashflow' | 'debt' | 'office'
      const [currentOwner, setCurrentOwner] = useState('sindu'); // 'sindu' | 'iky' | 'yusuf' | 'admin'
      
      // Cloud Settings & State
      const [scriptUrl, setScriptUrl] = useState(() => {
        const saved = (typeof localStorage !== 'undefined') ? localStorage.getItem('bjp_owner_script_url') : '';
        if (saved && saved.trim()) return saved.trim();
        const injected = (typeof window !== 'undefined') ? window.__WEB_APP_URL__ : '';
        if (injected && injected.trim() && !injected.startsWith('<?=')) return injected.trim();
        if (typeof window !== 'undefined' && window.location && window.location.protocol && window.location.protocol.startsWith('http')) {
          return '/api/data';
        }
        return '/api/data';
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('idle'); // 'idle' | 'success' | 'error'
      const [syncMessage, setSyncMessage] = useState('');

      // Data States
      const [capitalConfig, setCapitalConfig] = useState(() => {
        const saved = localStorage.getItem('bjp_owner_capital_v7');
        try { return saved ? JSON.parse(saved) : DEFAULT_CAPITAL_CONFIG; } catch (e) { return DEFAULT_CAPITAL_CONFIG; }
      });

      const [cashFlow, setCashFlow] = useState(() => {
        const saved = localStorage.getItem('bjp_owner_cashflow_v7');
        try { return saved ? JSON.parse(saved) : []; } catch (e) { return []; }
      });

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem('bjp_owner_debts_v7');
        try { return saved ? JSON.parse(saved) : []; } catch (e) { return []; }
      });

      // POS Outlets & Operational Data States
      const [outlets, setOutlets] = useState(() => {
        const saved = localStorage.getItem('bjp_outlets_v7');
        try { return saved ? JSON.parse(saved) : [{ id: 'out-1', name: 'Outlet Utama' }]; } catch (e) { return [{ id: 'out-1', name: 'Outlet Utama' }]; }
      });
      const [posTransactions, setPosTransactions] = useState(() => {
        const saved = localStorage.getItem('bjp_transactions_v7');
        try { return saved ? JSON.parse(saved) : []; } catch (e) { return []; }
      });
      const [posExpenses, setPosExpenses] = useState(() => {
        try {
          const fin = localStorage.getItem('bjp_finance_v7');
          if (fin) {
            const p = JSON.parse(fin);
            if (p && Array.isArray(p.expenses)) return p.expenses;
          }
          const saved = localStorage.getItem('bjp_expenses_v7');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [posIncomes, setPosIncomes] = useState(() => {
        try {
          const fin = localStorage.getItem('bjp_finance_v7');
          if (fin) {
            const p = JSON.parse(fin);
            if (p && Array.isArray(p.incomes)) return p.incomes;
          }
          const saved = localStorage.getItem('bjp_incomes_v7');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [posTransfers, setPosTransfers] = useState(() => {
        const saved = localStorage.getItem('bjp_transfers_v7');
        try { return saved ? JSON.parse(saved) : []; } catch (e) { return []; }
      });
      const [officeTransfers, setOfficeTransfers] = useState(() => {
        const saved = localStorage.getItem('bjp_office_transfers_v7');
        try { return saved ? JSON.parse(saved) : []; } catch (e) { return []; }
      });

      // Office Transfer Form & Filter States
      const [isOfficeTransferModalOpen, setIsOfficeTransferModalOpen] = useState(false);
      const [officeTransferForm, setOfficeTransferForm] = useState({
        direction: 'outlet_to_office',
        outletName: '',
        fundType: 'cash',
        category: '',
        amount: '',
        note: '',
        date: new Date().toISOString().slice(0, 16)
      });
      const [officeFilterOutlet, setOfficeFilterOutlet] = useState('all');
      const [officeFilterDirection, setOfficeFilterDirection] = useState('all');

      // Modals
      const [isCashFlowModalOpen, setIsCashFlowModalOpen] = useState(false);
      const [cashFlowForm, setCashFlowForm] = useState({
        date: new Date().toISOString().slice(0, 16),
        title: '',
        category: 'Pendapatan Usaha',
        type: 'in',
        fundSource: 'Saldo Kas Fisik (Tunai Outlet)',
        amount: ''
      });

      const [isDebtModalOpen, setIsDebtModalOpen] = useState(false);
      const [debtForm, setDebtForm] = useState({
        debtorId: 'iky',
        amount: '',
        source: 'dividen',
        note: ''
      });

      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
      const [configForm, setConfigForm] = useState({
        totalTargetModal: '25000000',
        targetPerOwner: '8333333'
      });

      const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
      const [tempScriptUrl, setTempScriptUrl] = useState('');

      // Filters
      const [cfFilterCategory, setCfFilterCategory] = useState('all');
      const [cfFilterType, setCfFilterType] = useState('all');

      // Save to localStorage immediately on change
      useEffect(() => {
        localStorage.setItem('bjp_owner_capital_v7', JSON.stringify(capitalConfig));
      }, [capitalConfig]);

      useEffect(() => {
        localStorage.setItem('bjp_owner_cashflow_v7', JSON.stringify(cashFlow));
      }, [cashFlow]);

      useEffect(() => {
        localStorage.setItem('bjp_owner_debts_v7', JSON.stringify(debts));
      }, [debts]);

      useEffect(() => {
        localStorage.setItem('bjp_transfers_v7', JSON.stringify(posTransfers));
      }, [posTransfers]);

      useEffect(() => {
        localStorage.setItem('bjp_office_transfers_v7', JSON.stringify(officeTransfers));
      }, [officeTransfers]);

      // Reload POS data helper
      function refreshOutletData() {
        try {
          const o = localStorage.getItem('bjp_outlets_v7');
          if (o) setOutlets(JSON.parse(o));
          const tx = localStorage.getItem('bjp_transactions_v7');
          if (tx) setPosTransactions(JSON.parse(tx));

          const fin = localStorage.getItem('bjp_finance_v7');
          let loadedExp = null;
          let loadedInc = null;
          if (fin) {
            const p = JSON.parse(fin);
            if (p) {
              if (Array.isArray(p.expenses)) loadedExp = p.expenses;
              if (Array.isArray(p.incomes)) loadedInc = p.incomes;
            }
          }
          if (loadedExp) {
            setPosExpenses(loadedExp);
          } else {
            const ex = localStorage.getItem('bjp_expenses_v7');
            if (ex) setPosExpenses(JSON.parse(ex));
          }

          if (loadedInc) {
            setPosIncomes(loadedInc);
          } else {
            const inc = localStorage.getItem('bjp_incomes_v7');
            if (inc) setPosIncomes(JSON.parse(inc));
          }

          const tr = localStorage.getItem('bjp_transfers_v7');
          if (tr) setPosTransfers(JSON.parse(tr));
          const ofTr = localStorage.getItem('bjp_office_transfers_v7');
          if (ofTr) setOfficeTransfers(JSON.parse(ofTr));
          setSyncMessage('Data outlet berhasil dimuat ulang');
        } catch (e) {
          console.error(e);
        }
      }

      useEffect(() => {
        const handleStorage = (e) => {
          if (e.key && (e.key.startsWith('bjp_') || e.key.includes('transfer') || e.key.includes('transact'))) {
            refreshOutletData();
          }
        };
        window.addEventListener('storage', handleStorage);
        return () => window.removeEventListener('storage', handleStorage);
      }, []);

      // Cloud Persistence Function
      async function syncToCloud(payloadOverride) {
        const targetUrl = (payloadOverride && payloadOverride.url) || scriptUrl || (typeof window !== 'undefined' && window.__WEB_APP_URL__) || '/api/data';
        
        setIsSyncing(true);
        setSyncStatus('idle');

        // 1. Dukungan otomatis langsung jika berjalan di dalam Google Apps Script (RPC)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          try {
            google.script.run
              .withSuccessHandler(function(res) {
                setIsSyncing(false);
                setSyncStatus('success');
                setSyncMessage('Tersinkron ke Spreadsheet (Database BosJusPos)');
              })
              .withFailureHandler(function(err) {
                setIsSyncing(false);
                setSyncStatus('error');
                setSyncMessage('Gagal sinkron: ' + err.toString());
              })
              .saveOwnerData({
                ownerCapitalConfig: payloadOverride?.capitalConfig || capitalConfig,
                ownerCashFlow: payloadOverride?.cashFlow || cashFlow,
                ownerDebtInstallments: payloadOverride?.debts || debts,
                ownerOfficeTransfers: payloadOverride?.officeTransfers || (posTransfers || []).filter(t => t.type && t.type.includes('office'))
              });
            return;
          } catch (e) {
            console.warn('RPC bypass to fetch:', e);
          }
        }

        if (!targetUrl) {
          setIsSyncing(false);
          return;
        }

        try {
          const payload = {
            action: 'saveOwnerData',
            ownerCapitalConfig: payloadOverride?.capitalConfig || capitalConfig,
            ownerCashFlow: payloadOverride?.cashFlow || cashFlow,
            ownerDebtInstallments: payloadOverride?.debts || debts,
            ownerOfficeTransfers: payloadOverride?.officeTransfers || (posTransfers || []).filter(t => t.type && t.type.includes('office'))
          };

          const resp = await fetch(targetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });

          const res = await resp.json();
          if (res && res.status === 'success') {
            setSyncStatus('success');
            setSyncMessage('Tersinkron ke Spreadsheet');
          } else {
            setSyncStatus('error');
            setSyncMessage(res.message || 'Gagal sinkron');
          }
        } catch (err) {
          setSyncStatus('error');
          setSyncMessage('Koneksi offline / URL Apps Script belum tepat');
        } finally {
          setIsSyncing(false);
        }
      }

      // Initial Fetch from Cloud if URL exists
      useEffect(() => {
        const urlToFetch = scriptUrl || (typeof window !== 'undefined' && window.__WEB_APP_URL__) || '/api/data';
        fetchFromCloud(urlToFetch);
      }, []);

      async function fetchFromCloud(url) {
        if (!url) return;
        setIsSyncing(true);
        try {
          const resp = await fetch(`${url}?action=getData`);
          const res = await resp.json();
          if (res && res.status === 'success' && res.data) {
            if (res.data.ownerCapitalConfig) setCapitalConfig(res.data.ownerCapitalConfig);
            if (res.data.ownerCashFlow) setCashFlow(res.data.ownerCashFlow);
            if (res.data.ownerDebtInstallments) setDebts(res.data.ownerDebtInstallments);
            if (res.data.ownerOfficeTransfers && Array.isArray(res.data.ownerOfficeTransfers)) {
              setOfficeTransfers(res.data.ownerOfficeTransfers);
              setPosTransfers(prev => {
                const map = new Map();
                (prev || []).forEach(p => map.set(p.id, p));
                res.data.ownerOfficeTransfers.forEach(o => map.set(o.id, o));
                const merged = Array.from(map.values());
                localStorage.setItem('bjp_transfers_v7', JSON.stringify(merged));
                return merged;
              });
            }
            setSyncStatus('success');
            setSyncMessage('Data cloud berhasil dimuat');
          }
        } catch (e) {
          console.warn('Could not fetch cloud data, using local:', e);
        } finally {
          setIsSyncing(false);
        }
      }

      // Calculations
      const ownerStats = useMemo(() => {
        const owners = capitalConfig.owners || [];
        return owners.map(o => {
          const debtorId = o.id;
          const initialDebt = Number(o.initialDebt) || 0;
          const paidDebt = debts
            .filter(d => d.debtorId === debtorId)
            .reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
          const sisaHutang = Math.max(0, initialDebt - paidDebt);
          const percentPaid = initialDebt > 0 ? Math.min(100, Math.round((paidDebt / initialDebt) * 100)) : 100;
          return {
            ...o,
            paidDebt,
            sisaHutang,
            percentPaid
          };
        });
      }, [capitalConfig, debts]);

      const totalHutangAwal = useMemo(() => {
        return (capitalConfig.owners || []).reduce((sum, o) => sum + (Number(o.initialDebt) || 0), 0);
      }, [capitalConfig]);

      const totalCicilanDibayar = useMemo(() => {
        return debts.reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
      }, [debts]);

      const totalSisaHutang = Math.max(0, totalHutangAwal - totalCicilanDibayar);

      const cashFlowStats = useMemo(() => {
        let totalIn = 0;
        let totalOut = 0;
        cashFlow.forEach(item => {
          const amt = Number(item.amount) || 0;
          if (item.type === 'in') totalIn += amt;
          else totalOut += amt;
        });
        return {
          totalIn,
          totalOut,
          saldoAkhir: totalIn - totalOut
        };
      }, [cashFlow]);

      // Handlers
      function saveCashFlow(e) {
        e.preventDefault();
        const amt = Number(cashFlowForm.amount);
        if (!amt || amt <= 0) {
          alert('Nominal harus lebih dari 0');
          return;
        }
        if (!cashFlowForm.title.trim()) {
          alert('Keterangan transaksi harus diisi');
          return;
        }

        const newEntry = {
          id: 'cf-' + Date.now(),
          date: new Date(cashFlowForm.date).toISOString(),
          title: cashFlowForm.title.trim(),
          category: cashFlowForm.category,
          type: cashFlowForm.type,
          fundSource: cashFlowForm.fundSource || (cashFlowForm.type === 'in' ? 'Saldo Kas Fisik (Tunai Outlet)' : 'Kas Usaha Pusat (Office)'),
          amount: amt,
          operator: currentOwner.toUpperCase()
        };

        const updated = [newEntry, ...cashFlow];
        setCashFlow(updated);
        setIsCashFlowModalOpen(false);
        setCashFlowForm({
          date: new Date().toISOString().slice(0, 16),
          title: '',
          category: 'Pendapatan Usaha',
          type: 'in',
          fundSource: 'Saldo Kas Fisik (Tunai Outlet)',
          amount: ''
        });

        syncToCloud({ cashFlow: updated });
      }

      function deleteCashFlow(id) {
        if (!confirm('Yakin ingin menghapus transaksi kas ini?')) return;
        const updated = cashFlow.filter(c => c.id !== id);
        setCashFlow(updated);
        syncToCloud({ cashFlow: updated });
      }

      function saveDebt(e) {
        e.preventDefault();
        const amt = Number(debtForm.amount);
        if (!amt || amt <= 0) {
          alert('Nominal cicilan harus lebih dari 0');
          return;
        }

        const debtorObj = (capitalConfig.owners || []).find(o => o.id === debtForm.debtorId);
        const debtorName = debtorObj ? debtorObj.name : debtForm.debtorId;

        const newDebt = {
          id: 'inst-' + Date.now(),
          date: new Date().toISOString(),
          debtorId: debtForm.debtorId,
          debtorName: debtorName,
          creditorName: 'Sindu',
          amount: amt,
          source: debtForm.source,
          note: debtForm.note.trim() || (debtForm.source === 'dividen' ? 'Potongan Dividen / Bagi Hasil' : 'Pembayaran Langsung'),
          operator: currentOwner.toUpperCase()
        };

        const updated = [newDebt, ...debts];
        setDebts(updated);
        setIsDebtModalOpen(false);
        setDebtForm({
          debtorId: 'iky',
          amount: '',
          source: 'dividen',
          note: ''
        });

        syncToCloud({ debts: updated });
      }

      function deleteDebt(id) {
        if (!confirm('Yakin ingin membatalkan/menghapus catatan cicilan ini?')) return;
        const updated = debts.filter(d => d.id !== id);
        setDebts(updated);
        syncToCloud({ debts: updated });
      }

      function saveConfig(e) {
        e.preventDefault();
        const total = Number(configForm.totalTargetModal) || 25000000;
        const perOwner = Number(configForm.targetPerOwner) || Math.round(total / 3);

        const updated = {
          ...capitalConfig,
          totalTargetModal: total,
          owners: (capitalConfig.owners || []).map(o => ({
            ...o,
            targetModal: perOwner,
            initialDebt: o.role === 'debtor' ? perOwner : 0
          }))
        };

        setCapitalConfig(updated);
        setIsConfigModalOpen(false);
        syncToCloud({ capitalConfig: updated });
      }

      function saveSettings(e) {
        e.preventDefault();
        const cleanUrl = tempScriptUrl.trim();
        setScriptUrl(cleanUrl);
        localStorage.setItem('bjp_owner_script_url', cleanUrl);
        setIsSettingsModalOpen(false);
        if (cleanUrl) {
          fetchFromCloud(cleanUrl);
        }
      }

      function exportExcel() {
        if (!cashFlow || cashFlow.length === 0) {
          alert('Belum ada data kas untuk diexport');
          return;
        }

        let running = 0;
        const sorted = [...cashFlow].sort((a, b) => new Date(a.date) - new Date(b.date));
        
        let tableHtml = `
          <table border="1">
            <thead>
              <tr style="background:#0f172a;color:#ffffff;font-weight:bold;">
                <th>No</th>
                <th>Tanggal & Waktu</th>
                <th>Keterangan</th>
                <th>Kategori</th>
                <th>Jenis</th>
                <th>Sumber / Asal Dana</th>
                <th>Nominal (Rp)</th>
                <th>Saldo Berjalan (Rp)</th>
                <th>Dicatat Oleh</th>
              </tr>
            </thead>
            <tbody>
        `;

        sorted.forEach((item, idx) => {
          const amt = Number(item.amount) || 0;
          if (item.type === 'in') running += amt;
          else running -= amt;

          tableHtml += `
            <tr>
              <td>${idx + 1}</td>
              <td>${formatDate(item.date)}</td>
              <td>${item.title || '-'}</td>
              <td>${item.category || '-'}</td>
              <td>${item.type === 'in' ? 'KAS MASUK (+)' : 'KAS KELUAR (-)'}</td>
              <td>${item.fundSource || (item.type === 'in' ? 'Saldo Kas Fisik (Tunai Outlet)' : 'Kas Usaha Pusat (Office)')}</td>
              <td>${amt}</td>
              <td>${running}</td>
              <td>${item.operator || '-'}</td>
            </tr>
          `;
        });

        tableHtml += `
            </tbody>
          </table>
        `;

        const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Buku_Kas_Usaha_BosJus_${new Date().toISOString().slice(0, 10)}.xls`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // Calculations for Outlets & Office Global Liquidity
      const outletBalances = useMemo(() => {
        const safeOutlets = (outlets && outlets.length > 0) ? outlets : [{ id: 'out-1', name: 'Outlet Utama' }];
        return safeOutlets.map(outlet => {
          const outletName = outlet.name || 'Outlet Utama';

          // 1. Omset Penjualan (Kas & Bank Net)
          let omsetCash = 0;
          let omsetBankNet = 0;
          (posTransactions || []).forEach(t => {
            const isMatch = (t.outletId && t.outletId === outlet.id) ||
                            (t.outletName && t.outletName === outletName) ||
                            (t.outlet && t.outlet === outletName) ||
                            (!t.outletId && !t.outletName && !t.outlet && safeOutlets.length === 1);
            if (isMatch && (t.status === 'paid' || !t.status)) {
              const method = String(t.paymentMethod || 'cash').toLowerCase();
              if (method === 'split' && t.splitPayment) {
                omsetCash += Number(t.splitPayment.cash) || 0;
                const qrisG = Number(t.splitPayment.qris) || 0;
                const fee = Math.round(qrisG * 0.007);
                omsetBankNet += (qrisG - fee) + (Number(t.splitPayment.transfer) || 0) + (Number(t.splitPayment.online) || 0);
              } else if (method === 'cash' || method === 'tunai') {
                omsetCash += (Number(t.total) || Number(t.finalTotal) || 0);
              } else if (method === 'qris') {
                const qrisG = Number(t.total) || Number(t.finalTotal) || 0;
                const fee = Math.round(qrisG * 0.007);
                omsetBankNet += (qrisG - fee);
              } else {
                omsetBankNet += (Number(t.total) || Number(t.finalTotal) || 0);
              }
            }
          });

          // 2. Incomes (Pemasukan Operasional)
          let incomesCash = 0;
          let incomesBank = 0;
          (posIncomes || []).forEach(inc => {
            const isMatch = (inc.outletId && inc.outletId === outlet.id) ||
                            (inc.outletName && inc.outletName === outletName) ||
                            (inc.outlet && inc.outlet === outletName) ||
                            (!inc.outletId && !inc.outletName && !inc.outlet && safeOutlets.length === 1);
            if (isMatch) {
              const amt = Number(inc.amount) || 0;
              const dest = String(inc.paymentDestination || inc.account || 'cash').toLowerCase();
              if (dest === 'bank' || dest.includes('rekening') || dest.includes('qris') || dest.includes('digital')) {
                incomesBank += amt;
              } else {
                incomesCash += amt;
              }
            }
          });

          // 3. Expenses (Pengeluaran Operasional)
          let expensesCash = 0;
          let expensesBank = 0;
          (posExpenses || []).forEach(exp => {
            const isMatch = (exp.outletId && exp.outletId === outlet.id) ||
                            (exp.outletName && exp.outletName === outletName) ||
                            (exp.outlet && exp.outlet === outletName) ||
                            (!exp.outletId && !exp.outletName && !exp.outlet && safeOutlets.length === 1);
            if (isMatch) {
              const amt = Number(exp.amount) || 0;
              const src = String(exp.paymentSource || exp.account || 'cash').toLowerCase();
              if (src === 'bank' || src.includes('rekening') || src.includes('qris') || src.includes('digital')) {
                expensesBank += amt;
              } else {
                expensesCash += amt;
              }
            }
          });

          // 4. Transfers (Mutasi Internal & Office)
          let cashToBank = 0;
          let bankToCash = 0;
          let cashToOffice = 0;
          let bankToOffice = 0;
          let officeToCash = 0;
          let officeToBank = 0;

          (posTransfers || []).forEach(tr => {
            const isMatch = (tr.outletId && tr.outletId === outlet.id) ||
                            (tr.outletName && tr.outletName === outletName) ||
                            (tr.outlet && tr.outlet === outletName) ||
                            (!tr.outletId && !tr.outletName && !tr.outlet && safeOutlets.length === 1);
            if (isMatch) {
              const amt = Number(tr.amount) || 0;
              if (tr.type === 'cash_to_bank') cashToBank += amt;
              else if (tr.type === 'bank_to_cash') bankToCash += amt;
              else if (tr.type === 'cash_to_office') cashToOffice += amt;
              else if (tr.type === 'bank_to_office') bankToOffice += amt;
              else if (tr.type === 'office_to_cash') officeToCash += amt;
              else if (tr.type === 'office_to_bank') officeToBank += amt;
            }
          });

          // Dropping dari Office (bisa tercatat di posIncomes atau officeTransfers)
          let droppingTotal = 0;
          (officeTransfers || []).forEach(tr => {
            const isMatch = (tr.outletId && tr.outletId === outlet.id) ||
                            (tr.outletName && tr.outletName === outletName) ||
                            (!tr.outletId && !tr.outletName && safeOutlets.length === 1);
            if (isMatch && (tr.direction === 'office_to_outlet' || tr.type === 'office_to_cash' || tr.type === 'office_to_bank')) {
              droppingTotal += Number(tr.amount) || 0;
            }
          });
          if (droppingTotal === 0) {
            (posIncomes || []).forEach(inc => {
              const isMatch = (inc.outletId && inc.outletId === outlet.id) ||
                              (inc.outletName && inc.outletName === outletName) ||
                              (!inc.outletId && !inc.outletName && safeOutlets.length === 1);
              if (isMatch && (inc.category === 'Dropping Modal dari Office' || (inc.category && inc.category.toLowerCase().includes('dropping')))) {
                droppingTotal += Number(inc.amount) || 0;
              }
            });
            if (droppingTotal === 0) {
              droppingTotal = officeToCash + officeToBank;
            }
          }

          // Total Disetor ke Office
          let setoranTotal = 0;
          (officeTransfers || []).forEach(tr => {
            const isMatch = (tr.outletId && tr.outletId === outlet.id) ||
                            (tr.outletName && tr.outletName === outletName) ||
                            (!tr.outletId && !tr.outletName && safeOutlets.length === 1);
            if (isMatch && (tr.direction === 'outlet_to_office' || tr.type === 'cash_to_office' || tr.type === 'bank_to_office')) {
              setoranTotal += Number(tr.amount) || 0;
            }
          });
          if (setoranTotal === 0) {
            setoranTotal = cashToOffice + bankToOffice;
          }

          // Hindari double-count jika transfer office_to_cash/bank sudah tercatat di incomes
          let netOfficeToCash = officeToCash;
          let netOfficeToBank = officeToBank;
          (posTransfers || []).forEach(tr => {
            if (tr.type === 'office_to_cash' || tr.type === 'office_to_bank') {
              const alreadyInInc = (posIncomes || []).some(inc => inc.id === tr.refIncomeId || inc.refOfficeTransferId === tr.id);
              if (alreadyInInc) {
                if (tr.type === 'office_to_cash') netOfficeToCash = Math.max(0, netOfficeToCash - (Number(tr.amount) || 0));
                if (tr.type === 'office_to_bank') netOfficeToBank = Math.max(0, netOfficeToBank - (Number(tr.amount) || 0));
              }
            }
          });

          const saldoKasFisik = (omsetCash + incomesCash - expensesCash) - cashToBank + bankToCash - cashToOffice + netOfficeToCash;
          const saldoBank = (omsetBankNet + incomesBank - expensesBank) + cashToBank - bankToCash - bankToOffice + netOfficeToBank;
          const totalSaldo = saldoKasFisik + saldoBank;

          return {
            id: outlet.id,
            name: outletName,
            saldoKasFisik,
            saldoBank,
            totalSaldo,
            omsetCash,
            omsetBankNet,
            cashToOffice,
            bankToOffice,
            officeToCash: netOfficeToCash,
            officeToBank: netOfficeToBank,
            totalDisetorKeOffice: setoranTotal,
            totalDroppingDariOffice: droppingTotal
          };
        });
      }, [outlets, posTransactions, posExpenses, posIncomes, posTransfers, officeTransfers]);

      const allOfficeTransfers = useMemo(() => {
        const map = new Map();
        (posTransfers || []).filter(t => t.type && (t.type.includes('office') || t.direction)).forEach(t => map.set(t.id, t));
        (officeTransfers || []).forEach(t => map.set(t.id, t));

        return Array.from(map.values()).map(t => {
          const dir = t.direction || (t.type === 'cash_to_office' || t.type === 'bank_to_office' ? 'outlet_to_office' : 'office_to_outlet');
          const isCash = t.fundType === 'cash' || t.type === 'cash_to_office' || t.type === 'office_to_cash' || t.from === 'cash' || t.to === 'cash';
          
          let directionLabel = 'Outlet -> Office (Setoran)';
          let sourceLabel = `${t.outletName || 'Outlet'} (${isCash ? 'Kas Laci' : 'Bank'})`;
          let targetLabel = `Kas Pusat Office (${isCash ? 'Kas Fisik' : 'Bank'})`;
          let badgeColor = 'blue';
          let fundLabel = isCash ? 'Kas Fisik (Tunai)' : 'Rekening Bank (Digital)';
          let isOutletRelated = true;

          if (dir === 'office_to_outlet') {
            directionLabel = 'Office -> Outlet (Dropping)';
            sourceLabel = `Kas Pusat Office (${isCash ? 'Kas Fisik' : 'Bank'})`;
            targetLabel = `${t.outletName || 'Outlet'} (${isCash ? 'Kas Laci' : 'Bank'})`;
            badgeColor = 'amber';
            isOutletRelated = true;
          } else if (dir === 'office_bank_to_cash') {
            directionLabel = 'Office: Bank -> Kas Tunai';
            sourceLabel = 'Rekening Bank Office (Pusat)';
            targetLabel = 'Kas Fisik Office (Pusat)';
            fundLabel = 'Internal Office (Tarik Tunai)';
            badgeColor = 'cyan';
            isOutletRelated = false;
          } else if (dir === 'office_cash_to_bank') {
            directionLabel = 'Office: Kas Tunai -> Bank';
            sourceLabel = 'Kas Fisik Office (Pusat)';
            targetLabel = 'Rekening Bank Office (Pusat)';
            fundLabel = 'Internal Office (Setor Tunai)';
            badgeColor = 'emerald';
            isOutletRelated = false;
          } else if (dir === 'office_direct_in') {
            directionLabel = 'Office: Kas Masuk Pusat';
            sourceLabel = t.category ? `Pemasukan (${t.category})` : 'Penerimaan Langsung Office';
            targetLabel = isCash ? 'Kas Fisik Office (Pusat)' : 'Rekening Bank Office (Pusat)';
            badgeColor = 'emerald';
            isOutletRelated = false;
          } else if (dir === 'office_direct_out') {
            directionLabel = 'Office: Kas Keluar Pusat';
            sourceLabel = isCash ? 'Kas Fisik Office (Pusat)' : 'Rekening Bank Office (Pusat)';
            targetLabel = t.category ? `Pengeluaran (${t.category})` : 'Biaya Langsung Office';
            badgeColor = 'rose';
            isOutletRelated = false;
          }

          return {
            ...t,
            dir,
            isCash,
            isOutletRelated,
            directionLabel,
            fundLabel,
            sourceLabel,
            targetLabel,
            badgeColor
          };
        }).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
      }, [posTransfers, officeTransfers]);

      const officeStats = useMemo(() => {
        let officeCash = 0;
        let officeBank = 0;

        allOfficeTransfers.forEach(tr => {
          const amt = Number(tr.amount) || 0;
          const dir = tr.dir || tr.direction || (tr.type === 'cash_to_office' || tr.type === 'bank_to_office' ? 'outlet_to_office' : 'office_to_outlet');
          const isCash = tr.isCash;

          if (dir === 'outlet_to_office') {
            if (isCash) officeCash += amt;
            else officeBank += amt;
          } else if (dir === 'office_to_outlet') {
            if (isCash) officeCash -= amt;
            else officeBank -= amt;
          } else if (dir === 'office_bank_to_cash') {
            officeBank -= amt;
            officeCash += amt;
          } else if (dir === 'office_cash_to_bank') {
            officeCash -= amt;
            officeBank += amt;
          } else if (dir === 'office_direct_in') {
            if (isCash) officeCash += amt;
            else officeBank += amt;
          } else if (dir === 'office_direct_out') {
            if (isCash) officeCash -= amt;
            else officeBank -= amt;
          }
        });

        const totalOffice = officeCash + officeBank;
        const totalOutletsCash = outletBalances.reduce((sum, o) => sum + o.saldoKasFisik, 0);
        const totalOutletsBank = outletBalances.reduce((sum, o) => sum + o.saldoBank, 0);
        const totalAllOutlets = totalOutletsCash + totalOutletsBank;
        const grandTotalBusinessLiquidity = totalOffice + totalAllOutlets;

        return {
          officeCash,
          officeBank,
          totalOffice,
          totalOutletsCash,
          totalOutletsBank,
          totalAllOutlets,
          grandTotalBusinessLiquidity
        };
      }, [allOfficeTransfers, outletBalances]);

      const filteredOfficeTransfers = useMemo(() => {
        return allOfficeTransfers.filter(t => {
          if (officeFilterOutlet === 'office_only' && t.isOutletRelated) return false;
          if (officeFilterOutlet !== 'all' && officeFilterOutlet !== 'office_only' && (t.outletName || '') !== officeFilterOutlet) return false;

          if (officeFilterDirection === 'to_office' && t.dir !== 'outlet_to_office') return false;
          if (officeFilterDirection === 'from_office' && t.dir !== 'office_to_outlet') return false;
          if (officeFilterDirection === 'internal_office' && t.dir !== 'office_bank_to_cash' && t.dir !== 'office_cash_to_bank') return false;
          if (officeFilterDirection === 'office_in' && t.dir !== 'office_direct_in') return false;
          if (officeFilterDirection === 'office_out' && t.dir !== 'office_direct_out') return false;
          return true;
        });
      }, [allOfficeTransfers, officeFilterOutlet, officeFilterDirection]);

      function openOfficeTransferModal(direction = 'outlet_to_office', presetOutlet = '', presetFund = 'cash') {
        const defaultOutlet = presetOutlet || (outlets && outlets.length > 0 ? outlets[0].name : 'Outlet Utama');
        let defaultNote = '';
        let defaultCat = '';

        if (direction === 'outlet_to_office') defaultNote = 'Setoran omset ke office';
        else if (direction === 'office_to_outlet') defaultNote = `Dropping modal kas kecil ke ${defaultOutlet}`;
        else if (direction === 'office_bank_to_cash') defaultNote = 'Tarik tunai dari rekening bank ke kas brankas office';
        else if (direction === 'office_cash_to_bank') defaultNote = 'Setoran kas brankas ke rekening bank office';
        else if (direction === 'office_direct_in') { defaultNote = 'Suntikan dana / pemasukan office'; defaultCat = 'Modal Tambahan'; }
        else if (direction === 'office_direct_out') { defaultNote = 'Biaya operasional kantor pusat'; defaultCat = 'Operasional Kantor Pusat'; }

        setOfficeTransferForm({
          direction: direction,
          outletName: defaultOutlet,
          fundType: presetFund,
          category: defaultCat,
          amount: '',
          note: defaultNote,
          date: new Date().toISOString().slice(0, 16)
        });
        setIsOfficeTransferModalOpen(true);
      }

      function saveOfficeTransfer(e) {
        e.preventDefault();
        const amt = Number(officeTransferForm.amount);
        if (!amt || amt <= 0) {
          alert('Nominal mutasi harus lebih dari 0');
          return;
        }

        const dir = officeTransferForm.direction;
        const nowIso = officeTransferForm.date ? new Date(officeTransferForm.date).toISOString() : new Date().toISOString();
        const isCash = officeTransferForm.fundType === 'cash';

        if (dir === 'outlet_to_office') {
          // 1. TERIMA SETORAN (Outlet -> Office)
          const safeOutlets = (outlets && outlets.length > 0) ? outlets : [{ id: 'out-1', name: 'Outlet Utama' }];
          const matchedOutlet = safeOutlets.find(o => o.name === officeTransferForm.outletName) || safeOutlets[0];
          const outletId = matchedOutlet ? matchedOutlet.id : 'out-1';
          const outletName = matchedOutlet ? matchedOutlet.name : (officeTransferForm.outletName || 'Outlet Utama');

          const transferType = isCash ? 'cash_to_office' : 'bank_to_office';
          const newTransfer = {
            id: 'trf-' + Date.now(),
            date: nowIso,
            type: transferType,
            from: isCash ? 'cash' : 'bank',
            to: 'office',
            amount: amt,
            outletId: outletId,
            outletName: outletName,
            direction: 'outlet_to_office',
            fundType: officeTransferForm.fundType,
            note: officeTransferForm.note.trim() || 'Setoran Omset ke Office',
            operator: currentOwner.toUpperCase()
          };

          const updatedTransfers = [newTransfer, ...(posTransfers || [])];
          setPosTransfers(updatedTransfers);
          localStorage.setItem('bjp_transfers_v7', JSON.stringify(updatedTransfers));

          const updatedOfficeOnly = [newTransfer, ...(officeTransfers || [])];
          setOfficeTransfers(updatedOfficeOnly);
          localStorage.setItem('bjp_office_transfers_v7', JSON.stringify(updatedOfficeOnly));

          setIsOfficeTransferModalOpen(false);
          syncToCloud({ officeTransfers: updatedOfficeOnly });
        } else if (dir === 'office_to_outlet') {
          // 2. DROPPING MODAL (Office -> Outlet)
          const safeOutlets = (outlets && outlets.length > 0) ? outlets : [{ id: 'out-1', name: 'Outlet Utama' }];
          const matchedOutlet = safeOutlets.find(o => o.name === officeTransferForm.outletName) || safeOutlets[0];
          const outletId = matchedOutlet ? matchedOutlet.id : 'out-1';
          const outletName = matchedOutlet ? matchedOutlet.name : (officeTransferForm.outletName || 'Outlet Utama');

          const newIncome = {
            id: 'inc-' + Date.now(),
            outletId: outletId,
            outletName: outletName,
            date: nowIso,
            title: officeTransferForm.note.trim() || ('Dropping Modal Kas Pusat ke ' + outletName),
            category: 'Dropping Modal dari Office',
            amount: amt,
            paymentDestination: isCash ? 'cash' : 'bank',
            operator: currentOwner.toUpperCase()
          };

          const updatedIncomes = [newIncome, ...(posIncomes || [])];
          setPosIncomes(updatedIncomes);
          localStorage.setItem('bjp_incomes_v7', JSON.stringify(updatedIncomes));

          try {
            const finRaw = localStorage.getItem('bjp_finance_v7');
            const fin = finRaw ? JSON.parse(finRaw) : {};
            fin.incomes = [newIncome, ...(fin.incomes || [])];
            localStorage.setItem('bjp_finance_v7', JSON.stringify(fin));
          } catch (err) {}

          const transferType = isCash ? 'office_to_cash' : 'office_to_bank';
          const newOfficeTransfer = {
            id: 'tr-off-' + Date.now(),
            date: nowIso,
            type: transferType,
            from: 'office',
            to: isCash ? 'cash' : 'bank',
            amount: amt,
            outletId: outletId,
            outletName: outletName,
            direction: 'office_to_outlet',
            fundType: officeTransferForm.fundType,
            note: officeTransferForm.note.trim() || ('Dropping Modal Kas Pusat ke ' + outletName),
            operator: currentOwner.toUpperCase(),
            refIncomeId: newIncome.id
          };

          const updatedOfficeOnly = [newOfficeTransfer, ...(officeTransfers || [])];
          setOfficeTransfers(updatedOfficeOnly);
          localStorage.setItem('bjp_office_transfers_v7', JSON.stringify(updatedOfficeOnly));

          setIsOfficeTransferModalOpen(false);
          syncToCloud({ officeTransfers: updatedOfficeOnly });
        } else if (dir === 'office_bank_to_cash' || dir === 'office_cash_to_bank') {
          // 3. MUTASI INTERNAL OFFICE PUSAT (Bank <-> Kas)
          const isBankToCash = dir === 'office_bank_to_cash';
          const newTransfer = {
            id: 'tr-off-' + Date.now(),
            date: nowIso,
            type: isBankToCash ? 'office_bank_to_cash' : 'office_cash_to_bank',
            from: isBankToCash ? 'bank' : 'cash',
            to: isBankToCash ? 'cash' : 'bank',
            amount: amt,
            outletName: 'Office Pusat',
            direction: dir,
            fundType: isBankToCash ? 'cash' : 'bank',
            note: officeTransferForm.note.trim() || (isBankToCash ? 'Tarik tunai dari Bank ke Kas Office' : 'Setor tunai Kas ke Bank Office'),
            operator: currentOwner.toUpperCase()
          };

          const updatedOfficeOnly = [newTransfer, ...(officeTransfers || [])];
          setOfficeTransfers(updatedOfficeOnly);
          localStorage.setItem('bjp_office_transfers_v7', JSON.stringify(updatedOfficeOnly));

          setIsOfficeTransferModalOpen(false);
          syncToCloud({ officeTransfers: updatedOfficeOnly });
        } else if (dir === 'office_direct_in' || dir === 'office_direct_out') {
          // 4. KAS MASUK / KELUAR LANGSUNG OFFICE PUSAT (Tanpa Cabang)
          const isDirectIn = dir === 'office_direct_in';
          const defaultNote = isDirectIn ? 'Pemasukan Kas Langsung Office' : 'Pengeluaran Operasional Office';
          const newTransfer = {
            id: 'tr-off-' + Date.now(),
            date: nowIso,
            type: isDirectIn ? 'office_direct_in' : 'office_direct_out',
            from: isDirectIn ? 'external' : (isCash ? 'cash' : 'bank'),
            to: isDirectIn ? (isCash ? 'cash' : 'bank') : 'external',
            amount: amt,
            outletName: 'Office Pusat',
            direction: dir,
            fundType: officeTransferForm.fundType,
            category: officeTransferForm.category || (isDirectIn ? 'Pemasukan Office' : 'Operasional Office'),
            note: officeTransferForm.note.trim() || defaultNote,
            operator: currentOwner.toUpperCase()
          };

          const updatedOfficeOnly = [newTransfer, ...(officeTransfers || [])];
          setOfficeTransfers(updatedOfficeOnly);
          localStorage.setItem('bjp_office_transfers_v7', JSON.stringify(updatedOfficeOnly));

          setIsOfficeTransferModalOpen(false);
          syncToCloud({ officeTransfers: updatedOfficeOnly });
        }
      }

      function deleteOfficeTransfer(id) {
        if (!confirm('Yakin ingin membatalkan/menghapus mutasi saldo ini? Saldo outlet & office akan dikembalikan.')) return;
        
        const target = (officeTransfers || []).find(t => t.id === id) || (posTransfers || []).find(t => t.id === id);
        
        // 1. Jika dropping modal (punya refIncomeId atau direction office_to_outlet)
        if (target && (target.direction === 'office_to_outlet' || target.refIncomeId || target.type === 'office_to_cash' || target.type === 'office_to_bank')) {
          const incId = target.refIncomeId || target.id;
          const updatedIncomes = (posIncomes || []).filter(i => i.id !== incId && i.id !== id);
          setPosIncomes(updatedIncomes);
          localStorage.setItem('bjp_incomes_v7', JSON.stringify(updatedIncomes));
          try {
            const finRaw = localStorage.getItem('bjp_finance_v7');
            if (finRaw) {
              const fin = JSON.parse(finRaw);
              fin.incomes = (fin.incomes || []).filter(i => i.id !== incId && i.id !== id);
              localStorage.setItem('bjp_finance_v7', JSON.stringify(fin));
            }
          } catch (e) {}
        }

        // 2. Hapus dari posTransfers (jika ada)
        const updatedTransfers = (posTransfers || []).filter(t => t.id !== id);
        setPosTransfers(updatedTransfers);
        localStorage.setItem('bjp_transfers_v7', JSON.stringify(updatedTransfers));

        // 3. Hapus dari officeTransfers
        const updatedOfficeOnly = (officeTransfers || []).filter(t => t.id !== id);
        setOfficeTransfers(updatedOfficeOnly);
        localStorage.setItem('bjp_office_transfers_v7', JSON.stringify(updatedOfficeOnly));

        syncToCloud({
          officeTransfers: updatedOfficeOnly
        });
      }

                              officeTransferForm.fundType === 'cash'
                                ? 'bg-emerald-600/30 text-white border-emerald-500 ring-1 ring-emerald-500'
                                : 'bg-slate-800 text-slate-300 border-slate-700'
                            }`}
                          >
                            <div className="text-xs">Kas Fisik Office</div>
                            <div className="text-[10px] font-mono-code text-emerald-400 mt-0.5">
                              Saldo: {formatRp(officeStats.officeCash)}
                            </div>
                          </button>
                          <button
                            type="button"
                            onClick={() => setOfficeTransferForm(f => ({ ...f, fundType: 'bank' }))}
                            className={`p-2.5 rounded-xl font-bold border transition text-left ${
                              officeTransferForm.fundType === 'bank'
                                ? 'bg-cyan-600/30 text-white border-cyan-500 ring-1 ring-cyan-500'
                                : 'bg-slate-800 text-slate-300 border-slate-700'
                            }`}
                          >
                            <div className="text-xs">Rekening Bank Office</div>
                            <div className="text-[10px] font-mono-code text-cyan-400 mt-0.5">
                              Saldo: {formatRp(officeStats.officeBank)}
                            </div>
                          </button>
                        </div>
                      </div>

                      {/* Kategori Khusus */}
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">
                          {officeTransferForm.direction === 'office_direct_in' ? 'Kategori Pemasukan Office' : 'Kategori Pengeluaran / Biaya Office'}
                        </label>
                        <div className="flex flex-wrap gap-1.5 mb-1.5">
                          {(officeTransferForm.direction === 'office_direct_in'
                            ? ['Modal Tambahan', 'Pendapatan Lain-lain', 'Bunga Bank', 'Pengembalian Dana', 'Lainnya']
                            : ['Operasional Kantor Pusat', 'Gaji Management', 'Sewa Kantor', 'Listrik & Internet Office', 'Legalitas / Pajak', 'Lainnya']
                          ).map(cat => (
                            <button
                              key={cat}
                              type="button"
                              onClick={() => setOfficeTransferForm(f => ({ ...f, category: cat }))}
                              className={`px-2 py-0.5 rounded-md text-[11px] font-medium border transition ${
                                officeTransferForm.category === cat
                                  ? 'bg-blue-600 text-white border-blue-500'
                                  : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200'
                              }`}
                            >
                              {cat}
                            </button>
                          ))}
                        </div>
                        <input
                          type="text"
                          placeholder="Atau ketik kategori sendiri..."
                          value={officeTransferForm.category || ''}
                          onChange={(e) => setOfficeTransferForm(f => ({ ...f, category: e.target.value }))}
                          className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-blue-500 text-xs"
                        />
                      </div>
                    </div>
                  )}

                  {/* Tanggal & Nominal */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Tanggal &amp; Waktu</label>
                      <input
                        type="datetime-local"
                        required
                        value={officeTransferForm.date}
                        onChange={(e) => setOfficeTransferForm(f => ({ ...f, date: e.target.value }))}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 font-mono-code text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Nominal Mutasi (Rp)</label>
                      <input
                        type="number"
                        required
                        min="1"
                        placeholder="0"
                        value={officeTransferForm.amount}
                        onChange={(e) => setOfficeTransferForm(f => ({ ...f, amount: e.target.value }))}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white font-mono-code font-bold text-sm focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  {/* Keterangan */}
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Keterangan / Catatan</label>
                    <input
                      type="text"
                      placeholder="Contoh keterangan mutasi atau catatan detail..."
                      value={officeTransferForm.note}
                      onChange={(e) => setOfficeTransferForm(f => ({ ...f, note: e.target.value }))}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  {/* Tombol Simpan (Sticky di bawah agar selalu terlihat) */}
                  <div className="pt-3 flex items-center justify-end space-x-2 border-t border-slate-800/80 bg-slate-900 sticky bottom-0 z-10">
                    <button
                      type="button"
                      onClick={() => setIsOfficeTransferModalOpen(false)}
                      className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer"
                    >
                      Batal (Kembali)
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold transition shadow-lg shadow-blue-600/30 cursor-pointer"
                    >
                      Simpan Mutasi
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800/80 py-4 px-4 text-center text-xs text-slate-500">
            BosJus Executive Owner Portal &copy; 2026 &bull; Modul Mandiri Khusus Struktur Modal & Kas Usaha
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
