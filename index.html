                        <button type="button" onClick={() => setStockOutForm(f => ({...f, qty: ((parseInt(f.qty)||0) + 1).toString()}))} className="w-10 h-10 bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 rounded-xl font-black text-lg flex items-center justify-center">+</button>
                      </div>
                      {stockOutForm.qty && parseInt(stockOutForm.qty) > 0 && (
                        <div className="mt-1.5 text-xs text-red-500 font-bold text-center">
                          Sisa stok akan menjadi: <span className="text-red-600">{getStock(stockReceiptTarget) - parseInt(stockOutForm.qty)}</span> item
                        </div>
                      )}
                    </div>

                    {/* Quick Subtract Buttons */}
                    <div>
                      <label className="text-[10px] font-bold text-red-500 uppercase mb-1.5 block">Kurangi Cepat</label>
                      <div className="grid grid-cols-5 gap-1.5">
                        {[5, 10, 20, 50, 100].map(n => (
                          <button type="button" key={n} onClick={() => setStockOutForm(f => ({...f, qty: n.toString()}))} className={`py-1.5 rounded-lg text-xs font-bold border transition-colors ${stockOutForm.qty === n.toString() ? 'bg-red-500/20 border-red-500/40 text-red-600' : 'bg-red-50 border-red-200 text-red-500 hover:bg-red-100'}`}>
                            -{n}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-red-500 uppercase mb-1.5 block">Keterangan / Alasan Keluar <span className="text-red-400">*</span></label>
                      <textarea
                        value={stockOutForm.note}
                        onChange={e => setStockOutForm(f => ({...f, note: e.target.value}))}
                        placeholder="cth: Expired, Rusak, Dipakai sendiri..."
                        rows={2}
                        className="w-full bg-red-50 border border-red-200 focus:border-red-500 rounded-xl px-3 py-2.5 text-xs text-red-500 focus:outline-none resize-none"
                        required
                      />
                    </div>

                    {/* Info Tanggal */}
                    <div className="bg-red-50 border border-red-200 rounded-xl px-3 py-2 flex items-center gap-2 text-xs text-red-500">
                      <Icon name="clock" size={13} className="text-red-500"/>
                      Dicatat otomatis: <span className="text-red-600 font-bold">{new Date().toLocaleString('id-ID')}</span>
                      &nbsp;- Oleh: <span className="text-red-600 font-bold">{currentUser.name}</span>
                    </div>

                    {/* Action Buttons */}
                    <div className="flex gap-2 pt-1">
                      <button type="button" onClick={() => { setIsStockOutModalOpen(false); setStockReceiptTarget(null); }} className="flex-1 py-2.5 bg-red-50 hover:bg-red-100 text-red-500 rounded-xl font-bold text-sm border border-red-200 transition-colors">Batal</button>
                      <button type="submit" className="flex-1 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold text-sm shadow-lg shadow-red-500/20 transition-colors flex items-center justify-center gap-2">
                        <Icon name="minus" size={16}/> Simpan Keluar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal Form Bahan Baku */}
            {isRawMaterialModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
                  <button onClick={() => setIsRawMaterialModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  <h3 className="text-lg font-black text-[#228B22] mb-4">{editingRawMaterial ? 'Edit Bahan Baku' : 'Tambah Bahan Baku'}</h3>
                  
                  <form onSubmit={saveRawMaterial} className="space-y-4">
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Cabang / Outlet</label>
                      <select 
                        value={rawMaterialForm.outletId || (selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId)} 
                        onChange={e => {
                          const newOId = e.target.value;
                          const currentVal = editingRawMaterial ? getRawMaterialStock(editingRawMaterial, newOId) : (rawMaterialForm.stock || 0);
                          setRawMaterialForm({ ...rawMaterialForm, outletId: newOId, stock: currentVal });
                        }}
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs font-bold focus:border-purple-500"
                      >
                        {outlets.map(o => (
                          <option key={o.id} value={o.id}>{o.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nama Bahan Mentah</label>
                      <input type="text" value={rawMaterialForm.name} onChange={e => setRawMaterialForm({...rawMaterialForm, name: e.target.value})} placeholder="Contoh: Kurma, Pisang, Susu UHT" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-purple-500" required/>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Stok di Cabang Ini</label>
                        <input type="number" min="0" value={rawMaterialForm.stock} onChange={e => setRawMaterialForm({...rawMaterialForm, stock: e.target.value})} placeholder="0" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-purple-500" required/>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Satuan</label>
                        <input type="text" value={rawMaterialForm.unit} onChange={e => setRawMaterialForm({...rawMaterialForm, unit: e.target.value})} placeholder="buah / ml / gr / porsi" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-purple-500" required/>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">HPP / Modal Beli (Rp)</label>
                        <input type="number" min="0" value={rawMaterialForm.costPrice} onChange={e => setRawMaterialForm({...rawMaterialForm, costPrice: e.target.value})} placeholder="Cth: 2000" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs font-bold focus:border-purple-500"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Harga Jual Kasir (Rp)</label>
                        <input type="number" min="0" value={rawMaterialForm.sellPrice} onChange={e => setRawMaterialForm({...rawMaterialForm, sellPrice: e.target.value})} placeholder="Kosong = sama dg HPP" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs font-bold focus:border-purple-500"/>
                      </div>
                    </div>

                    <div className="bg-[#F0FDF4] p-3 rounded-2xl border border-[#BBF7D0] flex items-center justify-between">
                      <div>
                        <div className="text-xs font-bold text-[#228B22]">Tampilkan di Tab &apos;Tambahan&apos; Kasir</div>
                        <div className="text-[10px] text-[#2E8B57]">Bisa dipilih kasir sebagai item mix / ekstra topping</div>
                      </div>
                      <input 
                        type="checkbox" 
                        checked={rawMaterialForm.isAddon !== false} 
                        onChange={e => setRawMaterialForm({...rawMaterialForm, isAddon: e.target.checked})} 
                        className="w-4 h-4 text-purple-600 rounded accent-purple-600 cursor-pointer"
                      />
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setIsRawMaterialModalOpen(false)} className="px-4 py-2 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-bold text-xs transition-colors">Batal</button>
                      <button type="submit" className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold text-xs shadow-lg shadow-purple-500/20 transition-colors">Simpan Bahan</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal Form Promo */}
            {isPromoModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-lg shadow-2xl relative max-h-[90vh] overflow-y-auto">
                  <button onClick={() => setIsPromoModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nama Promo</label>
                      <input type="text" value={promoForm.name} onChange={e => setPromoForm({...promoForm, name: e.target.value})} placeholder="Contoh: Promo Jumat Berkah" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-amber-500" required/>
                    </div>
                    
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nominal Diskon per Item (Rp)</label>
                      <input type="number" min="0" value={promoForm.discountNominal} onChange={e => setPromoForm({...promoForm, discountNominal: e.target.value})} placeholder="Contoh: 5000" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-amber-500" required/>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Target Cabang / Outlet</label>
                      <select 
                        value={promoForm.outletId || 'all'} 
                        onChange={e => setPromoForm({...promoForm, outletId: e.target.value})}
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs font-bold focus:border-amber-500"
                      >
                        <option value="all">Semua Cabang (Global Promo)</option>
                        {outlets.map(o => (
                          <option key={o.id} value={o.id}>{o.name}</option>
                        ))}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Mulai Tanggal</label>
                        <input type="date" value={promoForm.startDate} onChange={e => setPromoForm({...promoForm, startDate: e.target.value})} className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-amber-500" />
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Sampai Tanggal</label>
                        <input type="date" value={promoForm.endDate} onChange={e => setPromoForm({...promoForm, endDate: e.target.value})} className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-amber-500" />
                      </div>
                    </div>
                    <p className="text-[9px] text-[#3CB371] -mt-2 mb-2 italic">*Kosongkan tanggal jika promo berlaku selamanya.</p>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Pilih Produk Promo</label>
                      <div className="relative mb-2">
                        <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#2E8B57]" />
                        <input 
                          type="text" 
                          placeholder="Cari produk..." 
                          value={promoForm.searchTerm || ''}
                          onChange={e => setPromoForm({...promoForm, searchTerm: e.target.value})}
                          className="w-full bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] px-9 py-2 rounded-xl focus:outline-none focus:border-amber-500 transition-all"
                        />
                      </div>
                      <div className="border border-[#BBF7D0] rounded-xl bg-[#F0FDF4] max-h-48 overflow-y-auto p-2 grid grid-cols-2 gap-2">
                        {products.filter(p => !(promoForm.searchTerm) || (p.name || '').toLowerCase().includes((promoForm.searchTerm || '').toLowerCase())).map(p => (
                          <label key={p.id} className="flex items-center gap-2 text-[11px] font-bold text-[#228B22] cursor-pointer hover:bg-[#DCFCE7] p-1.5 rounded-lg transition-colors">
                            <input 
                              type="checkbox" 
                              checked={promoForm.productIds.includes(p.id)}
                              onChange={(e) => {
                                if (e.target.checked) {
                                  setPromoForm({...promoForm, productIds: [...promoForm.productIds, p.id]});
                                } else {
                                  setPromoForm({...promoForm, productIds: promoForm.productIds.filter(id => id !== p.id)});
                                }
                              }}
                              className="accent-amber-500 rounded-sm"
                            />
                            {p.name}
                          </label>
                        ))}
                      </div>
                    </div>

                    <button type="submit" className="w-full py-2.5 bg-amber-400 hover:bg-amber-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-amber-400/20 transition-colors mt-2">
                      {editingPromo ? 'Simpan Perubahan Promo' : 'Buat Promo'}
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Modal Stok Opname */}
            {isOpnameModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-2xl shadow-2xl relative max-h-[90vh] flex flex-col">
                  <button onClick={() => setIsOpnameModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  <h3 className="text-lg font-black text-[#228B22] mb-2 flex items-center gap-2">
                    <Icon name="package" className="text-orange-400"/> Form Stok Opname
                  </h3>
                  <p className="text-[#2E8B57] text-[11px] mb-4">Outlet: <span className="text-[#228B22] font-bold">{selectedOutletId === 'all' ? 'Pilih Outlet Dulu' : outlets.find(o => o.id === selectedOutletId)?.name}</span></p>

                  <div className="flex-1 overflow-y-auto mb-4 pr-2">
                    {selectedOutletId === 'all' ? (
                      <div className="p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs font-bold">
                        Silakan pilih satu Outlet spesifik terlebih dahulu di menu atas sebelum melakukan Stok Opname.
                      </div>
                    ) : opnameFormItems.length === 0 ? (
                      <div className="p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-400 text-xs">
                        Tidak ada produk aktif untuk outlet ini.
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {opnameFormItems.map(item => (
                          <div key={item.productId} className="flex flex-col sm:flex-row items-start sm:items-center justify-between p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0] gap-3">
                            <div className="flex items-center gap-3 w-full sm:w-auto">
                              <div className="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-[#228B22] border border-[#BBF7D0]">
                                <Icon name="package" size={16}/>
                              </div>
                              <div>
                                <div className="text-[#228B22] font-bold text-sm">{products.find(p => p.id === item.productId)?.name}</div>
                                <div className="text-[10px] text-[#2E8B57]">Stok Sistem: <span className="font-mono text-cyan-400">{item.qtySistem}</span></div>
                              </div>
                            </div>
                            <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                              <div className="flex flex-col text-right">
                                <label className="text-[9px] uppercase text-[#3CB371] font-bold">Stok Fisik</label>
                                <input 
                                  type="number" 
                                  min="0"
                                  value={item.qtyFisik === '' ? '' : item.qtyFisik} 
                                  onChange={e => handleOpnameFisikChange(item.productId, e.target.value)} 
                                  className="w-20 bg-white border border-[#86EFAC] text-[#228B22] font-bold text-center py-1 rounded-lg focus:border-orange-500 focus:outline-none"
                                />
                              </div>
                              <div className="w-16 flex flex-col text-right">
                                <label className="text-[9px] uppercase text-[#3CB371] font-bold">Selisih</label>
                                <span className={`font-black font-mono text-sm ${item.selisih > 0 ? 'text-[#228B22]' : item.selisih < 0 ? 'text-red-400' : 'text-[#3CB371]'}`}>
                                  {item.selisih > 0 ? '+' : ''}{item.selisih}
                                </span>
                              </div>
                            </div>
                            <div className="w-full sm:w-1/3 mt-2 sm:mt-0">
                              <input 
                                type="text" 
                                placeholder="Keterangan (opsional)..." 
                                value={item.keterangan} 
                                onChange={e => {
                                  const newItems = opnameFormItems.map(it => it.productId === item.productId ? { ...it, keterangan: e.target.value } : it);
                                  setOpnameFormItems(newItems);
                                }}
                                className="w-full bg-white border border-[#BBF7D0] text-[10px] text-[#228B22] py-1 px-2 rounded-lg"
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="pt-4 border-t border-[#BBF7D0] flex flex-col sm:flex-row gap-2">
                    <button onClick={() => setIsOpnameModalOpen(false)} className="flex-1 py-2.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-bold text-sm border border-[#86EFAC] transition-colors">Batal</button>
                    <button 
                      onClick={saveStockOpname} 
                      disabled={selectedOutletId === 'all'}
                      className="flex-1 py-2.5 bg-orange-500 hover:bg-orange-600 disabled:bg-[#BBF7D0] disabled:text-[#3CB371] text-[#228B22] rounded-xl font-bold text-sm shadow-lg shadow-orange-500/20 transition-colors flex items-center justify-center gap-2"
                    >
                      <Icon name="check" size={16}/> Simpan Hasil Opname
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Management Pegawai & Owner */}
            {isStaffModalOpen && currentUser.role === 'owner' && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-lg shadow-2xl relative max-h-[90vh] overflow-y-auto">
                  <button onClick={() => setIsStaffModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  <h3 className="text-lg font-black text-[#228B22] mb-4">Manajemen Akun & Karyawan</h3>

                  <div className="space-y-4">
                    <div className="bg-[#F0FDF4] p-4 rounded-2xl border border-[#BBF7D0] space-y-3">
                      <div className="text-xs font-bold text-[#228B22] uppercase">{editingStaff ? 'Edit Akun' : 'Tambah Akun Baru'}</div>
                      <div className="grid grid-cols-2 gap-2">
                        <input type="text" value={staffForm.name} onChange={e => setStaffForm({...staffForm, name: e.target.value})} placeholder="Nama Akun..." className="bg-white border border-[#BBF7D0] rounded-xl px-3 py-2 text-xs text-[#228B22]"/>
                        <input type="text" value={staffForm.password} onChange={e => setStaffForm({...staffForm, password: e.target.value})} placeholder="Password..." className="bg-white border border-[#BBF7D0] rounded-xl px-3 py-2 text-xs text-[#228B22]"/>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <select value={staffForm.role} onChange={e => setStaffForm({...staffForm, role: e.target.value})} className="bg-white border border-[#BBF7D0] rounded-xl px-3 py-1.5 text-xs text-[#228B22]">
                          <option value="cashier">Kasir</option>
                          <option value="owner">Owner</option>
                        </select>
                        {staffForm.role === 'cashier' && (
                          <select value={staffForm.outletId || ''} onChange={e => setStaffForm({...staffForm, outletId: e.target.value})} className="bg-white border border-[#BBF7D0] rounded-xl px-3 py-1.5 text-xs text-[#228B22]">
                            <option value="">- Pilih Outlet -</option>
                            <option value="all">Semua Outlet</option>
                            {outlets.map(o => (
                              <option key={o.id} value={o.id}>{o.name}</option>
                            ))}
                          </select>
                        )}
                      </div>
                      {staffForm.role === 'cashier' && (
                        <div className="bg-white p-3 rounded-xl border border-[#BBF7D0] mt-2">
                          <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-2 block">Hak Akses Menu:</label>
                          <div className="grid grid-cols-2 gap-2">
                            {[
                              { id: 'pos', label: 'Modul Kasir (POS)' },
                              { id: 'sales_report', label: 'Laporan Penjualan' },
                              { id: 'inventory', label: 'Inventaris & Stok' },
                              { id: 'finance', label: 'Keuangan & Saldo Usaha' },
                              { id: 'ai_advisor', label: 'AI Advisor' },
                              { id: 'printer', label: 'Pengaturan Printer' },
                              { id: 'qris_settings', label: 'Pengaturan QRIS' }
                            ].map(menu => (
                              <label key={menu.id} className="flex items-center gap-2 text-xs text-[#228B22] cursor-pointer">
                                <input 
                                  type="checkbox" 
                                  checked={staffForm.access?.includes(menu.id)} 
                                  onChange={(e) => {
                                    const newAccess = e.target.checked 
                                      ? [...(staffForm.access || []), menu.id]
                                      : (staffForm.access || []).filter(a => a !== menu.id);
                                    setStaffForm({ ...staffForm, access: newAccess });
                                  }}
                                  className="rounded border-[#BBF7D0] text-[#32CD32] focus:ring-[#32CD32]"
                                />
                                {menu.label}
                              </label>
                            ))}
                          </div>

                          {staffForm.access?.includes('inventory') && (
                            <div className="mt-3 pt-3 border-t border-[#BBF7D0]">
                              <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-2 block">Sub-Akses Inventaris:</label>
                              <div className="grid grid-cols-2 gap-2">
                                {[
                                  { id: 'inv_add_product', label: 'Tambah Produk' },
                                  { id: 'inv_edit_product', label: 'Edit Produk' },
                                  { id: 'inv_delete_product', label: 'Hapus Produk' },
                                  { id: 'inv_promo', label: 'Kelola Promo' },
                                  { id: 'inv_raw_material', label: 'Bahan Baku' },
                                  { id: 'inv_delete_action', label: 'Aksi Delete (Stok)' }
                                ].map(sub => (
                                  <label key={sub.id} className="flex items-center gap-2 text-[11px] text-[#2E8B57] cursor-pointer pl-2">
                                    <input 
                                      type="checkbox" 
                                      checked={staffForm.access?.includes(sub.id)} 
                                      onChange={(e) => {
                                        const newAccess = e.target.checked 
                                          ? [...(staffForm.access || []), sub.id]
                                          : (staffForm.access || []).filter(a => a !== sub.id);
                                        setStaffForm({ ...staffForm, access: newAccess });
                                      }}
                                      className="rounded border-[#BBF7D0] text-[#32CD32] focus:ring-[#32CD32]"
                                    />
                                    {sub.label}
                                  </label>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      )}
                      <div className="flex justify-end">
                        <button onClick={saveStaff} className="bg-cyan-500 hover:bg-cyan-600 text-[#228B22] font-bold px-4 py-1.5 rounded-xl text-xs">Simpan Akun</button>
                      </div>
                    </div>

                    <div className="max-h-52 overflow-y-auto space-y-2 pr-1">
                      {users.map(u => (
                        <div key={u.id} className="flex justify-between items-center p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0] text-xs">
                          <div>
                            <span className="font-bold text-[#228B22] mr-2">{u.name}</span>
                            <span className={`text-[9px] uppercase px-2 py-0.5 rounded-full font-bold ${u.role === 'owner' ? 'bg-amber-500/20 text-amber-400' : 'bg-cyan-500/20 text-cyan-400'}`}>{u.role}</span>
                            {u.outletId && (
                              <span className="text-[9px] ml-1 px-2 py-0.5 rounded-full bg-[#7CFC00]/10 text-[#228B22] border border-[#228B22]/20 font-bold">
                                <Icon name="store" size={10} className="inline mr-0.5"/> {outlets.find(o => o.id === u.outletId)?.name || u.outletId}
                              </span>
                            )}
                          </div>
                          <div className="flex items-center gap-1">
                            <button onClick={() => { setEditingStaff(u); setStaffForm({ name: u.name, password: u.password, role: u.role, outletId: u.outletId || '', access: u.access || ['pos', 'sales_report', 'inventory'] }); }} className="p-1 text-cyan-400 hover:text-[#228B22]"><Icon name="edit" size={14}/></button>
                            {u.role !== 'owner' && (
                              <button onClick={() => deleteStaff(u.id)} className="p-1 text-red-400 hover:text-[#228B22]"><Icon name="trash" size={14}/></button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Management Outlet */}
            {isOutletModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
                  <button 
                    onClick={() => { 
                      setIsOutletModalOpen(false); 
                      setEditingOutlet(null); 
                      setOutletForm({ name: '', address: '', phone: '' }); 
                    }} 
                    className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"
                  >
                    <Icon name="x" size={18}/>
                  </button>
                  
                  <div className="flex items-center gap-2 mb-4">
                    <div className="w-8 h-8 rounded-xl bg-emerald-100 border border-emerald-300 flex items-center justify-center text-[#228B22]">
                      <Icon name="store" size={18}/>
                    </div>
                    <div>
                      <h3 className="text-lg font-black text-[#228B22]">Manajemen Outlet / Cabang</h3>
                      <p className="text-[11px] text-[#2E8B57]">Kelola daftar cabang usaha dan akses penempatan kasir</p>
                    </div>
                  </div>

                  <div className="space-y-4">
                    {/* Form Tambah / Edit Outlet (Akses Khusus Owner) */}
                    {currentUser.role === 'owner' ? (
                      <div className={`p-4 rounded-2xl border space-y-3 transition-all ${editingOutlet ? 'bg-cyan-50/70 border-cyan-300' : 'bg-[#F0FDF4] border-[#BBF7D0]'}`}>
                        <div className="flex justify-between items-center">
                          <div className="text-xs font-bold text-[#228B22] uppercase flex items-center gap-1.5">
                            <Icon name={editingOutlet ? 'edit' : 'plus'} size={13} className={editingOutlet ? 'text-cyan-600' : 'text-[#228B22]'}/>
                            {editingOutlet ? `Edit Data Outlet: ${editingOutlet.name}` : 'Tambah Outlet Baru'}
                          </div>
                          {editingOutlet && (
                            <button
                              type="button"
                              onClick={cancelEditOutlet}
                              className="text-[10px] text-amber-700 bg-amber-100 hover:bg-amber-200 border border-amber-300 px-2 py-0.5 rounded-md font-bold transition-colors"
                            >
                              Batal Edit
                            </button>
                          )}
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nama Outlet <span className="text-red-500">*</span></label>
                          <input 
                            type="text" 
                            value={outletForm.name} 
                            onChange={e => setOutletForm({...outletForm, name: e.target.value})} 
                            placeholder="Cth: Outlet Cabang Barat" 
                            className="w-full bg-white border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:outline-none focus:border-[#228B22]"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Alamat Lapak / Lokasi</label>
                          <input 
                            type="text" 
                            value={outletForm.address} 
                            onChange={e => setOutletForm({...outletForm, address: e.target.value})} 
                            placeholder="Cth: Jl. Ahmad Yani No. 12" 
                            className="w-full bg-white border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:outline-none focus:border-[#228B22]"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">No. Telepon / WhatsApp (Opsional)</label>
                          <input 
                            type="text" 
                            value={outletForm.phone} 
                            onChange={e => setOutletForm({...outletForm, phone: e.target.value})} 
                            placeholder="Cth: 08123456789" 
                            className="w-full bg-white border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:outline-none focus:border-[#228B22]"
                          />
                        </div>
                        <div className="flex gap-2 pt-1">
                          <button 
                            onClick={saveOutlet} 
                            className={`flex-1 font-bold py-2.5 rounded-xl text-xs transition-all shadow-sm ${
                              editingOutlet 
                                ? 'bg-cyan-600 hover:bg-cyan-700 text-white shadow-cyan-600/30' 
                                : 'bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22]'
                            }`}
                          >
                            {editingOutlet ? 'Simpan Perubahan Outlet' : 'Simpan Outlet Baru'}
                          </button>
                          {editingOutlet && (
                            <button
                              onClick={cancelEditOutlet}
                              className="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold transition-colors"
                            >
                              Batal
                            </button>
                          )}
                        </div>
                      </div>
                    ) : (
                      <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-[11px] text-amber-800">
                        Hanya Owner yang berhak menambah, mengedit, atau menghapus outlet.
                      </div>
                    )}

                    {/* Daftar Outlet */}
                    <div>
                      <div className="flex justify-between items-center mb-1.5 px-1">
                        <span className="text-[10px] font-bold text-[#2E8B57] uppercase tracking-wider">Daftar Cabang Aktif ({outlets.length})</span>
                        {currentUser.role === 'owner' && (
                          <span className="text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-medium">Akses Penuh Owner</span>
                        )}
                      </div>
                      <div className="max-h-56 overflow-y-auto space-y-2 pr-1">
                        {outlets.map(o => (
                          <div 
                            key={o.id} 
                            className={`flex justify-between items-center p-3 rounded-xl border text-xs transition-all ${
                              editingOutlet?.id === o.id 
                                ? 'bg-cyan-50 border-cyan-400 ring-2 ring-cyan-400/20' 
                                : 'bg-[#F0FDF4] border-[#BBF7D0]'
                            }`}
                          >
                            <div className="flex-1 pr-2">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="font-bold text-[#228B22] flex items-center">
                                  <Icon name="store" size={12} className="inline text-[#228B22] mr-1"/>
                                  {o.name}
                                </span>
                                {selectedOutletId === o.id && (
                                  <span className="text-[9px] bg-emerald-100 text-emerald-800 border border-emerald-300 px-1.5 py-0.2 rounded-md font-bold">
                                    Aktif di Filter
                                  </span>
                                )}
                                {editingOutlet?.id === o.id && (
                                  <span className="text-[9px] bg-cyan-100 text-cyan-800 border border-cyan-300 px-1.5 py-0.2 rounded-md font-bold animate-pulse">
                                    Sedang Diedit
                                  </span>
                                )}
                              </div>
                              {o.address && <span className="text-[#3CB371] text-[10px] block mt-0.5">{o.address}</span>}
                              {o.phone && <span className="text-[#2E8B57] text-[10px] block font-mono">Telp: {o.phone}</span>}
                            </div>
                            {currentUser.role === 'owner' && (
                              <div className="flex items-center gap-1.5">
                                <button 
                                  onClick={() => startEditOutlet(o)} 
                                  className={`p-1.5 rounded-lg border text-xs font-bold transition-colors ${
                                    editingOutlet?.id === o.id 
                                      ? 'bg-cyan-600 text-white border-cyan-600' 
                                      : 'bg-white hover:bg-cyan-50 text-cyan-600 border-cyan-200'
                                  }`}
                                  title="Edit Outlet"
                                >
                                  <Icon name="edit" size={13}/>
                                </button>
                                {outlets.length > 1 ? (
                                  <button 
                                    onClick={() => deleteOutlet(o.id)} 
                                    className="p-1.5 bg-white hover:bg-red-50 text-red-500 border border-red-200 rounded-lg text-xs font-bold transition-colors" 
                                    title="Hapus Outlet"
                                  >
                                    <Icon name="trash" size={13}/>
                                  </button>
                                ) : (
                                  <button 
                                    disabled 
                                    className="p-1.5 bg-gray-50 text-gray-300 border border-gray-200 rounded-lg text-xs cursor-not-allowed" 
                                    title="Minimal 1 outlet aktif (tidak bisa dihapus)"
                                  >
                                    <Icon name="trash" size={13}/>
                                  </button>
                                )}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Record Expense */}
            {isExpenseModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
                  <button onClick={() => setIsExpenseModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  <h3 className="text-lg font-black text-[#228B22] mb-4">Catat Pengeluaran Baru</h3>

                  <div className="space-y-3">
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Kategori Pengeluaran</label>
                      <select value={expenseForm.category} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22]">
                        <option value="Bahan Baku">Belanja Bahan Baku</option>
                        <option value="Sewa">Biaya Sewa</option>
                        <option value="Gaji">Gaji Karyawan</option>
                        <option value="Operasional Lainnya">Operasional Lainnya</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Sumber Dana (Dipotong Dari)</label>
                      <select value={expenseForm.paymentSource || 'cash'} onChange={e => setExpenseForm({...expenseForm, paymentSource: e.target.value})} className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] font-bold">
                        <option value="cash">Kas Fisik Tunai (Laci Kasir)</option>
                        <option value="bank">Rekening Bank (Transfer / Debit)</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Keterangan / Item</label>
                      <input type="text" value={expenseForm.title} onChange={e => setExpenseForm({...expenseForm, title: e.target.value})} placeholder="Cth: Beli Buah Alpukat 10kg" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22]"/>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nominal (Rp)</label>
                      <input type="number" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} placeholder="0" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22]"/>
                    </div>

                    <button onClick={saveExpense} className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl text-xs mt-2 transition-all shadow-md shadow-purple-600/20">
                      Simpan Catatan Pengeluaran
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Record Income (Catat Pemasukan Saldo Usaha) */}
            {isIncomeModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm animate-in fade-in duration-150">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
                  <button onClick={() => setIsIncomeModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  
                  <div className="flex items-center gap-2.5 mb-4">
                    <div className="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                      <Icon name="arrow-down-left" size={18}/>
                    </div>
                    <div>
                      <h3 className="text-base font-black text-[#228B22] leading-tight">Catat Pemasukan Saldo</h3>
                      <p className="text-[11px] text-[#2E8B57]">Suntikan modal / penerimaan dana usaha</p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Kategori Pemasukan</label>
                      <select 
                        value={incomeForm.category} 
                        onChange={e => setIncomeForm({...incomeForm, category: e.target.value})} 
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] font-bold"
                      >
                        <option value="Modal Tambahan">Suntikan Modal Usaha / Owner</option>
                        <option value="Pendapatan Non-Penjualan">Pendapatan Non-Penjualan (Bunga, Bonus, dll)</option>
                        <option value="Pelunasan Piutang">Pelunasan Piutang / Titipan</option>
                        <option value="Pemasukan Lainnya">Pemasukan Lainnya</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Tujuan Saldo (Disimpan Ke)</label>
                      <select 
                        value={incomeForm.paymentDestination || 'cash'} 
                        onChange={e => setIncomeForm({...incomeForm, paymentDestination: e.target.value})} 
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] font-bold"
                      >
                        <option value="cash">Kas Fisik Tunai (Laci Kasir / Toko)</option>
                        <option value="bank">Rekening Bank (Digital / Transfer)</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Keterangan / Uraian</label>
                      <input 
                        type="text" 
                        value={incomeForm.title} 
                        onChange={e => setIncomeForm({...incomeForm, title: e.target.value})} 
                        placeholder="Cth: Suntikan modal kas awal operasional" 
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:outline-none focus:border-[#7CFC00]"
                      />
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nominal Pemasukan (Rp)</label>
                      <input 
                        type="number" 
                        value={incomeForm.amount} 
                        onChange={e => setIncomeForm({...incomeForm, amount: e.target.value})} 
                        placeholder="0" 
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] font-black focus:outline-none focus:border-[#7CFC00]"
                      />
                    </div>

                    <button 
                      onClick={saveIncome} 
                      className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 rounded-xl text-xs mt-2 transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-1.5 active:scale-95"
                    >
                      <Icon name="check-circle" size={15}/> Simpan Catatan Pemasukan
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Otorisasi Diskon oleh Owner */}
            {isDiscountAuthModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm animate-in fade-in duration-150">
                <div className="bg-white border-2 border-amber-300 rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
                  <button 
                    onClick={() => {
                      setIsDiscountAuthModalOpen(false);
                      setDiscountAuthInput('');
                      setDiscountAuthError('');
                    }} 
                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-1.5"
                  >
                    <Icon name="x" size={18}/>
                  </button>

                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-11 h-11 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-inner">
                      <Icon name="shield" size={22}/>
                    </div>
                    <div>
                      <span className="text-[10px] text-amber-700 font-extrabold uppercase tracking-wider bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-md">
                        Otorisasi Khusus
                      </span>
                      <h3 className="text-base font-black text-slate-900 leading-snug mt-0.5">Otorisasi Diskon Owner</h3>
                    </div>
                  </div>

                  <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                    Pemberian potongan harga / diskon kasir memerlukan verifikasi Password / PIN Owner toko.
                  </p>

                  <form 
                    onSubmit={e => {
                      e.preventDefault();
                      const owners = users.filter(u => u.role === 'owner');
                      const pass = (discountAuthInput || '').trim();
                      const isOwnerValid = owners.some(o => (o.password || '').trim() === pass);
                      if (isOwnerValid) {
                        setDiscountNominal(pendingDiscountValue || '0');
                        setIsDiscountAuthModalOpen(false);
                        setDiscountAuthInput('');
                        setDiscountAuthError('');
                        showToast('Diskon berhasil disetujui Owner!', 'success');
                      } else {
                        setDiscountAuthError('Password Owner salah! Diskon tidak dapat diberikan.');
                      }
                    }}
                    className="space-y-3.5"
                  >
                    <div>
                      <label className="text-[10px] font-bold text-slate-600 mb-1 block uppercase">Nominal Diskon (Rp)</label>
                      <div className="relative">
                        <span className="absolute left-3 top-2.5 text-xs font-bold text-amber-600">Rp</span>
                        <input 
                          type="number" 
                          min="0"
                          value={pendingDiscountValue} 
                          onChange={e => setPendingDiscountValue(e.target.value)} 
                          placeholder="0" 
                          className="w-full bg-amber-50/50 border border-amber-200 rounded-xl pl-9 pr-3 py-2 text-sm text-slate-900 font-black focus:border-amber-400 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-slate-600 mb-1 block uppercase">
                        Password / PIN Akun Owner <span className="text-red-500">*</span>
                      </label>
                      <input 
                        type="password" 
                        autoFocus
                        value={discountAuthInput} 
                        onChange={e => {
                          setDiscountAuthInput(e.target.value);
                          if (discountAuthError) setDiscountAuthError('');
                        }} 
                        placeholder="Masukkan password akun owner..." 
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 font-medium focus:border-amber-400 focus:outline-none"
                      />
                      {discountAuthError && (
                        <p className="text-[11px] text-red-600 font-bold mt-1.5 flex items-center gap-1">
                          <Icon name="alert-circle" size={13}/> {discountAuthError}
                        </p>
                      )}
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button 
                        type="button" 
                        onClick={() => {
                          setIsDiscountAuthModalOpen(false);
                          setDiscountAuthInput('');
                          setDiscountAuthError('');
                        }}
                        className="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs transition-colors"
                      >
                        Batal
                      </button>
                      <button 
                        type="submit" 
                        className="py-2.5 px-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-black text-xs shadow-md shadow-amber-500/20 transition-all flex items-center justify-center gap-1 active:scale-95"
                      >
                        <Icon name="check-circle" size={15}/> Setujui Diskon
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal Transfer Saldo Internal (Kas <-> Bank) */}
            {isTransferModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
                  <button onClick={() => setIsTransferModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>

                  <div className="flex items-center gap-3 mb-5">
                    <div className="w-12 h-12 bg-blue-50 border border-blue-200 rounded-2xl flex items-center justify-center text-blue-600">
                      <Icon name="arrow-right-left" size={24}/>
                    </div>
                    <div>
                      <span className="text-[10px] text-blue-600 font-bold uppercase tracking-wider">Mutasi Saldo Internal</span>
                      <h3 className="text-lg font-black text-[#228B22]">Pindah Saldo Kas & Bank</h3>
                    </div>
                  </div>

                  <form onSubmit={saveTransfer} className="space-y-4">
                    {/* Pilihan Arah Transfer */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1.5 block">Arah Pemindahan Saldo <span className="text-red-500">*</span></label>
                      <div className="grid grid-cols-2 gap-2">
                        <button 
                          type="button" 
                          onClick={() => setTransferForm(f => ({ ...f, type: 'cash_to_bank', note: 'Setoran kasir ke rekening bank' }))}
                          className={`p-3 rounded-2xl border text-left transition-all ${
                            transferForm.type === 'cash_to_bank' 
                              ? 'bg-emerald-50 border-emerald-400 text-emerald-900 shadow-sm' 
                              : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                          }`}
                        >
                          <div className="font-bold text-xs flex items-center gap-1.5">
                            <Icon name="banknote" size={14} className="text-emerald-600"/> Kas <Icon name="arrow-right" size={12} className="inline"/> Bank
                          </div>
                          <div className="text-[10px] text-slate-500 mt-1">Setor Uang Kasir ke Bank</div>
                        </button>

                        <button 
                          type="button" 
                          onClick={() => setTransferForm(f => ({ ...f, type: 'bank_to_cash', note: 'Tarik tunai dari bank untuk kasir' }))}
                          className={`p-3 rounded-2xl border text-left transition-all ${
                            transferForm.type === 'bank_to_cash' 
                              ? 'bg-cyan-50 border-cyan-400 text-cyan-900 shadow-sm' 
                              : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                          }`}
                        >
                          <div className="font-bold text-xs flex items-center gap-1.5">
                            <Icon name="credit-card" size={14} className="text-cyan-600"/> Bank <Icon name="arrow-right" size={12} className="inline"/> Kas
                          </div>
                          <div className="text-[10px] text-slate-500 mt-1">Tarik Uang Bank ke Kasir</div>
                        </button>
                      </div>
                    </div>

                    {/* Info Saldo Sumber */}
                    <div className="p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0] flex justify-between items-center text-xs">
                      <span className="text-[#2E8B57] font-medium">
                        {transferForm.type === 'cash_to_bank' ? 'Saldo Kas Tunai Saat Ini:' : 'Saldo Bank Saat Ini:'}
                      </span>
                      <span className="font-black text-[#228B22]">
                        {formatRp(transferForm.type === 'cash_to_bank' ? saldoKasFisik : saldoBank)}
                      </span>
                    </div>

                    {/* Nominal Input */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1.5 block">Nominal yang Dipindahkan (Rp) <span className="text-red-500">*</span></label>
                      <input 
                        type="text" 
                        value={transferForm.amount ? formatRp(parseFloat(transferForm.amount.toString().replace(/\D/g, '')) || 0) : ''}
                        onChange={e => {
                          const raw = e.target.value.replace(/\D/g, '');
                          setTransferForm(f => ({ ...f, amount: raw }));
                        }}
                        placeholder="Rp 0" 
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] focus:border-[#228B22] rounded-xl px-4 py-2.5 text-lg font-black text-[#228B22] text-right focus:outline-none"
                        required
                      />

                      {/* Quick Nominal Buttons */}
                      <div className="grid grid-cols-4 gap-1.5 mt-2">
                        <button 
                          type="button" 
                          onClick={() => setTransferForm(f => ({ ...f, amount: (transferForm.type === 'cash_to_bank' ? Math.max(0, saldoKasFisik) : Math.max(0, saldoBank)).toString() }))}
                          className="py-1 px-1 rounded-lg text-[10px] font-bold bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] border border-[#86EFAC]"
                        >
                          Semua Saldo
                        </button>
                        {['100000', '500000', '1000000'].map(val => (
                          <button 
                            type="button" 
                            key={val}
                            onClick={() => setTransferForm(f => ({ ...f, amount: val }))}
                            className="py-1 px-1 rounded-lg text-[10px] font-bold bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] border border-[#86EFAC]"
                          >
                            {val === '100000' ? '100rb' : val === '500000' ? '500rb' : '1 Jt'}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Catatan / Keterangan */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1 block">Catatan / Rekening Tujuan</label>
                      <input 
                        type="text" 
                        value={transferForm.note}
                        onChange={e => setTransferForm(f => ({ ...f, note: e.target.value }))}
                        placeholder="Cth: Setor tunai harian ke Rekening BCA / Mandiri"
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:outline-none"
                      />
                    </div>

                    {/* Tanggal & Waktu */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1 block">Tanggal & Jam</label>
                      <input 
                        type="datetime-local" 
                        value={transferForm.date}
                        onChange={e => setTransferForm(f => ({ ...f, date: e.target.value }))}
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:outline-none"
                      />
                    </div>

                    {/* Action Buttons */}
                    <div className="pt-2 flex gap-2">
                      <button 
                        type="button" 
                        onClick={() => setIsTransferModalOpen(false)} 
                        className="flex-1 py-2.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-bold text-xs transition-colors"
                      >
                        Batal
                      </button>
                      <button 
                        type="submit" 
                        className="flex-1 py-2.5 bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] rounded-xl font-black text-xs shadow-lg shadow-[#7CFC00]/20 transition-all flex items-center justify-center gap-1.5"
                      >
                        <Icon name="check-circle" size={16}/> Simpan Pemindahan
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal Product */}
            {isProductModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-lg shadow-2xl relative">
                  <button onClick={() => setIsProductModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  <h3 className="text-lg font-black text-[#228B22] mb-5">{editingProduct ? 'Edit Produk' : 'Tambah Produk Baru'}{selectedOutletId !== 'all' ? ` (${outlets.find(o => o.id === selectedOutletId)?.name || 'Cabang'})` : ' (Semua Cabang)'}</h3>
                  
                  <div className="space-y-4">
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nama Produk</label>
                      <input type="text" value={productForm.name} onChange={e => setProductForm({...productForm, name: e.target.value})} placeholder="Contoh: Jus Mangga Super" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-cyan-500"/>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Kategori</label>
                      <input 
                        list="category-list" 
                        value={productForm.category} 
                        onChange={e => setProductForm({...productForm, category: e.target.value})} 
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22]" 
                        placeholder="Pilih atau ketik kategori baru" 
                      />
                      <datalist id="category-list">
                        {categories.filter(c => c !== 'Semua').map(c => (
                          <option key={c} value={c} />
                        ))}
                      </datalist>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">HPP (Modal Rp)</label>
                        <input type="number" value={productForm.costPrice} onChange={e => setProductForm({...productForm, costPrice: e.target.value})} placeholder="0" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-cyan-500"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Harga Jual (Rp)</label>
                        <input type="number" value={productForm.price} onChange={e => setProductForm({...productForm, price: e.target.value})} placeholder="0" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-cyan-500"/>
                      </div>
                    </div>

                    {/* Stock Mode Selection */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-[10px] font-bold text-[#2E8B57] block uppercase">Mode Pengelolaan Stok</label>
                        <span className="text-[10px] text-[#228B22] font-bold">Cabang: {selectedOutletId === 'all' ? (outlets[0]?.name || 'Semua Cabang') : (outlets.find(o => o.id === selectedOutletId)?.name || 'Cabang')}</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2 bg-[#F0FDF4] border border-[#BBF7D0] p-1.5 rounded-2xl">
                        <button type="button" onClick={() => setProductForm({...productForm, isUnlimited: false})} className={`py-2 text-xs font-bold rounded-xl transition-all ${!productForm.isUnlimited ? 'bg-[#DCFCE7] text-[#228B22] shadow' : 'text-[#3CB371]'}`}>
                          Stok Terbatas
                        </button>
                        <button type="button" onClick={() => setProductForm({...productForm, isUnlimited: true})} className={`py-2 text-xs font-bold rounded-xl transition-all ${productForm.isUnlimited ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'text-[#3CB371]'}`}>
                          Tak Terbatas
                        </button>
                      </div>

                      {!productForm.isUnlimited && (
                        <div className="grid grid-cols-2 gap-3 mt-3">
                          <div>
                            <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Jumlah Stok Physical</label>
                            <input type="number" value={productForm.stock} onChange={e => setProductForm({...productForm, stock: e.target.value})} className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-cyan-500"/>
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Minimal Alert Stock</label>
                            <input type="number" value={productForm.minStock} onChange={e => setProductForm({...productForm, minStock: e.target.value})} className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-xs focus:border-cyan-500"/>
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="pt-3 border-t border-[#BBF7D0]">
                      <div className="flex items-center justify-between mb-2">
                        <label className="text-[10px] font-bold text-[#2E8B57] uppercase">Resep Bahan Baku (Opsional)</label>
                        <button onClick={() => setProductForm({...productForm, recipe: [...(productForm.recipe || []), { materialId: '', qty: 1 }]})} className="text-[9px] bg-purple-500/10 text-purple-600 px-2 py-1 rounded border border-purple-500/30 hover:bg-purple-500/20 font-bold flex items-center gap-1">
                          <Icon name="plus" size={10}/> Tambah Bahan
                        </button>
                      </div>
                      <div className="space-y-2 max-h-32 overflow-y-auto pr-1">
                        {(!productForm.recipe || productForm.recipe.length === 0) ? (
                          <div className="text-[10px] text-slate-500 italic text-center py-2 bg-slate-50 rounded-xl border border-slate-200">
                            Tidak ada resep. Stok akan dikurangi langsung dari produk.
                          </div>
                        ) : (
                          productForm.recipe.map((bahan, idx) => (
                            <div key={idx} className="flex items-center gap-2">
                              <select 
                                value={bahan.materialId}
                                onChange={(e) => {
                                  const newRecipe = [...productForm.recipe];
                                  newRecipe[idx].materialId = e.target.value;
                                  setProductForm({...productForm, recipe: newRecipe});
                                }}
                                className="flex-1 bg-[#F0FDF4] border border-[#BBF7D0] rounded-lg px-2 py-1.5 text-[11px] text-[#228B22] focus:border-purple-500"
                              >
                                <option value="">Pilih Bahan...</option>
                                {rawMaterials.map(rm => (
                                  <option key={rm.id} value={rm.id}>{rm.name} ({rm.unit})</option>
                                ))}
                              </select>
                              <input 
                                type="number" 
                                min="0.1" 
                                step="any"
                                value={bahan.qty}
                                onChange={(e) => {
                                  const newRecipe = [...productForm.recipe];
                                  newRecipe[idx].qty = Number(e.target.value);
                                  setProductForm({...productForm, recipe: newRecipe});
                                }}
                                className="w-16 bg-[#F0FDF4] border border-[#BBF7D0] rounded-lg px-2 py-1.5 text-[11px] text-[#228B22] focus:border-purple-500 text-center"
                              />
                              <button 
                                onClick={() => {
                                  const newRecipe = productForm.recipe.filter((_, i) => i !== idx);
                                  setProductForm({...productForm, recipe: newRecipe});
                                }}
                                className="p-1.5 text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 rounded-lg"
                              >
                                <Icon name="trash" size={12}/>
                              </button>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    <button onClick={saveProduct} className="w-full mt-2 bg-cyan-500 hover:bg-cyan-600 text-[#228B22] font-bold py-3 px-4 rounded-xl text-xs transition-all shadow-lg shadow-cyan-500/20">
                      {editingProduct ? 'Simpan Perubahan' : 'Tambahkan Produk Baru'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Pengaturan Printer & Live Preview */}
            {isPrinterModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-4xl shadow-2xl relative max-h-[92vh] flex flex-col">
                  <button onClick={() => setIsPrinterModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  
                  <div className="mb-4 pb-3 border-b border-[#BBF7D0]">
                    <div className="inline-flex items-center gap-1.5 bg-[#7CFC00]/10 border border-[#228B22]/30 px-3 py-1 rounded-full text-xs font-bold text-[#228B22] mb-1">
                      <Icon name="printer" size={13}/> KONFIGURASI STRUK THERMAL
                    </div>
                    <h3 className="text-xl font-black text-[#228B22]">Pengaturan Printer & Format Struk</h3>
                    <p className="text-xs text-[#2E8B57]">Sesuaikan logo, nama usaha, info outlet, ukuran kertas, dan tulisan penutup struk dengan live preview real-time.</p>
                  </div>

                  <div className="flex-1 overflow-y-auto grid grid-cols-1 lg:grid-cols-12 gap-6 pr-1">
                    {/* Sisi Kiri: Form Pengaturan */}
                    <div className="lg:col-span-7 space-y-4">
                      {/* Logo Upload */}
                      <div className="bg-[#F0FDF4] p-4 rounded-2xl border border-[#BBF7D0] space-y-3">
                        <label className="text-[10px] font-bold text-[#2E8B57] block uppercase">Logo Usaha (JPG / PNG)</label>
                        <div className="flex items-center gap-3">
                          <input 
                            type="file" 
                            accept="image/*" 
                            onChange={handlePrinterLogoUpload} 
                            className="w-full text-xs text-[#2E8B57] file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#DCFCE7] file:text-[#228B22] hover:file:bg-[#BBF7D0] cursor-pointer" 
                          />
                        </div>
                        {printerForm.logo && (
                          <div className="flex items-center justify-between p-2 bg-white rounded-xl border border-[#BBF7D0]">
                            <img src={printerForm.logo} alt="Preview Logo" className="max-h-12 max-w-[120px] object-contain" />
                            <button onClick={() => setPrinterForm({ ...printerForm, logo: '' })} className="text-xs text-red-500 hover:text-red-700 font-bold px-2 py-1 bg-red-50 rounded-lg">Hapus Logo</button>
                          </div>
                        )}
                      </div>

                      {/* Header Toko / Brand Name */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nama Usaha / Brand</label>
                          <input 
                            type="text" 
                            value={printerForm.brandName || ''} 
                            onChange={e => setPrinterForm({ ...printerForm, brandName: e.target.value })} 
                            placeholder="Cth: BosJusPos" 
                            className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] font-bold focus:border-[#7CFC00] focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Slogan / Tagline</label>
                          <input 
                            type="text" 
                            value={printerForm.tagline || ''} 
                            onChange={e => setPrinterForm({ ...printerForm, tagline: e.target.value })}
