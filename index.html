                            placeholder="Cth: Jus Buah Segar & Sehat" 
                            className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:border-[#7CFC00] focus:outline-none"
                          />
                        </div>
                      </div>

                      {/* Info Outlet & Kontak */}
                      <div className="bg-[#F0FDF4] p-4 rounded-2xl border border-[#BBF7D0] space-y-3">
                        <div className="flex items-center justify-between">
                          <label className="text-xs font-bold text-[#228B22]">Tampilkan Nama & Alamat Outlet</label>
                          <input 
                            type="checkbox" 
                            checked={printerForm.showOutletInfo !== false} 
                            onChange={e => setPrinterForm({ ...printerForm, showOutletInfo: e.target.checked })} 
                            className="w-4 h-4 text-[#228B22] rounded accent-[#228B22] cursor-pointer"
                          />
                        </div>
                        <p className="text-[10px] text-[#2E8B57] -mt-1">
                          Nama outlet kasir (cth: <i>{outlets.find(o => o.id === selectedOutletId)?.name || 'Outlet Utama'}</i>) & alamat akan tercetak otomatis di bawah judul struk.
                        </p>
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">No. Telp / WhatsApp Toko (Opsional)</label>
                          <input 
                            type="text" 
                            value={printerForm.phone || ''} 
                            onChange={e => setPrinterForm({ ...printerForm, phone: e.target.value })} 
                            placeholder="Cth: 0812-3456-7890 / WA Order" 
                            className="w-full bg-white border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] focus:border-[#7CFC00] focus:outline-none"
                          />
                        </div>
                      </div>

                      {/* Ukuran Kertas Struk */}
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1.5 block uppercase">Lebar Kertas Printer Thermal</label>
                        <div className="grid grid-cols-2 gap-3">
                          <button 
                            type="button"
                            onClick={() => setPrinterForm({ ...printerForm, paperWidth: '58mm' })}
                            className={`py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border transition-all ${
                              (printerForm.paperWidth || '58mm') === '58mm'
                                ? 'bg-[#7CFC00] text-[#228B22] border-[#228B22] shadow-sm ring-2 ring-[#7CFC00]/30'
                                : 'bg-[#F0FDF4] text-[#2E8B57] border-[#BBF7D0]'
                            }`}
                          >
                            <span>58 mm (Printer Mini / Portable)</span>
                          </button>
                          <button 
                            type="button"
                            onClick={() => setPrinterForm({ ...printerForm, paperWidth: '80mm' })}
                            className={`py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border transition-all ${
                              printerForm.paperWidth === '80mm'
                                ? 'bg-[#7CFC00] text-[#228B22] border-[#228B22] shadow-sm ring-2 ring-[#7CFC00]/30'
                                : 'bg-[#F0FDF4] text-[#2E8B57] border-[#BBF7D0]'
                            }`}
                          >
                            <span>80 mm (Printer Standar POS)</span>
                          </button>
                        </div>
                      </div>

                      {/* Custom Tulisan Footer Bawah Struk */}
                      <div className="space-y-2.5">
                        <label className="text-[10px] font-bold text-[#2E8B57] block uppercase">Tulisan di Bawah Struk (Footer Notes)</label>
                        
                        <div>
                          <span className="text-[10px] text-[#2E8B57] font-semibold">Baris 1 (Ucapan Terima Kasih):</span>
                          <input 
                            type="text" 
                            value={printerForm.footerMessage1 || ''} 
                            onChange={e => setPrinterForm({ ...printerForm, footerMessage1: e.target.value })} 
                            placeholder="Cth: Terima Kasih atas Kunjungan Anda!" 
                            className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3 py-1.5 text-xs text-[#228B22] mt-0.5"
                          />
                        </div>

                        <div>
                          <span className="text-[10px] text-[#2E8B57] font-semibold">Baris 2 (Social Media / Promo / WiFi):</span>
                          <input 
                            type="text" 
                            value={printerForm.footerMessage2 || ''} 
                            onChange={e => setPrinterForm({ ...printerForm, footerMessage2: e.target.value })} 
                            placeholder="Cth: Follow IG: @bosjus | Free WiFi: jus123" 
                            className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3 py-1.5 text-xs text-[#228B22] mt-0.5"
                          />
                        </div>

                        <div>
                          <span className="text-[10px] text-[#2E8B57] font-semibold">Baris 3 (Catatan Kebijakan):</span>
                          <input 
                            type="text" 
                            value={printerForm.footerMessage3 || ''} 
                            onChange={e => setPrinterForm({ ...printerForm, footerMessage3: e.target.value })} 
                            placeholder="Cth: Barang yang sudah dibeli tidak dapat ditukar" 
                            className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3 py-1.5 text-xs text-[#228B22] mt-0.5"
                          />
                        </div>
                      </div>
                    </div>

                    {/* Sisi Kanan: Live Real-time Thermal Receipt Preview */}
                    <div className="lg:col-span-5 flex flex-col items-center bg-slate-100 p-4 rounded-2xl border border-slate-200">
                      <div className="text-[10px] font-bold text-slate-500 uppercase mb-2 flex items-center gap-1">
                        <Icon name="eye" size={13}/> Live Preview Struk ({printerForm.paperWidth || '58mm'})
                      </div>

                      {/* Paper Simulation */}
                      <div 
                        className={`bg-white border border-slate-300 shadow-xl rounded-lg p-4 font-mono text-slate-900 transition-all ${
                          printerForm.paperWidth === '80mm' ? 'w-full max-w-[340px] text-xs' : 'w-full max-w-[280px] text-[11px]'
                        }`}
                        style={{ filter: 'drop-shadow(0 4px 6px rgba(0,0,0,0.1))' }}
                      >
                        {/* Header Struk Preview */}
                        <div className="text-center pb-2 border-b border-dashed border-slate-400 space-y-1">
                          {printerForm.logo && (
                            <div className="mb-1 flex justify-center">
                              <img src={printerForm.logo} alt="Logo" className="max-h-12 object-contain" />
                            </div>
                          )}
                          <div className="font-black text-sm uppercase">{printerForm.brandName || 'BosJusPos'}</div>
                          {printerForm.tagline && (
                            <div className="text-[10px] text-slate-600">{printerForm.tagline}</div>
                          )}
                          {printerForm.showOutletInfo !== false && (
                            <div className="text-[10px] font-bold text-slate-700">
                              {outlets.find(o => o.id === selectedOutletId)?.name || 'Outlet Cabang Utama'}
                              {outlets.find(o => o.id === selectedOutletId)?.address ? ` - ${outlets.find(o => o.id === selectedOutletId).address}` : ''}
                            </div>
                          )}
                          {printerForm.phone && (
                            <div className="text-[9px] text-slate-500">Telp/WA: {printerForm.phone}</div>
                          )}
                          
                          <div className="my-1 py-0.5 px-1.5 bg-slate-100 border border-slate-300 rounded font-bold text-[9px] uppercase tracking-wider">
                            * LUNAS *
                          </div>

                          <div className="text-[9px] text-slate-600">
                            Dine In - Meja 3
                          </div>
                          <div className="text-[9px] text-slate-500">
                            INV-SAMPLE - {new Date().toLocaleDateString('id-ID')} {new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}
                          </div>
                          <div className="text-[9px] text-slate-500">Kasir: {currentUser.name}</div>
                        </div>

                        {/* Items Sample */}
                        <div className="py-2 border-b border-dashed border-slate-400 space-y-1">
                          <div className="flex justify-between">
                            <span>1x Jus Alpukat Kocok</span>
                            <span className="font-bold">18.000</span>
                          </div>
                          <div className="flex justify-between">
                            <span>2x Jus Mangga Harum Manis</span>
                            <span className="font-bold">30.000</span>
                          </div>
                        </div>

                        {/* Totals Sample */}
                        <div className="py-2 border-b border-dashed border-slate-400 space-y-0.5">
                          <div className="flex justify-between">
                            <span>Subtotal</span>
                            <span>48.000</span>
                          </div>
                          <div className="flex justify-between">
                            <span>Diskon</span>
                            <span>-3.000</span>
                          </div>
                          <div className="flex justify-between font-black text-xs pt-1 border-t border-slate-200">
                            <span>TOTAL</span>
                            <span>45.000</span>
                          </div>
                          <div className="flex justify-between text-[10px] pt-1">
                            <span>Metode: TUNAI</span>
                            <span>50.000</span>
                          </div>
                          <div className="flex justify-between text-[10px] font-bold">
                            <span>Kembalian</span>
                            <span>5.000</span>
                          </div>
                        </div>

                        {/* Footer Message Live Preview */}
                        <div className="pt-2 text-center space-y-1 text-[10px] text-slate-600">
                          {printerForm.footerMessage1 && (
                            <div className="font-bold">{printerForm.footerMessage1}</div>
                          )}
                          {printerForm.footerMessage2 && (
                            <div className="text-[9px]">{printerForm.footerMessage2}</div>
                          )}
                          {printerForm.footerMessage3 && (
                            <div className="text-[8px] text-slate-400 italic pt-0.5">{printerForm.footerMessage3}</div>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Action Buttons */}
                  <div className="pt-4 mt-2 border-t border-[#BBF7D0] flex flex-col sm:flex-row gap-2 justify-end">
                    <button 
                      type="button" 
                      onClick={() => setIsPrinterModalOpen(false)} 
                      className="px-5 py-2.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-bold text-xs transition-colors"
                    >
                      Batal
                    </button>
                    <button 
                      type="button" 
                      onClick={() => {
                        setPrinterSettings(printerForm);
                        setIsPrinterModalOpen(false);
                        showToast('Pengaturan printer dan format struk berhasil disimpan!');
                      }} 
                      className="px-6 py-2.5 bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] rounded-xl font-black text-xs shadow-lg shadow-[#7CFC00]/20 transition-all flex items-center justify-center gap-1.5"
                    >
                      <Icon name="check-circle" size={16}/> Simpan Pengaturan
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Pengaturan QRIS & GoPay Merchant */}
            {isQrisModalOpen && hasAccess(currentUser, 'qris_settings') && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-4xl shadow-2xl relative max-h-[92vh] flex flex-col">
                  <button onClick={() => setIsQrisModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  
                  <div className="mb-4 pb-3 border-b border-[#BBF7D0]">
                    <div className="inline-flex items-center gap-1.5 bg-emerald-50 border border-emerald-300 px-3 py-1 rounded-full text-xs font-bold text-emerald-800 mb-1">
                      <Icon name="qr-code" size={13} className="text-emerald-600"/> INTEGRASI QRIS GO-PAY DINAMIS
                    </div>
                    <h3 className="text-lg font-black text-[#228B22]">Pengaturan QRIS & GoPay Merchant</h3>
                    <p className="text-xs text-[#2E8B57]">
                      Konfigurasikan QRIS GoPay/GoBiz untuk menghasilkan kode QR dinamis otomatis di layar kasir.
                    </p>
                  </div>

                  <div className="flex-1 overflow-y-auto pr-1 grid grid-cols-1 lg:grid-cols-12 gap-5">
                    {/* Sisi Kiri: Form Input QRIS */}
                    <div className="lg:col-span-7 space-y-4">
                      
                      {/* Upload Foto Stiker QRIS */}
                      <div className="bg-[#F0FDF4] p-4 rounded-2xl border border-[#BBF7D0] space-y-2">
                        <label className="text-[10px] font-bold text-[#2E8B57] uppercase block flex items-center gap-1.5">
                          <Icon name="upload" size={12} className="text-emerald-600"/> Upload Foto Stiker QRIS (Otomatis Scan)
                        </label>
                        <p className="text-[11px] text-[#2E8B57]">
                          Pilih foto stiker QRIS GoPay Anda dari galeri/kamera. Sistem akan mengekstrak kode QRIS secara otomatis.
                        </p>
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={handleQrisImageUpload} 
                          className="w-full text-xs text-[#2E8B57] file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#DCFCE7] file:text-[#228B22] hover:file:bg-[#BBF7D0] cursor-pointer" 
                        />
                      </div>

                      {/* Input String Payload QRIS */}
                      <div>
                        <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase flex items-center justify-between">
                          <span>String Payload QRIS Mentah <span className="text-red-500">*</span></span>
                          {qrisForm.qrisPayload && <span className="text-emerald-600 font-bold text-[10px]">Tersimpan ({qrisForm.qrisPayload.length} Karakter)</span>}
                        </label>
                        <textarea 
                          rows="4" 
                          value={qrisForm.qrisPayload || ''} 
                          onChange={e => {
                            const val = e.target.value;
                            const info = extractQRISInfo(val);
                            setQrisForm(prev => ({
                              ...prev,
                              qrisPayload: val,
                              merchantName: info.merchantName || prev.merchantName,
                              nmid: info.nmid || prev.nmid
                            }));
                          }} 
                          placeholder="Paste teks string QRIS di sini (contoh: 00020101021126590014ID...5802ID5911BOS JUS...6304ABCD)" 
                          className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl p-3 text-xs text-[#228B22] font-mono focus:border-[#7CFC00] focus:outline-none"
                        />
                        <p className="text-[10px] text-slate-500 mt-1">
                          String QRIS standar ASPI / Bank Indonesia yang diawali dengan <code className="bg-slate-100 px-1 py-0.5 rounded">000201010211</code>.
                        </p>
                      </div>

                      {/* Nama Merchant & NMID */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Nama Merchant / Toko</label>
                          <input 
                            type="text" 
                            value={qrisForm.merchantName || ''} 
                            onChange={e => setQrisForm({ ...qrisForm, merchantName: e.target.value })} 
                            placeholder="Cth: BOS JUS POS" 
                            className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] font-bold focus:border-[#7CFC00] focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">NMID (Opsional)</label>
                          <input 
                            type="text" 
                            value={qrisForm.nmid || ''} 
                            onChange={e => setQrisForm({ ...qrisForm, nmid: e.target.value })} 
                            placeholder="Cth: ID1020000000000" 
                            className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-xs text-[#228B22] font-mono focus:border-[#7CFC00] focus:outline-none"
                          />
                        </div>
                      </div>

                      {/* Opsi Tampilan Kasir */}
                      <div className="bg-[#F0FDF4] p-4 rounded-2xl border border-[#BBF7D0] space-y-3">
                        <div className="flex items-center justify-between">
                          <div>
                            <div className="text-xs font-bold text-[#228B22]">Otomatis Buka Popup QRIS di Kasir</div>
                            <div className="text-[10px] text-[#2E8B57]">Saat kasir memilih metode bayar QRIS, langsung tampilkan pop-up kode QR dinamis.</div>
                          </div>
                          <input 
                            type="checkbox" 
                            checked={qrisForm.autoShowInPos !== false} 
                            onChange={e => setQrisForm({ ...qrisForm, autoShowInPos: e.target.checked })} 
                            className="w-4 h-4 text-[#228B22] rounded accent-[#228B22] cursor-pointer"
                          />
                        </div>
                      </div>

                    </div>

                    {/* Sisi Kanan: Live Dynamic QRIS Tester */}
                    <div className="lg:col-span-5 flex flex-col items-center bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                      <div className="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1">
                        <Icon name="eye" size={13}/> Live Tester QRIS Dinamis
                      </div>

                      <div className="w-full bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2">
                        <label className="text-[10px] font-bold text-slate-600 uppercase block">Uji Coba Nominal Transaksi</label>
                        <div className="flex gap-2">
                          <span className="flex items-center text-xs font-bold text-slate-500">Rp</span>
                          <input 
                            type="number" 
                            value={testQrisAmount} 
                            onChange={e => setTestQrisAmount(e.target.value)} 
                            placeholder="10000" 
                            className="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1 text-xs font-bold text-slate-800"
                          />
                        </div>
                        <div className="flex gap-1.5">
                          {['10000', '25000', '50000', '75000'].map(amt => (
                            <button 
                              key={amt} 
                              type="button" 
                              onClick={() => setTestQrisAmount(amt)}
                              className="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-[10px] font-bold text-slate-700"
                            >
                              {parseInt(amt)/1000}rb
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Display QR Code */}
                      {(() => {
                        const dynamicPayload = generateDynamicQRIS(qrisForm.qrisPayload, Number(testQrisAmount) || 0);
                        return (
                          <div className="flex flex-col items-center p-4 bg-white rounded-2xl border-2 border-emerald-500 shadow-xl max-w-[280px] w-full text-center">
                            <div className="text-xs font-black text-slate-900 uppercase tracking-tight mb-0.5">
                              {qrisForm.merchantName || 'BOS JUS POS'}
                            </div>
                            <div className="text-[9px] text-slate-500 font-medium mb-2">QRIS Standar Pembayaran Nasional</div>

                            <QRCodeCanvas text={dynamicPayload} size={180} />

                            <div className="mt-3 py-1 px-3 bg-emerald-50 rounded-xl border border-emerald-200">
                              <div className="text-[9px] text-emerald-700 font-bold uppercase">Nominal Terkunci:</div>
                              <div className="text-base font-black text-emerald-800">{formatRp(Number(testQrisAmount) || 0)}</div>
                            </div>
                            <p className="text-[9px] text-slate-400 mt-2">
                              Buka GoPay/BCA/Shopee/Dana lalu scan QR tester di atas untuk mencoba.
                            </p>
                          </div>
                        );
                      })()}

                    </div>
                  </div>

                  {/* Action Buttons */}
                  <div className="pt-4 mt-2 border-t border-[#BBF7D0] flex flex-col sm:flex-row gap-2 justify-end">
                    <button 
                      type="button" 
                      onClick={() => setIsQrisModalOpen(false)} 
                      disabled={isSavingQris}
                      className="px-5 py-2.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-bold text-xs transition-colors"
                    >
                      Batal
                    </button>
                    <button 
                      type="button" 
                      onClick={() => handleSaveQrisConfig(qrisForm)} 
                      disabled={isSavingQris}
                      className="px-6 py-2.5 bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] rounded-xl font-black text-xs shadow-lg shadow-[#7CFC00]/20 transition-all flex items-center justify-center gap-1.5 active:scale-95 disabled:opacity-50"
                    >
                      <Icon name="check-circle" size={16} className={isSavingQris ? 'animate-spin' : ''}/>
                      <span>{isSavingQris ? 'Menyimpan & Sinkron ke Cloud...' : 'Simpan & Sinkronkan QRIS'}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Kasir: Pop-up QRIS Dinamis untuk Pelanggan */}
            {isPosQrisModalOpen && (
              <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 backdrop-blur-md">
                <div className="bg-white border-2 border-[#86EFAC] rounded-3xl p-6 w-full max-w-md shadow-2xl relative flex flex-col items-center text-center animate-in fade-in zoom-in-95 duration-200">
                  <button onClick={() => setIsPosQrisModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>

                  <div className="w-12 h-12 bg-emerald-50 border border-emerald-200 text-emerald-600 rounded-2xl flex items-center justify-center mb-3">
                    <Icon name="qr-code" size={24}/>
                  </div>

                  <div className="text-[10px] font-bold text-emerald-700 bg-emerald-100/60 border border-emerald-300 px-3 py-0.5 rounded-full uppercase tracking-wider mb-1">
                    QRIS GoPay Dinamis
                  </div>

                  <h3 className="text-lg font-black text-slate-900 leading-tight mb-1">
                    {qrisConfig.merchantName || 'BOS JUS POS'}
                  </h3>
                  <p className="text-xs text-slate-500 mb-3">Scan dengan GoPay, BCA, Livin, ShopeePay, Dana, OVO, LinkAja dll</p>

                  {/* Nominal Box */}
                  <div className="w-full bg-[#F0FDF4] border-2 border-[#86EFAC] rounded-2xl py-3 px-4 mb-4">
                    <div className="text-[10px] text-[#2E8B57] font-bold uppercase tracking-wide">Total Pembayaran Pas</div>
                    <div className="text-2xl md:text-3xl font-black text-[#228B22]">{formatRp(cartTotal)}</div>
                  </div>

                  {/* QR Code Canvas */}
                  {(() => {
                    const dynamicPayload = generateDynamicQRIS(qrisConfig.qrisPayload, cartTotal);
                    return (
                      <div className="flex flex-col items-center">
                        <QRCodeCanvas text={dynamicPayload} size={220} />
                        {!qrisConfig.qrisPayload && (
                          <p className="text-xs text-red-500 font-bold mt-2">
                            QRIS belum diisi. Buka menu Pengaturan QRIS untuk memasukkan kode stiker GoPay Anda.
                          </p>
                        )}
                      </div>
                    );
                  })()}

                  <div className="mt-4 text-[11px] text-slate-500 leading-relaxed">
                    Nominal otomatis terkunci pas <b>{formatRp(cartTotal)}</b> di smartphone pembeli.
                  </div>

                  {/* Actions */}
                  <div className="grid grid-cols-2 gap-2 w-full mt-5">
                    <button 
                      type="button" 
                      onClick={() => setIsPosQrisModalOpen(false)}
                      className="py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs transition-colors"
                    >
                      Tutup
                    </button>
                    <button 
                      type="button" 
                      onClick={() => {
                        setIsPosQrisModalOpen(false);
                        processCheckout('paid');
                      }}
                      className="py-3 px-4 bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] rounded-xl font-black text-xs shadow-lg shadow-[#7CFC00]/20 transition-all flex items-center justify-center gap-1.5"
                    >
                      <Icon name="check-circle" size={16}/> Bayar Lunas & Cetak
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Daftar Pesanan Belum Dibayar (Open Bill / Pending Orders) */}
            {isPendingOrdersModalOpen && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-2xl shadow-2xl relative max-h-[90vh] flex flex-col">
                  <button onClick={() => setIsPendingOrdersModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  
                  <div className="mb-4">
                    <div className="inline-flex items-center gap-1.5 bg-amber-50 border border-amber-300 px-3 py-1 rounded-full text-xs font-bold text-amber-800 mb-1">
                      <Icon name="clock" size={13} className="text-amber-600"/> DAFTAR OPEN BILL
                    </div>
                    <h3 className="text-lg font-black text-[#228B22]">Pesanan Belum Dibayar ({pendingTransactions.length})</h3>
                    <p className="text-xs text-[#2E8B57]">Daftar pesanan aktif pelanggan (Dine In, Take Away, GoFood, Grab, Shopee, Maxim) yang belum dilunasi.</p>
                  </div>

                  {/* Filter Tabs Pending Orders */}
                  <div className="flex items-center gap-2 overflow-x-auto pb-2 mb-3 border-b border-[#BBF7D0] text-xs">
                    <button 
                      onClick={() => setPendingOrderFilterType('all')} 
                      className={`px-3 py-1.5 rounded-xl font-bold transition-all ${pendingOrderFilterType === 'all' ? 'bg-[#7CFC00] text-[#228B22]' : 'bg-[#F0FDF4] text-[#2E8B57] hover:text-[#228B22]'}`}
                    >
                      Semua ({pendingTransactions.length})
                    </button>
                    <button 
                      onClick={() => setPendingOrderFilterType('dine_in')} 
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold transition-all ${pendingOrderFilterType === 'dine_in' ? 'bg-[#7CFC00] text-[#228B22]' : 'bg-[#F0FDF4] text-[#2E8B57] hover:text-[#228B22]'}`}
                    >
                      <Icon name="utensils" size={13}/> Dine In ({pendingTransactions.filter(t => (t.orderType || 'dine_in') === 'dine_in').length})
                    </button>
                    <button 
                      onClick={() => setPendingOrderFilterType('take_away')} 
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold transition-all ${pendingOrderFilterType === 'take_away' ? 'bg-[#7CFC00] text-[#228B22]' : 'bg-[#F0FDF4] text-[#2E8B57] hover:text-[#228B22]'}`}
                    >
                      <Icon name="shopping-bag" size={13}/> Take Away ({pendingTransactions.filter(t => t.orderType === 'take_away').length})
                    </button>
                    <button 
                      onClick={() => setPendingOrderFilterType('online')} 
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold transition-all ${pendingOrderFilterType === 'online' ? 'bg-[#7CFC00] text-[#228B22]' : 'bg-[#F0FDF4] text-[#2E8B57] hover:text-[#228B22]'}`}
                    >
                      <Icon name="truck" size={13}/> Online ({pendingTransactions.filter(t => ['gofood', 'shopeefood', 'grabfood', 'maximfood'].includes(t.orderType)).length})
                    </button>
                  </div>

                  {/* List of Pending Orders */}
                  <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                    {pendingTransactions
                      .filter(t => {
                        if (pendingOrderFilterType === 'all') return true;
                        if (pendingOrderFilterType === 'online') return ['gofood', 'shopeefood', 'grabfood', 'maximfood'].includes(t.orderType);
                        return (t.orderType || 'dine_in') === pendingOrderFilterType;
                      })
                      .length === 0 ? (
                      <div className="py-16 text-center text-[#3CB371] italic flex flex-col items-center justify-center gap-2">
                        <Icon name="check-circle" size={36} className="text-emerald-500 opacity-60"/>
                        <p className="font-semibold text-sm">Tidak ada pesanan belum dibayar untuk kategori ini.</p>
                      </div>
                    ) : (
                      pendingTransactions
                        .filter(t => {
                          if (pendingOrderFilterType === 'all') return true;
                          if (pendingOrderFilterType === 'online') return ['gofood', 'shopeefood', 'grabfood', 'maximfood'].includes(t.orderType);
                          return (t.orderType || 'dine_in') === pendingOrderFilterType;
                        })
                        .map(tx => {
                          const orderMeta = getOrderTypeMeta(tx.orderType);
                          return (
                            <div key={tx.id} className="bg-[#F0FDF4] border border-[#BBF7D0] hover:border-amber-400 p-4 rounded-2xl shadow-sm transition-all flex flex-col sm:flex-row justify-between gap-4">
                              <div className="space-y-1.5 flex-1">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className="font-bold text-[#228B22] text-xs font-mono">{tx.id}</span>
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${orderMeta.badgeColor}`}>
                                    {orderMeta.label}
                                  </span>
                                  <span className="text-[10px] text-[#2E8B57]">
                                    <Icon name="clock" size={11} className="inline mr-0.5"/> {new Date(tx.date).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}
                                  </span>
                                </div>

                                <div className="text-sm font-black text-[#228B22]">
                                  {tx.customerNote || 'Tanpa Keterangan'}
                                </div>

                                <div className="text-xs text-[#2E8B57] space-y-0.5">
                                  {tx.items?.map((it, idx) => (
                                    <div key={idx}>
                                      <div className="flex items-center gap-1.5">
                                        <span className="font-bold text-amber-500">{it.qty}x</span>
                                        <span>{it.name}</span>
                                      </div>
                                      {it.note && (
                                        <div className="text-[10px] text-amber-700 italic pl-4 font-mono">
                                          * {it.note}
                                        </div>
                                      )}
                                    </div>
                                  ))}
                                  {tx.discount > 0 && (
                                    <div className="text-xs font-bold text-amber-600">Diskon: -{formatRp(tx.discount)}</div>
                                  )}
                                </div>
                              </div>

                              <div className="flex flex-col justify-between items-end sm:border-l sm:border-[#BBF7D0] sm:pl-4 min-w-[170px]">
                                <div className="text-right">
                                  <span className="text-[10px] text-[#2E8B57] uppercase font-bold block">Total Tagihan</span>
                                  <span className="text-base font-black text-[#228B22]">{formatRp(tx.total)}</span>
                                </div>

                                <div className="flex flex-wrap gap-1.5 mt-3 w-full justify-end">
                                  <button
                                    onClick={() => {
                                      setSettleModalTx(tx);
                                      setSettlePaymentMethod('cash');
                                      setSettleCashGiven('');
                                    }}
                                    className="flex-1 py-2 px-3 bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] rounded-xl text-xs font-black shadow-md flex items-center justify-center gap-1 transition-all active:scale-95"
                                  >
                                    <Icon name="check-circle" size={14}/> Lunasi
                                  </button>
                                  <button
                                    onClick={() => editPendingOrder(tx)}
                                    className="p-2 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl text-xs font-bold transition-all"
                                    title="Edit / Tambah Menu"
                                  >
                                    <Icon name="edit" size={14}/>
                                  </button>
                                  <button
                                    onClick={() => {
                                      setLastReceipt(tx);
                                      setIsReceiptModalOpen(true);
                                    }}
                                    className="p-2 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl text-xs font-bold transition-all"
                                    title="Cetak Bill Sementara"
                                  >
                                    <Icon name="printer" size={14}/>
                                  </button>
                                  <button
                                    onClick={() => voidTransaction(tx.id)}
                                    className="p-2 bg-red-50 hover:bg-red-100 text-red-500 rounded-xl text-xs font-bold transition-all"
                                    title="Batalkan Pesanan"
                                  >
                                    <Icon name="trash" size={14}/>
                                  </button>
                                </div>
                              </div>
                            </div>
                          );
                        })
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Modal Pelunasan Cepat (Settle Pending Order) */}
            {settleModalTx && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
                  <button onClick={() => setSettleModalTx(null)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>
                  
                  <div className="text-center mb-4 pb-3 border-b border-[#BBF7D0]">
                    <div className="inline-flex items-center gap-1 text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold mb-1">
                      <Icon name="check-circle" size={13}/> PELUNASAN PESANAN
                    </div>
                    <h3 className="text-lg font-black text-[#228B22]">{settleModalTx.id}</h3>
                    <div className="text-xs text-[#2E8B57] font-semibold mt-0.5">
                      {getOrderTypeMeta(settleModalTx.orderType).label} - {settleModalTx.customerNote}
                    </div>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div className="bg-[#F0FDF4] p-3 rounded-2xl border border-[#BBF7D0] flex justify-between items-center">
                      <span className="text-[#2E8B57] font-bold">Total Tagihan:</span>
                      <span className="text-xl font-black text-[#228B22]">{formatRp(settleModalTx.total)}</span>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] mb-1 block uppercase">Metode Pembayaran</label>
                      <select 
                        value={settlePaymentMethod} 
                        onChange={e => setSettlePaymentMethod(e.target.value)} 
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] text-[#228B22] font-bold rounded-xl px-3.5 py-2 text-xs focus:outline-none"
                      >
                        <option value="cash">Tunai (Cash)</option>
                        <option value="qris">QRIS Digital</option>
                        <option value="transfer">Transfer Bank</option>
                        <option value="online">Saldo Online / Platform (GoFood/Shopee/Grab/Maxim)</option>
                      </select>
                    </div>

                    {settlePaymentMethod === 'cash' && (
                      <div className="space-y-2">
                        <label className="text-[10px] font-bold text-[#2E8B57] block uppercase">Uang Tunai Diterima</label>
                        <input 
                          type="text" 
                          placeholder="Rp..." 
                          value={settleCashGiven} 
                          onChange={e => setSettleCashGiven(e.target.value)} 
                          className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-2 text-[#228B22] text-right font-bold text-sm focus:border-[#228B22] focus:outline-none" 
                        />
                        <div className="grid grid-cols-4 gap-1.5 text-[10px]">
                          <button onClick={() => setSettleCashGiven(settleModalTx.total.toString())} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">Pas</button>
                          <button onClick={() => setSettleCashGiven('20000')} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">20rb</button>
                          <button onClick={() => setSettleCashGiven('50000')} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">50rb</button>
                          <button onClick={() => setSettleCashGiven('100000')} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">100rb</button>
                        </div>
                        {parseFloat((settleCashGiven || '').toString().replace(/\D/g, '')) >= settleModalTx.total && (
                          <div className="flex justify-between items-center pt-1 text-xs font-bold text-[#2E8B57]">
                            <span>Kembalian:</span>
                            <span className="text-amber-500 font-black">
                              {formatRp(parseFloat(settleCashGiven.replace(/\D/g, '')) - settleModalTx.total)}
                            </span>
                          </div>
                        )}
                      </div>
                    )}

                    <div className="pt-2 flex gap-2">
                      <button 
                        type="button" 
                        onClick={() => setSettleModalTx(null)} 
                        className="flex-1 py-2.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-bold text-xs transition-colors"
                      >
                        Batal
                      </button>
                      <button 
                        type="button" 
                        onClick={() => settlePendingOrder(settleModalTx, settlePaymentMethod, settleCashGiven)} 
                        className="flex-1 py-2.5 bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] rounded-xl font-black text-xs shadow-lg shadow-[#7CFC00]/20 transition-all flex items-center justify-center gap-1.5"
                      >
                        <Icon name="check-circle" size={16}/> Konfirmasi Bayar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Receipt Modal (Thermal Printer Ready) */}
            {isReceiptModalOpen && lastReceipt && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 w-full max-w-sm shadow-2xl relative max-h-[92vh] flex flex-col">
                  <button onClick={() => setIsReceiptModalOpen(false)} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>

                  <div className="overflow-y-auto pr-1 flex-1 mb-3">
                    <div id="thermal-receipt" className="bg-white p-2">
                      <div className="text-center mb-3 border-b border-dashed border-[#86EFAC] pb-2 space-y-1">
                        {printerSettings?.logo && (
                          <div className="mb-1.5 flex justify-center">
                            <img src={printerSettings.logo} alt="Logo" className="max-h-14 object-contain" />
                          </div>
                        )}
                        <div className="font-black text-[#228B22] text-lg uppercase tracking-wide">
                          {printerSettings?.brandName || 'BosJusPos'}
                        </div>
                        {printerSettings?.tagline && (
                          <div className="text-[10px] text-[#2E8B57]">{printerSettings.tagline}</div>
                        )}
                        {printerSettings?.showOutletInfo !== false && (
                          <div className="text-[10px] font-bold text-[#228B22]">
                            {outlets.find(o => o.id === lastReceipt.outletId)?.name || 'Outlet Cabang Utama'}
                            {outlets.find(o => o.id === lastReceipt.outletId)?.address ? ` - ${outlets.find(o => o.id === lastReceipt.outletId).address}` : ''}
                          </div>
                        )}
                        {printerSettings?.phone && (
                          <div className="text-[9px] text-[#2E8B57]">Telp/WA: {printerSettings.phone}</div>
                        )}
                        
                        {/* Status Struk: Lunas vs Bill Sementara */}
                        {(lastReceipt.status === 'pending') ? (
                          <div className="my-1.5 py-0.5 px-2 bg-amber-100 text-amber-900 border border-amber-300 rounded font-black text-[10px] tracking-wider uppercase">
                            * BILL SEMENTARA / BELUM BAYAR *
                          </div>
                        ) : (
                          <div className="my-1.5 py-0.5 px-2 bg-emerald-100 text-emerald-900 border border-emerald-300 rounded font-black text-[10px] tracking-wider uppercase">
                            * LUNAS *
                          </div>
                        )}

                        <div className="text-[10px] font-bold text-[#2E8B57]">
                          {getOrderTypeMeta(lastReceipt.orderType).label}
                          {lastReceipt.customerNote ? ` - ${lastReceipt.customerNote}` : ''}
                        </div>
                        <div className="text-[10px] font-mono text-[#2E8B57] mt-1">{lastReceipt.id}</div>
                        <div className="text-[9px] text-[#3CB371] mt-0.5">{new Date(lastReceipt.date).toLocaleString('id-ID')} - Kasir: {lastReceipt.cashier || 'Kasir'}</div>
                      </div>

                      <div className="space-y-1.5 mb-3 text-xs">
                        {lastReceipt.items.map((it, idx) => (
                          <div key={idx} className="text-[#228B22]">
                            <div className="flex justify-between">
                              <span>{it.qty}x {it.name}</span>
                              <span className="font-bold text-[#228B22]">{formatRp(it.price * it.qty)}</span>
                            </div>
                            {it.note && (
                              <div className="text-[10px] text-[#2E8B57] italic pl-4 font-mono">
                                * {it.note}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>

                      {lastReceipt.discount > 0 && (
                        <div className="flex justify-between text-xs text-[#228B22] pb-1 border-b border-[#BBF7D0]">
                          <span>Diskon</span>
                          <span>-{formatRp(lastReceipt.discount)}</span>
                        </div>
                      )}

                      <div className="border-t border-[#BBF7D0] pt-2 space-y-1 text-xs mb-3">
                        <div className="flex justify-between font-bold text-[#228B22] text-sm">
                          <span>Total Tagihan</span>
                          <span className="text-[#228B22]">{formatRp(lastReceipt.total)}</span>
                        </div>
                        <div className="flex justify-between text-[#2E8B57]">
                          <span>Status Pembayaran</span>
                          <span className="uppercase text-[#228B22] font-bold">
                            {lastReceipt.status === 'pending' ? 'Belum Dibayar' : (lastReceipt.paymentMethod || 'cash')}
                          </span>
                        </div>
                        {lastReceipt.status !== 'pending' && lastReceipt.paymentMethod === 'cash' && (
                          <>
                            <div className="flex justify-between text-[#2E8B57]">
                              <span>Tunai Diterima</span>
                              <span className="text-[#228B22]">{formatRp(lastReceipt.cash)}</span>
                            </div>
                            <div className="flex justify-between text-[#2E8B57] font-bold">
                              <span>Kembalian</span>
                              <span className="text-amber-500">{formatRp(lastReceipt.change)}</span>
                            </div>
                          </>
                        )}
                      </div>

                      {/* Footer Message dari Pengaturan Printer */}
                      <div className="border-t border-dashed border-[#86EFAC] pt-2 text-center space-y-1 text-[10px] text-[#2E8B57]">
                        {printerSettings?.footerMessage1 && (
                          <div className="font-bold text-[#228B22]">{printerSettings.footerMessage1}</div>
                        )}
                        {printerSettings?.footerMessage2 && (
                          <div className="text-[9px]">{printerSettings.footerMessage2}</div>
                        )}
                        {printerSettings?.footerMessage3 && (
                          <div className="text-[8px] text-[#3CB371] italic">{printerSettings.footerMessage3}</div>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1 border-t border-[#BBF7D0]">
                    <button onClick={() => {
                      const printArea = document.getElementById('thermal-receipt').innerHTML;
                      const printWindow = window.open('', '_blank', 'width=400,height=600');
                      const paperWidth = printerSettings?.paperWidth === '80mm' ? '80mm' : '58mm';
                      printWindow.document.write('<html><head><title>Cetak Struk</title>');
                      printWindow.document.write(`<style>@page { margin: 0; } body { font-family: monospace; font-size: ${paperWidth === '80mm' ? '12px' : '10px'}; margin: 0; padding: 6px; width: ${paperWidth}; background: white; color: black; } * { color: black !important; } .flex { display: flex; } .justify-between { justify-content: space-between; } .justify-center { justify-center; } .text-center { text-align: center; } .font-bold, .font-black { font-weight: bold; } .text-lg { font-size: 1.125rem; } .text-sm { font-size: 0.875rem; } .text-xs { font-size: 0.75rem; } .text-\\[10px\\] { font-size: 10px; } .text-\\[9px\\] { font-size: 9px; } .text-\\[8px\\] { font-size: 8px; } .mb-3 { margin-bottom: 0.75rem; } .mb-2 { margin-bottom: 0.5rem; } .mb-1\\.5 { margin-bottom: 0.375rem; } .mt-1 { margin-top: 0.25rem; } .mt-0\\.5 { margin-top: 0.125rem; } .mt-2 { margin-top: 0.5rem; } .pt-2 { padding-top: 0.5rem; } .pb-2 { padding-bottom: 0.5rem; } .border-b { border-bottom: 1px dashed black; } .border-t { border-top: 1px dashed black; } .space-y-1\\.5 > * + * { margin-top: 0.375rem; } .space-y-1 > * + * { margin-top: 0.25rem; } img { max-height: 56px; object-fit: contain; margin: 0 auto; }</style>`);
                      printWindow.document.write('</head><body>');
                      printWindow.document.write(printArea);
                      printWindow.document.write('</body></html>');
                      printWindow.document.close();
                      printWindow.focus();
                      setTimeout(() => { printWindow.print(); printWindow.close(); }, 250);
                    }} className="py-2.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border border-[#86EFAC]">
                      <Icon name="printer" size={14}/> Cetak Thermal ({printerSettings?.paperWidth || '58mm'})
                    </button>
                    <button onClick={async () => {
                      const receiptEl = document.getElementById('thermal-receipt');
                      if (!receiptEl) return;
                      
                      const originalTransform = receiptEl.style.transform;
                      receiptEl.style.transform = 'none'; // Mencegah cropping
                      
                      try {
                        const canvas = await html2canvas(receiptEl, { scale: 2, backgroundColor: '#ffffff' });
                        receiptEl.style.transform = originalTransform;
                        
                        canvas.toBlob(async (blob) => {
                          if (!blob) return showToast('Gagal memproses gambar.', 'error');
                          const file = new File([blob], `Struk_${lastReceipt.id}.jpg`, { type: 'image/jpeg' });
                          
                          // Prioritaskan Web Share API (HP Android/iOS) agar langsung pop-up WA
                          if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                              await navigator.share({
                                title: 'Struk Penjualan',
                                text: `Terima kasih! Ini nota Anda: ${lastReceipt.id}`,
                                files: [file]
                              });
                              return;
                            } catch (e) {
                              console.log('User membatalkan share atau error', e);
                            }
                          }
                          
                          // Fallback untuk Desktop/Laptop (Download file + Buka WA Web)
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = file.name;
                          a.click();
                          URL.revokeObjectURL(url);
                          
                          showToast('Gambar struk diunduh. Silakan lampirkan di WhatsApp!', 'success');
                          setTimeout(() => {
                            const text = `*BosJusPos Nota*\nNo: ${lastReceipt.id}\nSilakan lihat lampiran gambar struk. Terima Kasih!`;
                            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
                          }, 1500);
                        }, 'image/jpeg', 0.9);
                      } catch (err) {
                        receiptEl.style.transform = originalTransform;
                        showToast('Gagal membuat gambar struk.', 'error');
                      }
                    }} className="py-2.5 bg-[#7CFC00] hover:bg-[#7CFC00] text-[#228B22] rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
                      <Icon name="share" size={14}/> Share WA Struk
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
