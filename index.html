<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BosJusPos - Sistem Kasir & Keuangan UMKM F&B</title>
  
  <!-- Preconnect & DNS-Prefetch for Fast CDN Loading -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- HTML2Canvas for Receipt Image Export (Deferred) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

  <!-- QZ Tray for direct thermal printer connection (PC) -->
  <script src="https://cdn.jsdelivr.net/gh/qzind/qz-tray@2.2/qz-tray.js" defer></script>

  <!-- QRCode.js for Dynamic QRIS Generation (Deferred) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

  <!-- jsQR for Decoding QR Code from Photo/Image (Deferred) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>

  <!-- Capacitor bridge for Android native APIs (Bluetooth printer, etc) -->
  <script>
    (function() {
      var isCapacitor = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      window.__BJP_IS_CAPACITOR__ = isCapacitor;
      window.__BJP_IS_ANDROID__ = isCapacitor && (window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android');
    })();
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #thermal-receipt, #thermal-receipt * {
        visibility: visible;
      }
      #thermal-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
        padding: 0;
        margin: 0;
        background: white !important;
        color: black !important;
        font-family: monospace !important;
        font-size: 12px !important;
      }
      #thermal-receipt * {
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-[#F0FDF4] text-[#228B22] antialiased selection:bg-[#7CFC00]/30 min-h-screen">
  <div id="root">
    <div id="instant-splash" style="min-height:100vh;background-color:#F0FDF4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#15803d;text-align:center;">
      <div style="width:72px;height:72px;background:linear-gradient(135deg,#7CFC00,#22c55e);border-radius:22px;display:flex;align-items:center;justify-content:center;color:#14532d;font-weight:900;font-size:30px;box-shadow:0 14px 28px rgba(34,197,94,0.3);margin-bottom:20px;letter-spacing:-1px;">
        BJ
      </div>
      <div style="font-size:24px;font-weight:900;letter-spacing:-0.5px;color:#166534;margin-bottom:4px;">
        BosJusPos
      </div>
      <div style="font-size:12px;font-weight:600;color:#22c55e;margin-bottom:28px;letter-spacing:0.5px;text-transform:uppercase;">
        Sistem Kasir &amp; Keuangan UMKM
      </div>
      <div style="width:36px;height:36px;border:3px solid #bbf7d0;border-top-color:#16a34a;border-radius:50%;animation:bjspinner 0.75s linear infinite;margin-bottom:14px;"></div>
      <div style="font-size:12px;font-weight:600;color:#166534;letter-spacing:0.2px;">
        Menyiapkan aplikasi...
      </div>
      <style>
        @keyframes bjspinner { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>

  <script id="preloaded-data" type="application/json">
    {}
  </script>
  <script>
    window.__WEB_APP_URL__ = (typeof window !== 'undefined' && window.location && window.location.origin && window.location.origin.startsWith('http')) 
      ? (window.location.origin + '/api/data') 
      : 'https://bosjuspos.pages.dev/api/data';
  </script>

  <!-- Pre-compiled Native JavaScript Bundle (Instant 0.05s Load, No Babel Standalone in Browser) -->
  <script src="./app.js?v=2.6.3" defer></script>
</body>
</html>
