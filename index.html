              <div className="flex flex-col lg:flex-row gap-6 h-full min-h-[82vh]">
                <div className="flex-1 flex flex-col gap-4">
                  
                  {/* Search & Pending Orders Header Bar */}
                  <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
                    <div className="relative flex-1">
                      <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-[#3CB371]" size={18} />
                      <input 
                        ref={searchInputRef}
                        type="text" 
                        placeholder="Cari menu (Tekan F2 untuk fokus)..." 
                        value={searchQuery} 
                        onChange={(e) => setSearchQuery(e.target.value)} 
                        className="w-full bg-white border border-[#BBF7D0] rounded-2xl py-3 pl-11 pr-4 text-[#228B22] text-sm focus:border-[#228B22] focus:outline-none shadow-sm" 
                      />
                    </div>
                    
                    {/* Tombol Pesanan Belum Bayar / Open Bill */}
                    <button 
                      onClick={() => setIsPendingOrdersModalOpen(true)}
                      className={`flex items-center justify-center gap-2 px-4 py-3 rounded-2xl text-xs font-black transition-all shadow-md active:scale-95 border ${
                        pendingTransactions.length > 0 
                          ? 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-300' 
                          : 'bg-white hover:bg-[#F0FDF4] text-[#2E8B57] border-[#BBF7D0]'
                      }`}
                    >
                      <Icon name="clock" size={16} className={pendingTransactions.length > 0 ? 'text-amber-600' : 'text-[#3CB371]'}/>
                      <span>Pesanan Belum Bayar</span>
                      {pendingTransactions.length > 0 ? (
                        <span className="bg-amber-500 text-slate-950 text-[11px] font-black px-2 py-0.5 rounded-full animate-bounce">
                          {pendingTransactions.length}
                        </span>
                      ) : (
                        <span className="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
                      )}
                    </button>
                  </div>

                  {/* Category Filter Pills */}
                  <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                    {categories.map(cat => (
                      <button 
                        key={cat} 
                        onClick={() => setSelectedCategory(cat)} 
                        className={`px-3.5 py-2 rounded-xl font-bold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-[#7CFC00] text-[#228B22] shadow-md shadow-[#7CFC00]/20' : 'bg-white border border-[#BBF7D0] text-[#2E8B57] hover:text-[#228B22]'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                  
                  {/* Products Grid */}
                  <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3.5 overflow-y-auto pr-1">
                    {filteredProducts.length === 0 ? (
                      <div className="col-span-full py-16 text-center text-[#3CB371] italic">
                        Tidak ada menu yang sesuai dengan pencarian "{searchQuery}".
                      </div>
                    ) : (
                      filteredProducts.map(p => {
                        const activePromo = getActivePromo(p.id);
                        const finalPrice = activePromo ? Math.max(0, p.price - activePromo.discountNominal) : p.price;
                        const productRawMaterials = (p.recipe || []).map(r => {
                          const rm = rawMaterials.find(m => m.id === r.materialId);
                          return rm ? { ...rm, recipeQty: r.qty } : null;
                        }).filter(Boolean);
                        
                        return (
                        <div 
                          key={p.id} 
                          onClick={() => addToCart(p)} 
                          className={`bg-[#FDF9F1] border ${(!isProductUnlimited(p) && getStock(p) <= 0) ? 'border-red-900/30 opacity-50' : 'border-[#BBF7D0] hover:border-[#32CD32] cursor-pointer active:scale-95'} p-4 rounded-2xl transition-all shadow-md flex flex-col justify-between min-h-[150px] group relative overflow-hidden`}
                        >
                          <div>
                            <div className="flex justify-between items-start mb-2">
                              {activePromo ? (
                                <span className="text-[9px] text-white font-bold bg-amber-500 px-2 py-0.5 rounded-full uppercase shadow-sm">Promo</span>
                              ) : <div></div>}
                              {p.isRawMaterialAddon ? (
                                <span className="text-[9px] text-purple-700 font-bold bg-purple-100 border border-purple-300 px-2 py-0.5 rounded-full uppercase flex items-center gap-1">
                                  <Icon name="package" size={10}/> Tambahan / Mix
                                </span>
                              ) : (
                                <span className="text-[9px] text-[#32CD32] font-bold bg-[#7CFC00]/10 border border-[#32CD32]/20 px-2 py-0.5 rounded-full uppercase">{p.category}</span>
                              )}
                            </div>
                            <div className="font-bold text-[#32CD32] text-sm leading-tight group-hover:text-[#32CD32] line-clamp-2">{cleanProductName(p.name)}</div>

                            {p.isRawMaterialAddon && (
                              <div className="text-[10px] text-purple-700 font-bold mt-1 flex items-center gap-1">
                                <span>HPP: {formatRp(p.costPrice || 0)}</span>
                                <span className="text-slate-400">|</span>
                                <span className="text-slate-500">per {p.unit}</span>
                              </div>
                            )}

                            {/* Tampilkan Stok Bahan Baku Kecil jika produk menggunakan bahan baku */}
                            {!p.isRawMaterialAddon && productRawMaterials.length > 0 && (
                              <div className="mt-2 flex flex-wrap gap-1">
                                {productRawMaterials.map((rm, idx) => {
                                  const rmStock = getRawMaterialStock(rm);
                                  const isLow = rmStock <= (rm.minStock || 0) || rmStock <= 0;
                                  return (
                                    <span 
                                      key={idx} 
                                      className={`text-[9px] font-bold px-1.5 py-0.5 rounded-md border flex items-center gap-1 ${
                                        isLow 
                                          ? 'bg-red-50 text-red-700 border-red-300 font-black' 
                                          : 'bg-[#DCFCE7]/70 text-[#2E8B57] border-[#BBF7D0]'
                                      }`}
                                      title={`Stok Bahan: ${rm.name} sisa ${rmStock} ${rm.unit}`}
                                    >
                                      <span>{rm.name}:</span>
                                      <span className={isLow ? 'text-red-700 font-black' : 'text-[#228B22] font-black'}>
                                        {rmStock} {rm.unit}
                                      </span>
                                    </span>
                                  );
                                })}
                              </div>
                            )}
                          </div>

                          <div className="flex justify-between items-end mt-3 pt-2 border-t border-[#BBF7D0]/40">
                            <div className="flex flex-col">
                              {activePromo && <span className="text-[10px] text-slate-400 line-through">{formatRp(p.price)}</span>}
                              <span className="font-black text-[#32CD32] text-sm">{formatRp(finalPrice)}</span>
                            </div>
                            {isProductUnlimited(p) ? (
                              <div className="text-[10px] font-bold text-cyan-600 bg-cyan-50 border border-cyan-200 px-2 py-0.5 rounded-md">Tak Terbatas</div>
                            ) : p.isRawMaterialAddon ? (
                              <div className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${getStock(p) > 0 ? 'text-purple-700 bg-purple-50 border border-purple-200' : 'text-red-500 bg-red-50 border border-red-200'}`}>
                                Stok: {getStock(p)} {p.unit}
                              </div>
                            ) : (
                              <div className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${getStock(p) > p.minStock ? 'text-[#2E8B57] bg-[#DCFCE7]' : 'text-red-500 bg-red-50 border border-red-200'}`}>
                                Stok: {getStock(p)}
                              </div>
                            )}
                          </div>
                        </div>
                      )})
                    )}
                  </div>
                </div>

                {/* Cart Section */}
                <div className="w-full lg:w-[420px] bg-white border border-[#BBF7D0] rounded-3xl p-5 flex flex-col shadow-2xl">
                  <div className="flex items-center justify-between mb-3 pb-3 border-b border-[#BBF7D0]">
                    <h3 className="text-base font-black text-[#228B22] flex items-center gap-2">
                      <Icon name="cart" className="text-[#228B22]"/> Pesanan Kasir
                    </h3>
                    <div className="flex items-center gap-2">
                      {cart.length > 0 && (
                        <button onClick={() => setCart([])} className="text-xs text-red-400 hover:text-red-300 font-bold">Riset</button>
                      )}
                      <span className="bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30 text-xs px-2.5 py-0.5 rounded-full font-bold">{cart.length} item</span>
                    </div>
                  </div>

                  {/* Tipe Layanan / Order Channel Selector */}
                  <div className="mb-3 space-y-1.5">
                    <label className="text-[10px] font-bold text-[#2E8B57] uppercase tracking-wider block">Tipe Layanan / Channel</label>
                    <div className="grid grid-cols-3 gap-1.5 text-xs">
                      {ORDER_TYPES.map(ot => {
                        const isSelected = selectedOrderType === ot.id;
                        return (
                          <button
                            key={ot.id}
                            type="button"
                            onClick={() => setSelectedOrderType(ot.id)}
                            className={`py-1.5 px-2 rounded-xl font-bold text-[11px] flex items-center justify-center gap-1 transition-all border ${
                              isSelected 
                                ? 'bg-[#7CFC00] text-[#228B22] border-[#228B22] shadow-sm ring-2 ring-[#7CFC00]/30' 
                                : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#2E8B57] border-[#BBF7D0]'
                            }`}
                          >
                            <span>{ot.shortLabel}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Customer / Table Note Input */}
                  <div className="mb-3">
                    <input 
                      type="text" 
                      value={customerNote} 
                      onChange={e => setCustomerNote(e.target.value)} 
                      placeholder={
                        selectedOrderType === 'dine_in' 
                          ? 'No. Meja / Tamu (Cth: Meja 3 / Mas Danang)' 
                          : selectedOrderType === 'take_away' 
                          ? 'Nama Pelanggan (Cth: A/n Sarah)' 
                          : 'No. Order / Driver (Cth: #GF-102 / Pak Anton)'
                      }
                      className="w-full bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] font-semibold rounded-xl px-3 py-2 focus:outline-none focus:border-[#7CFC00] transition-all"
                    />
                  </div>
                  
                  {/* Cart Items List */}
                  <div className="flex-1 overflow-y-auto mb-3 space-y-2 max-h-[260px] pr-1">
                    {cart.length === 0 ? (
                      <div className="h-36 flex flex-col items-center justify-center text-[#3CB371] space-y-2 opacity-50">
                        <Icon name="cart" size={36}/>
                        <p className="text-xs font-medium">Klik menu di samping untuk menambahkan</p>
                      </div>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="bg-[#F0FDF4] p-2.5 rounded-xl border border-[#BBF7D0] space-y-1.5">
                          <div className="flex justify-between items-start">
                            <span className="font-bold text-xs text-[#228B22] line-clamp-1">{cleanProductName(item.name)}</span>
                            <button onClick={() => removeFromCart(item.id)} className="text-[#3CB371] hover:text-red-400"><Icon name="x" size={14}/></button>
                          </div>
                          <div className="flex justify-between items-center">
                            <span className="text-[#228B22] font-bold text-xs">{formatRp(item.price * item.qty)}</span>
                            <div className="flex items-center gap-2 bg-white rounded-lg p-1 border border-[#BBF7D0]">
                              <button onClick={() => updateCartQty(item.id, -1)} className="w-5 h-5 bg-[#DCFCE7] hover:bg-[#BBF7D0] rounded text-xs text-[#228B22] flex items-center justify-center font-bold">-</button>
                              <span className="w-4 text-center font-bold text-xs">{item.qty}</span>
                              <button onClick={() => updateCartQty(item.id, 1)} className="w-5 h-5 bg-[#DCFCE7] hover:bg-[#BBF7D0] rounded text-xs text-[#228B22] flex items-center justify-center font-bold">+</button>
                            </div>
                          </div>
                          <div>
                            <input
                              type="text"
                              value={item.note || ''}
                              onChange={(e) => updateCartNote(item.id, e.target.value)}
                              placeholder="Catatan item (cth: Less sugar, no ice)"
                              className="w-full bg-white border border-[#BBF7D0] text-[11px] text-[#228B22] rounded-lg px-2.5 py-1 placeholder:text-[#3CB371]/60 focus:outline-none focus:border-[#228B22] transition-colors font-sans"
                            />
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="border-t border-[#BBF7D0] pt-3 space-y-2 text-xs">
                    {/* Diskon Nominal Selector with Owner Authorization */}
                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-1.5">
                        <span className="text-[#2E8B57] font-bold">Diskon (Rp)</span>
                        {Number(discountNominal) > 0 && (
                          <button 
                            type="button"
                            onClick={() => {
                              setDiscountNominal('');
                              showToast('Diskon telah dihapus');
                            }}
                            className="text-red-500 hover:text-red-700 font-black text-[10px] bg-red-50 hover:bg-red-100 px-1.5 py-0.5 rounded border border-red-200 transition-colors"
                            title="Hapus Diskon"
                          >
                            Hapus
                          </button>
                        )}
                      </div>
                      <div className="relative w-2/5">
                        <span className="absolute left-2 top-1/2 -translate-y-1/2 text-amber-500 font-bold">Rp</span>
                        <input 
                          type="number" 
                          min="0"
                          value={discountNominal} 
                          onClick={() => {
                            if (currentUser.role !== 'owner') {
                              setPendingDiscountValue(discountNominal || '');
                              setDiscountAuthInput('');
                              setDiscountAuthError('');
                              setIsDiscountAuthModalOpen(true);
                            }
                          }}
                          onChange={e => {
                            const val = e.target.value;
                            if (currentUser.role === 'owner') {
                              setDiscountNominal(val);
                            } else {
                              setPendingDiscountValue(val);
                              setDiscountAuthInput('');
                              setDiscountAuthError('');
                              setIsDiscountAuthModalOpen(true);
                            }
                          }} 
                          placeholder="0"
                          className="w-full bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-amber-500 font-bold rounded-lg pl-7 pr-2 py-1 text-right focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all cursor-pointer"
                        />
                      </div>
                    </div>

                    <div className="flex justify-between items-center">
                      <span className="text-[#2E8B57] font-bold">Metode Bayar</span>
                      <select value={selectedPaymentMethod} onChange={e => setSelectedPaymentMethod(e.target.value)} className="bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] font-bold rounded-lg px-2.5 py-1">
                        <option value="cash">Tunai (Cash)</option>
                        <option value="qris">QRIS Digital</option>
                        <option value="transfer">Transfer Bank</option>
                        <option value="online">Saldo Online / Platform</option>
                      </select>
                    </div>

                    {discountAmount > 0 && (
                      <div className="flex justify-between items-center text-xs text-[#228B22]">
                        <span>Potongan Diskon</span>
                        <span>-{formatRp(discountAmount)}</span>
                      </div>
                    )}

                    <div className="flex justify-between items-center pt-1 border-t border-[#BBF7D0]/80">
                      <span className="text-[#228B22] font-bold">Total Final</span>
                      <span className="text-xl font-black text-[#228B22]">{formatRp(cartTotal)}</span>
                    </div>

                    {selectedPaymentMethod === 'cash' && (
                      <div className="space-y-1.5 pt-1">
                        <input 
                          type="text" 
                          placeholder="Uang Tunai (Rp)" 
                          value={cashGiven} 
                          onChange={(e) => setCashGiven(e.target.value)} 
                          className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3.5 py-1.5 text-[#228B22] text-right font-bold text-sm focus:border-[#228B22]" 
                        />
                        {/* Quick Nominal Buttons */}
                        <div className="grid grid-cols-4 gap-1.5 text-[10px]">
                          <button onClick={() => setCashGiven(cartTotal.toString())} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">Pas</button>
                          <button onClick={() => setCashGiven('20000')} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">20rb</button>
                          <button onClick={() => setCashGiven('50000')} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">50rb</button>
                          <button onClick={() => setCashGiven('100000')} className="bg-[#DCFCE7] hover:bg-[#BBF7D0] py-1 rounded text-[#228B22] font-bold">100rb</button>
                        </div>
                      </div>
                    )}

                    {selectedPaymentMethod === 'qris' && (
                      <div className="bg-[#DCFCE7] p-3 rounded-2xl border border-[#86EFAC] space-y-2">
                        <div className="flex justify-between items-center text-xs">
                          <div className="flex items-center gap-1.5 font-bold text-[#228B22]">
                            <Icon name="qr-code" size={16} className="text-emerald-600"/>
                            <span>QRIS GoPay Dinamis</span>
                          </div>
                          <span className="text-[10px] bg-emerald-500/20 text-emerald-700 px-2 py-0.5 rounded-full font-bold">Nominal Pas</span>
                        </div>
                        <button 
                          type="button" 
                          onClick={() => setIsPosQrisModalOpen(true)}
                          disabled={cartTotal <= 0}
                          className={`w-full py-2.5 px-3 rounded-xl font-black text-xs flex items-center justify-center gap-2 transition-all shadow-sm active:scale-95 ${
                            cartTotal > 0 ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/20' : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                          }`}
                        >
                          <Icon name="qr-code" size={14}/> Buka QR Code di Layar ({formatRp(cartTotal)})
                        </button>
                      </div>
                    )}

                    {/* Dual Action Buttons: Bayar Sekarang (Lunas) vs Simpan Belum Bayar */}
                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button 
                        type="button"
                        onClick={() => processCheckout('pending')} 
                        disabled={cart.length === 0}
                        className={`py-3 rounded-xl font-bold text-xs transition-all flex flex-col items-center justify-center gap-0.5 border shadow-md ${
                          cart.length === 0 
                            ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' 
                            : 'bg-amber-50 hover:bg-amber-100 text-amber-900 border-amber-300 hover:border-amber-400 active:scale-95'
                        }`}
                      >
                        <div className="flex items-center gap-1 font-black">
                          <Icon name="clock" size={14} className="text-amber-600"/> Simpan Pesanan
                        </div>
                        <span className="text-[9px] text-amber-700 font-semibold">(Belum Dibayar)</span>
                      </button>

                      <button 
                        type="button"
                        onClick={() => processCheckout('paid')} 
                        disabled={cart.length === 0}
                        className={`py-3 rounded-xl font-bold text-xs transition-all flex flex-col items-center justify-center gap-0.5 shadow-lg ${
                          cart.length === 0 
                            ? 'bg-[#DCFCE7] text-[#3CB371] cursor-not-allowed' 
                            : 'bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] shadow-[#7CFC00]/20 active:scale-95'
                        }`}
                      >
                        <div className="flex items-center gap-1 font-black">
                          <Icon name="check-circle" size={14}/> Bayar Lunas
                        </div>
                        <span className="text-[9px] text-[#2E8B57] font-semibold">(Cetak Struk)</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MODUL KEUANGAN & SALDO PERUSAHAAN */}
            {activeTab === 'finance' && hasAccess(currentUser, 'finance') && (
              <div className="space-y-6 max-w-6xl mx-auto">
                {/* Header Card */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white border border-[#BBF7D0] p-6 rounded-3xl shadow-xl">
                  <div>
                    <button onClick={() => handleTabSwitch('home')} className="flex items-center gap-2 mb-3 px-4 py-2 bg-[#7CFC00]/10 hover:bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30 rounded-2xl text-xs font-black transition-all shadow-md active:scale-95 w-max">
                      <Icon name="arrow-left" size={16}/> Kembali ke Menu Utama / Dashboard
                    </button>
                    <div className="inline-flex items-center gap-2 bg-purple-500/10 border border-purple-500/30 px-3 py-1 rounded-full text-xs font-bold text-purple-600 mb-2">
                      <Icon name="dollar-sign" size={14}/> ARUS KAS & SALDO PERUSAHAAN
                    </div>
                    <h2 className="text-2xl font-black text-[#228B22] flex items-center gap-2">Laporan Keuangan & Saldo Usaha</h2>
                    <p className="text-[#2E8B57] text-xs mt-0.5">Pemantauan saldo kas fisik, saldo rekening bank (potongan QRIS 0,7%), pengeluaran & saldo akhir perusahaan.</p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    <button onClick={() => setIsIncomeModalOpen(true)} className="flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md shadow-emerald-600/20 w-full sm:w-auto">
                      <Icon name="plus" size={14}/> Catat Pemasukan
                    </button>
                    <button onClick={() => setIsExpenseModalOpen(true)} className="flex items-center justify-center gap-1.5 bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md shadow-purple-600/20 w-full sm:w-auto">
                      <Icon name="plus" size={14}/> Catat Pengeluaran
                    </button>
                    <button onClick={exportFinanceReportExcel} className="flex items-center justify-center gap-1.5 bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] px-4 py-2.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-[#7CFC00]/20 w-full sm:w-auto">
                      <Icon name="download" size={14}/> Download Excel
                    </button>
                  </div>
                </div>

                {/* Filter Tanggal Bar */}
                <div className="bg-white border border-[#BBF7D0] p-4 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs shadow-md">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-[#2E8B57] font-bold">Pilih Periode:</span>
                    <div className="flex bg-[#F0FDF4] border border-[#BBF7D0] p-1 rounded-xl">
                      <button onClick={() => setDateFilterType('today')} className={`px-3 py-1.5 rounded-lg font-bold transition-colors ${dateFilterType === 'today' ? 'bg-purple-600 text-white' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>Hari Ini</button>
                      <button onClick={() => setDateFilterType('weekly')} className={`px-3 py-1.5 rounded-lg font-bold transition-colors ${dateFilterType === 'weekly' ? 'bg-purple-600 text-white' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>Mingguan</button>
                      <button onClick={() => setDateFilterType('monthly')} className={`px-3 py-1.5 rounded-lg font-bold transition-colors ${dateFilterType === 'monthly' ? 'bg-purple-600 text-white' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>Bulanan</button>
                      <button onClick={() => setDateFilterType('all')} className={`px-3 py-1.5 rounded-lg font-bold transition-colors ${dateFilterType === 'all' ? 'bg-purple-600 text-white' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>Semua</button>
                      <button onClick={() => setDateFilterType('custom')} className={`px-3 py-1.5 rounded-lg font-bold transition-colors ${dateFilterType === 'custom' ? 'bg-purple-600 text-white' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>Kustom</button>
                    </div>
                  </div>

                  {dateFilterType === 'custom' && (
                    <div className="flex items-center gap-2 bg-[#F0FDF4] border border-[#BBF7D0] p-2 rounded-xl">
                      <span className="text-[#2E8B57] font-bold text-[10px] uppercase">Dari:</span>
                      <input type="date" value={customStartInput} onChange={e => setCustomStartInput(e.target.value)} className="bg-white border border-[#BBF7D0] text-xs text-[#228B22] p-1 rounded-lg focus:outline-none"/>
                      <span className="text-[#3CB371] font-bold">s/d</span>
                      <span className="text-[#2E8B57] font-bold text-[10px] uppercase">Sampai:</span>
                      <input type="date" value={customEndInput} onChange={e => setCustomEndInput(e.target.value)} className="bg-white border border-[#BBF7D0] text-xs text-[#228B22] p-1 rounded-lg focus:outline-none"/>
                      <button onClick={() => { setStartDateFilter(customStartInput); setEndDateFilter(customEndInput); }} className="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs ml-1 transition-colors">Jalankan Filter</button>
                    </div>
                  )}
                </div>

                {/* 4 Kartu Metrik Utama */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {/* 1. Total Saldo Perusahaan */}
                  <div className="bg-gradient-to-br from-purple-900 via-purple-800 to-purple-950 text-white p-5 rounded-3xl shadow-xl relative overflow-hidden">
                    <div className="absolute right-3 top-3 opacity-20">
                      <Icon name="dollar-sign" size={48}/>
                    </div>
                    <span className="text-purple-200 text-[10px] font-bold uppercase tracking-wider block">Total Saldo Akhir Usaha</span>
                    <div className="text-2xl font-black text-white mt-1">{formatRp(saldoPerusahaan)}</div>
                    <div className="mt-2 text-[10px] text-purple-200 flex items-center gap-1">
                      <span>Saldo Kas Fisik + Saldo Bank</span>
                    </div>
                  </div>

                  {/* 2. Saldo Kas Fisik */}
                  <div className="bg-white border border-emerald-500/30 p-5 rounded-3xl shadow-xl relative overflow-hidden flex flex-col justify-between">
                    <div>
                      <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-emerald-500 rounded-r-3xl"></div>
                      <div className="flex items-center justify-between">
                        <span className="text-emerald-700 text-[10px] font-bold uppercase tracking-wider block">Saldo Kas Fisik (Tunai)</span>
                        <button 
                          onClick={() => openTransferModal('cash_to_bank')}
                          className="text-[10px] bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-lg border border-emerald-300 flex items-center gap-1 transition-all shadow-sm"
                          title="Pindahkan Saldo Kas Tunai ke Rekening Bank"
                        >
                          <Icon name="arrow-right-left" size={11}/> Pindah ke Bank
                        </button>
                      </div>
                      <div className="text-2xl font-black text-emerald-600 mt-1">{formatRp(saldoKasFisik)}</div>
                    </div>
                    <div className="mt-2 text-[10px] text-[#2E8B57]">
                      Omset: <span className="font-bold text-emerald-600">+{formatRp(omsetCash)}</span>
                      {incomesCash > 0 && <span> | Masuk: <span className="font-bold text-emerald-700">+{formatRp(incomesCash)}</span></span>}
                      <span> | Beban: <span className="font-bold text-red-500">-{formatRp(expensesCash)}</span></span>
                      {totalTransferCashToBank > 0 && <span> | Setor: <span className="font-bold text-blue-600">-{formatRp(totalTransferCashToBank)}</span></span>}
                      {totalTransferBankToCash > 0 && <span> | Tarik: <span className="font-bold text-emerald-600">+{formatRp(totalTransferBankToCash)}</span></span>}
                    </div>
                  </div>

                  {/* 3. Saldo Rekening Bank */}
                  <div className="bg-white border border-cyan-500/30 p-5 rounded-3xl shadow-xl relative overflow-hidden flex flex-col justify-between">
                    <div>
                      <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-cyan-500 rounded-r-3xl"></div>
                      <div className="flex items-center justify-between">
                        <span className="text-cyan-700 text-[10px] font-bold uppercase tracking-wider block">Saldo Rekening Bank (Digital)</span>
                        <button 
                          onClick={() => openTransferModal('bank_to_cash')}
                          className="text-[10px] bg-cyan-50 hover:bg-cyan-100 text-cyan-800 font-bold px-2 py-0.5 rounded-lg border border-cyan-300 flex items-center gap-1 transition-all shadow-sm"
                          title="Tarik Tunai dari Bank ke Kasir"
                        >
                          <Icon name="arrow-right-left" size={11}/> Tarik ke Kas
                        </button>
                      </div>
                      <div className="text-2xl font-black text-cyan-600 mt-1">{formatRp(saldoBank)}</div>
                    </div>
                    <div className="mt-2 text-[10px] text-cyan-700/80">
                      QRIS Net: <span className="font-bold">{formatRp(omsetQrisNet)}</span>
                      {incomesBank > 0 && <span> | Masuk: <span className="font-bold text-emerald-700">+{formatRp(incomesBank)}</span></span>}
                      {totalTransferCashToBank > 0 && <span> | Dari Kas: <span className="font-bold text-cyan-700">+{formatRp(totalTransferCashToBank)}</span></span>}
                      {totalTransferBankToCash > 0 && <span> | Ke Kas: <span className="font-bold text-red-500">-{formatRp(totalTransferBankToCash)}</span></span>}
                    </div>
                  </div>

                  {/* 4. Estimasi Laba Bersih */}
                  <div className="bg-white border border-amber-500/30 p-5 rounded-3xl shadow-xl relative overflow-hidden">
                    <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-amber-500 rounded-r-3xl"></div>
                    <span className="text-amber-700 text-[10px] font-bold uppercase tracking-wider block">Estimasi Laba Bersih</span>
                    <div className={`text-2xl font-black mt-1 ${labaBersih >= 0 ? 'text-[#228B22]' : 'text-red-500'}`}>{formatRp(labaBersih)}</div>
                    <div className="mt-2 text-[10px] text-amber-700">
                      Laba Kotor <span className="font-bold">{formatRp(labaKotor)}</span> (Omset - HPP) - Beban <span className="font-bold text-red-500">{formatRp(totalSemuaPengeluaran)}</span>
                    </div>
                  </div>
                </div>

                {/* Saldo Bank Detail & Pengeluaran Panel (2 Columns) */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Saldo Bank & Potongan QRIS 0.7% Detail Card */}
                  <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 shadow-xl space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-black text-[#228B22] uppercase tracking-wider flex items-center gap-2">
                        <Icon name="sparkles" size={16} className="text-cyan-500"/> Rincian Saldo Rekening Bank
                      </h3>
                      <span className="text-xs bg-cyan-50 text-cyan-700 border border-cyan-200 px-2.5 py-1 rounded-full font-bold">MDR 0,7%</span>
                    </div>

                    <div className="space-y-2.5 text-xs">
                      <div className="flex justify-between items-center p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0]">
                        <span className="text-[#2E8B57] font-medium">QRIS Masuk (Bruto / Kotor)</span>
                        <span className="font-bold text-[#228B22]">{formatRp(omsetQrisGross)}</span>
                      </div>
                      <div className="flex justify-between items-center p-3 bg-red-50/70 rounded-xl border border-red-200">
                        <span className="text-red-600 font-medium">Potongan Biaya Admin QRIS (0,7%)</span>
                        <span className="font-bold text-red-600">-{formatRp(qrisAdminFee)}</span>
                      </div>
                      <div className="flex justify-between items-center p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                        <span className="text-emerald-700 font-bold">QRIS Bersih (Netto)</span>
                        <span className="font-black text-emerald-600">{formatRp(omsetQrisNet)}</span>
                      </div>
                      <div className="flex justify-between items-center p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0]">
                        <span className="text-[#2E8B57] font-medium">Pemasukan Transfer Bank</span>
                        <span className="font-bold text-[#228B22]">{formatRp(omsetTransfer)}</span>
                      </div>
                      {totalTransferCashToBank > 0 && (
                        <div className="flex justify-between items-center p-3 bg-emerald-50/70 rounded-xl border border-emerald-200">
                          <span className="text-emerald-700 font-medium">Setoran Masuk dari Kas Tunai (Laci)</span>
                          <span className="font-bold text-emerald-600">+{formatRp(totalTransferCashToBank)}</span>
                        </div>
                      )}
                      {totalTransferBankToCash > 0 && (
                        <div className="flex justify-between items-center p-3 bg-amber-50/70 rounded-xl border border-amber-200">
                          <span className="text-amber-800 font-medium">Penarikan Tunai ke Laci Kasir</span>
                          <span className="font-bold text-amber-700">-{formatRp(totalTransferBankToCash)}</span>
                        </div>
                      )}
                      {expensesBank > 0 && (
                        <div className="flex justify-between items-center p-3 bg-red-50/70 rounded-xl border border-red-200">
                          <span className="text-red-600 font-medium">Pengeluaran Operasional dari Bank</span>
                          <span className="font-bold text-red-600">-{formatRp(expensesBank)}</span>
                        </div>
                      )}
                      <div className="flex justify-between items-center p-3.5 bg-cyan-50/80 rounded-2xl border border-cyan-200 font-black text-sm text-cyan-900 mt-2">
                        <span>Total Saldo Bank Netto:</span>
                        <span className="text-cyan-700">{formatRp(saldoBank)}</span>
                      </div>
                    </div>
                  </div>

                  {/* Expense Summary by Category */}
                  <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 shadow-xl space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-black text-[#228B22] uppercase tracking-wider flex items-center gap-2">
                        <Icon name="tag" size={16} className="text-red-500"/> Kategori Pengeluaran Operasional
                      </h3>
                      <button onClick={() => setIsExpenseModalOpen(true)} className="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 transition-all shadow-md shadow-purple-600/20">
                        <Icon name="plus" size={12}/> Catat
                      </button>
                    </div>

                    <div className="space-y-2.5 text-xs">
                      <div className="flex justify-between items-center p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0]">
                        <span className="text-[#2E8B57] font-medium">Belanja Bahan Baku</span>
                        <span className="font-bold text-[#228B22]">{formatRp(totalBiayaBahanBaku)}</span>
                      </div>
                      <div className="flex justify-between items-center p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0]">
                        <span className="text-[#2E8B57] font-medium">Biaya Sewa Lapak</span>
                        <span className="font-bold text-[#228B22]">{formatRp(totalBiayaSewa)}</span>
                      </div>
                      <div className="flex justify-between items-center p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0]">
                        <span className="text-[#2E8B57] font-medium">Gaji Karyawan</span>
                        <span className="font-bold text-[#228B22]">{formatRp(totalGaji)}</span>
                      </div>
                      <div className="flex justify-between items-center p-3 bg-[#F0FDF4] rounded-xl border border-[#BBF7D0]">
                        <span className="text-[#2E8B57] font-medium">Operasional Lainnya</span>
                        <span className="font-bold text-[#228B22]">{formatRp(totalOperasional)}</span>
                      </div>
                      <div className="flex justify-between items-center p-3.5 bg-red-50/80 rounded-2xl border border-red-200 font-black text-sm text-red-900 mt-2">
                        <span>Total Semua Pengeluaran:</span>
                        <span className="text-red-600">{formatRp(totalSemuaPengeluaran)}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* TABEL REKAP HASIL PENJUALAN & ARUS KAS PER TANGGAL */}
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 shadow-xl space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <div>
                      <h3 className="text-base font-black text-[#228B22] flex items-center gap-2">
                        <Icon name="clock" size={16} className="text-purple-600"/>
                        Rekapitulasi Hasil Penjualan & Arus Kas Per Tanggal
                      </h3>
                      <p className="text-[11px] text-[#2E8B57]">Rincian harian omset tunai, QRIS kotor, admin 0,7%, transfer bank, pengeluaran dan saldo bersih per hari.</p>
                    </div>
                    <span className="text-xs bg-purple-50 text-purple-700 font-bold px-3 py-1 rounded-xl border border-purple-200">
                      {dailyCashflow.length} hari terdata
                    </span>
                  </div>

                  <div className="overflow-x-auto rounded-2xl border border-[#BBF7D0]">
                    <table className="w-full text-left text-xs text-[#228B22]">
                      <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                        <tr>
                          <th className="px-3 py-3">Tanggal</th>
                          <th className="px-3 py-3 text-right">Tunai (Cash)</th>
                          <th className="px-3 py-3 text-right">QRIS Kotor</th>
                          <th className="px-3 py-3 text-right text-red-500">Admin 0,7%</th>
                          <th className="px-3 py-3 text-right text-emerald-600">QRIS Bersih</th>
                          <th className="px-3 py-3 text-right">Transfer Bank</th>
                          <th className="px-3 py-3 text-right text-cyan-600">Saldo Online/Platform</th>
                          <th className="px-3 py-3 text-right text-purple-600">Omset Bersih</th>
                          <th className="px-3 py-3 text-right text-red-500">Pengeluaran</th>
                          <th className="px-3 py-3 text-right">Arus Kas Harian</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#BBF7D0]">
                        {dailyCashflow.length === 0 ? (
                          <tr>
                            <td colSpan="10" className="text-center py-8 text-[#3CB371] italic">
                              Tidak ada data transaksi pada periode ini.
                            </td>
                          </tr>
                        ) : (
                          dailyCashflow.map(row => (
                            <tr key={row.date} className="hover:bg-[#DCFCE7]/60 transition-colors">
                              <td className="px-3 py-2.5 font-bold font-mono text-[11px] text-[#228B22]">{row.date}</td>
                              <td className="px-3 py-2.5 text-right font-medium">{formatRp(row.cash)}</td>
                              <td className="px-3 py-2.5 text-right text-[#2E8B57]">{formatRp(row.qrisGross)}</td>
                              <td className="px-3 py-2.5 text-right font-medium text-red-500">-{formatRp(row.qrisFee)}</td>
                              <td className="px-3 py-2.5 text-right font-bold text-emerald-600">{formatRp(row.qrisNet)}</td>
                              <td className="px-3 py-2.5 text-right font-medium">{formatRp(row.transfer)}</td>
                              <td className="px-3 py-2.5 text-right font-medium text-cyan-600">{formatRp(row.online || 0)}</td>
                              <td className="px-3 py-2.5 text-right font-black text-purple-600">{formatRp(row.totalNetOmset)}</td>
                              <td className="px-3 py-2.5 text-right font-medium text-red-500">
                                {row.expenses > 0 ? `-${formatRp(row.expenses)}` : '-'}
                              </td>
                              <td className="px-3 py-2.5 text-right">
                                <span className={`px-2 py-0.5 rounded-md font-black text-[11px] ${row.netCashflow >= 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                                  {row.netCashflow >= 0 ? '+' : ''}{formatRp(row.netCashflow)}
                                </span>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                      {dailyCashflow.length > 0 && (
                        <tfoot>
                          <tr className="bg-[#F0FDF4] font-black text-xs border-t-2 border-[#BBF7D0]">
                            <td className="px-3 py-3 text-right uppercase text-[#2E8B57]">TOTAL</td>
                            <td className="px-3 py-3 text-right">{formatRp(omsetCash)}</td>
                            <td className="px-3 py-3 text-right text-[#2E8B57]">{formatRp(omsetQrisGross)}</td>
                            <td className="px-3 py-3 text-right text-red-500">-{formatRp(qrisAdminFee)}</td>
                            <td className="px-3 py-3 text-right text-emerald-600">{formatRp(omsetQrisNet)}</td>
                            <td className="px-3 py-3 text-right">{formatRp(omsetTransfer)}</td>
                            <td className="px-3 py-3 text-right text-cyan-600">{formatRp(omsetOnline)}</td>
                            <td className="px-3 py-3 text-right text-purple-600">{formatRp(totalOmsetNet)}</td>
                            <td className="px-3 py-3 text-right text-red-500">-{formatRp(totalSemuaPengeluaran)}</td>
                            <td className="px-3 py-3 text-right text-purple-700">{formatRp(totalOmsetNet - totalSemuaPengeluaran)}</td>
                          </tr>
                        </tfoot>
                      )}
                    </table>
                  </div>
                </div>

                {/* RIWAYAT PEMASUKAN SALDO USAHA */}
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 shadow-xl space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <h3 className="text-base font-black text-[#228B22] flex items-center gap-2">
                        <Icon name="dollar-sign" size={16} className="text-emerald-600"/>
                        Daftar Riwayat Pemasukan Saldo Usaha
                      </h3>
                      <p className="text-[11px] text-[#2E8B57]">Semua pemasukan saldo non-penjualan (modal tambahan, titipan mitra, bonus, dll) yang menambah kas toko atau bank.</p>
                    </div>
                    <button onClick={() => setIsIncomeModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow-md shadow-emerald-600/20">
                      <Icon name="plus" size={14}/> Catat Pemasukan
                    </button>
                  </div>

                  <div className="overflow-x-auto rounded-2xl border border-[#BBF7D0]">
                    <table className="w-full text-left text-xs text-[#228B22]">
                      <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                        <tr>
                          <th className="px-4 py-3">Tanggal & Jam</th>
                          <th className="px-4 py-3">Kategori</th>
                          <th className="px-4 py-3">Keterangan / Sumber</th>
                          <th className="px-4 py-3">Tujuan Saldo</th>
                          <th className="px-4 py-3">Dicatat Oleh</th>
                          <th className="px-4 py-3 text-right">Nominal (Rp)</th>
                          <th className="px-4 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#BBF7D0]">
                        {filteredIncomes.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="text-center py-8 text-[#3CB371] italic">
                              Belum ada catatan pemasukan saldo pada periode ini.
                            </td>
                          </tr>
                        ) : (
                          filteredIncomes.map(inc => (
                            <tr key={inc.id} className="hover:bg-[#DCFCE7]/60 transition-colors">
                              <td className="px-4 py-3 font-mono text-[11px] text-[#2E8B57]">
                                {new Date(inc.date).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                              </td>
                              <td className="px-4 py-3 font-bold text-[#228B22]">{inc.category}</td>
                              <td className="px-4 py-3 font-medium">{inc.title}</td>
                              <td className="px-4 py-3">
                                <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${inc.paymentDestination === 'bank' ? 'bg-cyan-50 text-cyan-700 border border-cyan-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                  <Icon name={inc.paymentDestination === 'bank' ? 'credit-card' : 'banknote'} size={12}/>
                                  {inc.paymentDestination === 'bank' ? 'Rekening Bank' : 'Kas Tunai'}
                                </span>
                              </td>
                              <td className="px-4 py-3 text-[#2E8B57]">{inc.operator || 'Owner'}</td>
                              <td className="px-4 py-3 text-right font-black text-emerald-600">+{formatRp(inc.amount)}</td>
                              <td className="px-4 py-3 text-center">
                                <button onClick={() => deleteIncome(inc.id)} className="p-1.5 bg-[#DCFCE7] hover:bg-red-50 text-red-500 rounded-lg transition-colors" title="Hapus Pemasukan">
                                  <Icon name="trash" size={13}/>
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                      {filteredIncomes.length > 0 && (
                        <tfoot>
                          <tr className="bg-[#F0FDF4] font-black text-xs border-t-2 border-[#BBF7D0]">
                            <td colSpan="5" className="px-4 py-3 text-right uppercase text-[#2E8B57]">TOTAL PEMASUKAN SALDO</td>
                            <td className="px-4 py-3 text-right text-emerald-600">+{formatRp(totalSemuaPemasukan)}</td>
                            <td></td>
                          </tr>
                        </tfoot>
                      )}
                    </table>
                  </div>
                </div>

                {/* RIWAYAT PENGELUARAN OPERASIONAL */}
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 shadow-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-base font-black text-[#228B22] flex items-center gap-2">
                        <Icon name="tag" size={16} className="text-red-500"/>
                        Daftar Riwayat Pengeluaran Operasional
                      </h3>
                      <p className="text-[11px] text-[#2E8B57]">Semua pengeluaran yang memotong kas tunai atau rekening bank toko.</p>
                    </div>
                    <button onClick={() => setIsExpenseModalOpen(true)} className="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow-md shadow-purple-600/20">
                      <Icon name="plus" size={14}/> Catat Pengeluaran
                    </button>
                  </div>

                  <div className="overflow-x-auto rounded-2xl border border-[#BBF7D0]">
                    <table className="w-full text-left text-xs text-[#228B22]">
                      <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                        <tr>
                          <th className="px-4 py-3">Tanggal & Jam</th>
                          <th className="px-4 py-3">Kategori</th>
                          <th className="px-4 py-3">Keterangan / Item</th>
                          <th className="px-4 py-3">Sumber Dana</th>
                          <th className="px-4 py-3">Dicatat Oleh</th>
                          <th className="px-4 py-3 text-right">Nominal (Rp)</th>
                          <th className="px-4 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#BBF7D0]">
                        {filteredExpenses.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="text-center py-8 text-[#3CB371] italic">
                              Belum ada catatan pengeluaran operasional pada periode ini.
                            </td>
                          </tr>
                        ) : (
                          filteredExpenses.map(exp => (
                            <tr key={exp.id} className="hover:bg-[#DCFCE7]/60 transition-colors">
                              <td className="px-4 py-3 font-mono text-[11px] text-[#2E8B57]">
                                {new Date(exp.date).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                              </td>
                              <td className="px-4 py-3 font-bold text-[#228B22]">{exp.category}</td>
                              <td className="px-4 py-3">{exp.title}</td>
                              <td className="px-4 py-3">
                                <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${exp.paymentSource === 'bank' ? 'bg-cyan-50 text-cyan-700 border border-cyan-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                  <Icon name={exp.paymentSource === 'bank' ? 'credit-card' : 'banknote'} size={12}/>
                                  {exp.paymentSource === 'bank' ? 'Rekening Bank' : 'Kas Tunai'}
                                </span>
                              </td>
                              <td className="px-4 py-3 text-[#2E8B57] font-medium">{exp.operator || exp.userName || 'Owner'}</td>
                              <td className="px-4 py-3 text-right font-black text-red-500">-{formatRp(exp.amount)}</td>
                              <td className="px-4 py-3 text-center">
                                <button onClick={() => deleteExpense(exp.id)} className="p-1.5 bg-[#DCFCE7] hover:bg-red-50 text-red-500 rounded-lg transition-colors" title="Hapus Pengeluaran">
                                  <Icon name="trash" size={13}/>
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                      {filteredExpenses.length > 0 && (
                        <tfoot>
                          <tr className="bg-[#F0FDF4] font-black text-xs border-t-2 border-[#BBF7D0]">
                            <td colSpan="5" className="px-4 py-3 text-right uppercase text-[#2E8B57]">TOTAL PENGELUARAN</td>
                            <td className="px-4 py-3 text-right text-red-500">-{formatRp(totalSemuaPengeluaran)}</td>
                            <td></td>
                          </tr>
                        </tfoot>
                      )}
                    </table>
                  </div>
                </div>

                {/* RIWAYAT MUTASI & TRANSFER SALDO KAS <-> BANK */}
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 shadow-xl space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <h3 className="text-base font-black text-[#228B22] flex items-center gap-2">
                        <Icon name="arrow-right-left" size={16} className="text-blue-600"/>
                        Riwayat Pemindahan Saldo (Setor & Tarik Kas)
                      </h3>
                      <p className="text-[11px] text-[#2E8B57]">Mutasi pemindahan uang internal antara kas tunai laci kasir dan rekening bank toko.</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => openTransferModal('cash_to_bank')} 
                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow-md shadow-emerald-600/20"
                      >
                        <Icon name="plus" size={13}/> Setor Kas ke Bank
                      </button>
                      <button 
                        onClick={() => openTransferModal('bank_to_cash')} 
                        className="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow-md shadow-cyan-600/20"
                      >
                        <Icon name="plus" size={13}/> Tarik Bank ke Kas
                      </button>
                    </div>
                  </div>

                  <div className="overflow-x-auto rounded-2xl border border-[#BBF7D0]">
                    <table className="w-full text-left text-xs text-[#228B22]">
                      <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                        <tr>
                          <th className="px-4 py-3">Tanggal & Jam</th>
                          <th className="px-4 py-3">Arah Mutasi</th>
                          <th className="px-4 py-3">Catatan / Keterangan</th>
                          <th className="px-4 py-3">Dicatat Oleh</th>
                          <th className="px-4 py-3 text-right">Nominal (Rp)</th>
                          <th className="px-4 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#BBF7D0]">
                        {filteredTransfers.length === 0 ? (
                          <tr>
                            <td colSpan="6" className="text-center py-8 text-[#3CB371] italic">
                              Belum ada catatan pemindahan saldo internal pada periode ini.
                            </td>
                          </tr>
                        ) : (
                          filteredTransfers.map(tr => (
                            <tr key={tr.id} className="hover:bg-[#DCFCE7]/60 transition-colors">
                              <td className="px-4 py-3 font-mono text-[11px] text-[#2E8B57]">
                                {new Date(tr.date).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                              </td>
                              <td className="px-4 py-3">
                                {tr.type === 'cash_to_bank' || (tr.from === 'cash' && tr.to === 'bank') ? (
                                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-300">
                                    <Icon name="banknote" size={12} className="text-emerald-600"/> Kas Tunai <Icon name="arrow-right" size={10} className="inline"/> Rekening Bank
                                  </span>
                                ) : (
                                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-cyan-50 text-cyan-800 border border-cyan-300">
                                    <Icon name="credit-card" size={12} className="text-cyan-600"/> Rekening Bank <Icon name="arrow-right" size={10} className="inline"/> Kas Tunai
                                  </span>
                                )}
                              </td>
                              <td className="px-4 py-3 font-medium">{tr.note}</td>
                              <td className="px-4 py-3 text-[#2E8B57]">{tr.operator || 'Admin'}</td>
                              <td className="px-4 py-3 text-right font-black text-blue-600">{formatRp(tr.amount)}</td>
                              <td className="px-4 py-3 text-center">
                                <button onClick={() => deleteTransfer(tr.id)} className="p-1.5 bg-[#DCFCE7] hover:bg-red-50 text-red-500 rounded-lg transition-colors" title="Hapus Mutasi">
                                  <Icon name="trash" size={13}/>
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                      {filteredTransfers.length > 0 && (
                        <tfoot>
                          <tr className="bg-[#F0FDF4] font-black text-xs border-t-2 border-[#BBF7D0]">
                            <td colSpan="4" className="px-4 py-3 text-right uppercase text-[#2E8B57]">TOTAL SETOR KAS KE BANK</td>
                            <td className="px-4 py-3 text-right text-blue-600">{formatRp(totalTransferCashToBank)}</td>
                            <td></td>
                          </tr>
                        </tfoot>
                      )}
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* INVENTORY & STOK TAB */}
            {activeTab === 'inventory' && (
              <div className="space-y-6 max-w-6xl mx-auto">

                {/* Header */}
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-6 shadow-xl space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <button onClick={() => handleTabSwitch('home')} className="flex items-center gap-2 mb-2 px-3.5 py-1.5 bg-[#7CFC00]/10 hover:bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30 rounded-xl text-xs font-black transition-all shadow-sm active:scale-95 w-max">
                        <Icon name="arrow-left" size={14}/> Kembali ke Dashboard
                      </button>
                      <h2 className="text-xl font-black text-[#228B22] flex items-center gap-2">
                        <Icon name="package" className="text-cyan-600"/> Manajemen Inventaris & Stok Produk
                      </h2>
                      <p className="text-[#2E8B57] text-xs mt-0.5">Total {products.length} item menu | {stockReceipts.length} entri penerimaan stok</p>
                    </div>
                  </div>

                  {/* Menu Tombol Aksi Inventaris (Pill Menu) */}
                  <div className="pt-2 border-t border-[#BBF7D0] flex flex-wrap items-center gap-2.5">
                    {/* 1. Menu Tab: Daftar Produk & Stok */}
                    <button 
                      onClick={() => setInventorySubTab('products')} 
                      className={`flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-bold border transition-all shadow-sm active:scale-95 ${
                        inventorySubTab === 'products'
                          ? 'bg-[#DCFCE7] text-[#228B22] border-[#228B22] ring-2 ring-[#7CFC00]/30 font-black' 
                          : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] border-[#86EFAC]'
                      }`}
                    >
                      Daftar Produk & Stok
                    </button>

                    {/* 2. Bahan Baku (Posisi tepat setelah Daftar Produk & Stok) */}
                    {hasAccess(currentUser, 'inv_raw_material') && (
                      <button 
                        onClick={() => setInventorySubTab(prev => prev === 'raw_materials' ? 'products' : 'raw_materials')} 
                        className={`flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-bold border transition-all shadow-sm active:scale-95 ${
                          inventorySubTab === 'raw_materials' 
                            ? 'bg-[#DCFCE7] text-[#228B22] border-[#228B22] ring-2 ring-[#7CFC00]/30 font-black' 
                            : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] border-[#86EFAC]'
                        }`}
                      >
                        <Icon name="package" size={14}/> Bahan Baku
                      </button>
                    )}

                    {/* 3. Export Excel */}
                    <button 
                      onClick={exportProductsExcel} 
                      className="flex items-center gap-1.5 px-4 py-2 bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] rounded-2xl text-xs font-bold border border-[#86EFAC] transition-all shadow-sm active:scale-95"
                    >
                      <Icon name="download" size={14} className="text-[#228B22]"/> Export Excel
                    </button>

                    {/* 4. Riwayat Masuk */}
                    <button 
                      onClick={() => setInventorySubTab(prev => prev === 'receipts' ? 'products' : 'receipts')} 
                      className={`flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-bold border transition-all shadow-sm active:scale-95 ${
                        inventorySubTab === 'receipts' 
                          ? 'bg-[#DCFCE7] text-[#228B22] border-[#228B22] ring-2 ring-[#7CFC00]/30 font-black' 
                          : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] border-[#86EFAC]'
                      }`}
                    >
                      <Icon name="clock" size={14}/> Riwayat Masuk
                    </button>

                    {/* 5. Riwayat Keluar */}
                    <button 
                      onClick={() => setInventorySubTab(prev => prev === 'outs' ? 'products' : 'outs')} 
                      className={`flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-bold border transition-all shadow-sm active:scale-95 ${
                        inventorySubTab === 'outs' 
                          ? 'bg-[#DCFCE7] text-[#228B22] border-[#228B22] ring-2 ring-[#7CFC00]/30 font-black' 
                          : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] border-[#86EFAC]'
                      }`}
                    >
                      Riwayat Keluar
                    </button>

                    {/* 6. Kartu Stok */}
                    <button 
                      onClick={() => { 
                        if (!stockCardProductId && products.length > 0) {
                          setStockCardProductId(products[0]?.id || ''); 
                        }
                        setInventorySubTab(prev => prev === 'stock_card' ? 'products' : 'stock_card');
                      }} 
                      className={`flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-bold border transition-all shadow-sm active:scale-95 ${
                        inventorySubTab === 'stock_card' 
                          ? 'bg-[#DCFCE7] text-[#228B22] border-[#228B22] ring-2 ring-[#7CFC00]/30 font-black' 
                          : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] border-[#86EFAC]'
                      }`}
                    >
                      Kartu Stok
                    </button>

                    {/* 7. Stok Opname */}
                    <button 
                      onClick={() => setInventorySubTab(prev => prev === 'opname' ? 'products' : 'opname')} 
                      className={`flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-bold border transition-all shadow-sm active:scale-95 ${
                        inventorySubTab === 'opname' 
                          ? 'bg-[#DCFCE7] text-[#228B22] border-[#228B22] ring-2 ring-[#7CFC00]/30 font-black' 
                          : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] border-[#86EFAC]'
                      }`}
                    >
                      Stok Opname
                    </button>

                    {/* 8. Kelola Promo */}
                    {hasAccess(currentUser, 'inv_promo') && (
                      <button 
                        onClick={() => setInventorySubTab(prev => prev === 'promo' ? 'products' : 'promo')} 
                        className={`flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-bold border transition-all shadow-sm active:scale-95 ${
                          inventorySubTab === 'promo' 
                            ? 'bg-[#DCFCE7] text-[#228B22] border-[#228B22] ring-2 ring-[#7CFC00]/30 font-black' 
                            : 'bg-[#F0FDF4] hover:bg-[#DCFCE7] text-[#228B22] border-[#86EFAC]'
                        }`}
                      >
                        <Icon name="tag" size={14}/> Kelola Promo
                      </button>
                    )}

                    {/* 9. Sembunyikan */}
                    {inventorySubTab !== 'products' && (
                      <button 
                        onClick={() => setInventorySubTab('products')} 
                        className="flex items-center gap-1.5 px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 rounded-2xl text-xs font-black transition-all shadow-sm active:scale-95"
                      >
                        Sembunyikan
                      </button>
                    )}

                    {/* 9. Tambah Produk Baru */}
                    {hasAccess(currentUser, 'inv_add_product') && (
                      <button 
                        onClick={() => openProductModal()} 
                        className="flex items-center gap-1.5 px-5 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-2xl text-xs font-black transition-all shadow-md shadow-cyan-600/30 active:scale-95"
                      >
                        <Icon name="plus" size={14}/> Tambah Produk Baru
                      </button>
                    )}

                    {/* 10. Hapus Semua */}
                    {currentUser.role === 'owner' && products.length > 0 && (
                      <button 
                        onClick={deleteAllProducts} 
                        className="flex items-center gap-1.5 px-4 py-2 bg-red-50 hover:bg-red-100 text-red-500 border border-red-200 rounded-2xl text-xs font-bold transition-all shadow-sm active:scale-95"
                      >
                        <Icon name="trash" size={14}/> Hapus Semua
                      </button>
                    )}
                  </div>
                </div>

                {/* Daftar Produk dengan Tombol Tambah Stok */}
                {inventorySubTab === 'products' && (
                <div className="bg-white border border-[#BBF7D0] rounded-3xl overflow-hidden shadow-xl">
                  <div className="px-6 py-4 border-b border-[#BBF7D0] flex items-center justify-between gap-4">
                    <div className="flex items-center gap-2">
                      <Icon name="package" size={16} className="text-cyan-600"/>
                      <span className="font-black text-[#228B22] text-sm hidden sm:inline">Daftar Produk & Stok</span>
                    </div>
                    <div className="relative w-full max-w-sm">
                      <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#2E8B57]" />
                      <input 
                        type="text" 
                        placeholder="Cari nama produk..." 
                        value={searchTermInventory}
                        onChange={e => setSearchTermInventory(e.target.value)}
                        className="w-full bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] px-9 py-2 rounded-xl focus:outline-none focus:border-[#7CFC00] focus:ring-1 focus:ring-[#7CFC00] transition-all"
                      />
                    </div>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-[#228B22]">
                      <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                        <tr>
                          <th className="px-4 py-3">Produk</th>
                          <th className="px-4 py-3">Kategori</th>
                          <th className="px-4 py-3">HPP</th>
                          <th className="px-4 py-3">Harga Jual</th>
                          <th className="px-4 py-3">Margin</th>
                          <th className="px-4 py-3">Stok Saat Ini</th>
                          <th className="px-4 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#BBF7D0]">
                        {filteredInventoryProducts.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="text-center py-8 text-[#3CB371] italic">
                              {searchTermInventory ? `Tidak ada produk bernama "${searchTermInventory}"` : "Belum ada produk."}
                            </td>
                          </tr>
                        ) : (
                          filteredInventoryProducts.map(p => {
                          const margin = p.price > 0 ? ((p.price - p.costPrice) / p.price * 100).toFixed(0) : 0;
                          const recentReceipts = stockReceipts.filter(r => r.productId === p.id).length;
                          return (
                            <tr key={p.id} className="hover:bg-[#DCFCE7] transition-colors group">
                              <td className="px-4 py-3">
                                <div className="flex items-center gap-2">
                                  <div>
                                    <div className="font-bold text-[#228B22]">{p.name}</div>
                                    {recentReceipts > 0 && <div className="text-[10px] text-cyan-400">{recentReceipts}x penerimaan</div>}
                                  </div>
                                </div>
                              </td>
                              <td className="px-4 py-3"><span className="bg-[#DCFCE7] px-2 py-0.5 rounded text-[10px]">{p.category}</span></td>
                              <td className="px-4 py-3">{formatRp(p.costPrice)}</td>
                              <td className="px-4 py-3 text-[#228B22] font-bold">{formatRp(p.price)}</td>
                              <td className="px-4 py-3 text-amber-400 font-bold">{margin}%</td>
                              <td className="px-4 py-3">
                                {isProductUnlimited(p) ? (
