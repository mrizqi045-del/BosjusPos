    // QRIS Helpers (EMVCo Bank Indonesia Standard)
    const calculateCRC16 = (str) => {
      let crc = 0xFFFF;
      for (let i = 0; i < str.length; i++) {
        crc ^= (str.charCodeAt(i) << 8);
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    };

    const extractQRISInfo = (payload) => {
      if (!payload || typeof payload !== 'string') return {};
      const result = {};
      const match59 = payload.match(/59(\d{2})(.+)/);
      if (match59) {
        const len = parseInt(match59[1], 10);
        result.merchantName = match59[2].substring(0, len);
      }
      const match60 = payload.match(/60(\d{2})(.+)/);
      if (match60) {
        const len = parseInt(match60[1], 10);
        result.merchantCity = match60[2].substring(0, len);
      }
      const nmidMatch = payload.match(/ID\d{10,25}/);
      if (nmidMatch) {
        result.nmid = nmidMatch[0];
      }
      return result;
    };

    const generateDynamicQRIS = (rawPayload, amount) => {
      if (!rawPayload || !rawPayload.trim()) return '';
      let payload = rawPayload.trim();

      const crcIndex = payload.lastIndexOf('6304');
      if (crcIndex !== -1 && crcIndex >= payload.length - 8) {
        payload = payload.substring(0, crcIndex);
      }

      payload = payload.replace(/^000201010211/, '000201010212');
      payload = payload.replace(/010211/, '010212');

      const numAmount = Math.round(Number(amount) || 0);
      if (numAmount > 0) {
        const amountStr = numAmount.toString();
        const amountTag = '54' + amountStr.length.toString().padStart(2, '0') + amountStr;

        const tag54Regex = /54\d{2}\d+/;
        if (tag54Regex.test(payload)) {
          payload = payload.replace(tag54Regex, amountTag);
        } else {
          const tag58Index = payload.indexOf('5802ID');
          if (tag58Index !== -1) {
            payload = payload.slice(0, tag58Index) + amountTag + payload.slice(tag58Index);
          } else {
            payload = payload + amountTag;
          }
        }
      }

      if (!payload.includes('5303360')) {
        const tag54Index = payload.indexOf('54');
        if (tag54Index !== -1) {
          payload = payload.slice(0, tag54Index) + '5303360' + payload.slice(tag54Index);
        }
      }

      const finalWithoutCrc = payload + '6304';
      const checksum = calculateCRC16(finalWithoutCrc);
      return finalWithoutCrc + checksum;
    };

      const getRawMaterialStock = (rm, oId = selectedOutletId) => {
        if (!rm) return 0;
        const primaryOId = outlets[0]?.id || 'out-1';
        const targetOId = oId === 'all' ? primaryOId : oId;
        if (rm.stocks && rm.stocks[targetOId] !== undefined) {

        if (targetOId === primaryOId) {
          if (rm.stocks && rm.stocks['out-1'] !== undefined) {

          }
          return Number(rm.stock) || 0;
        }
        return 0;

      const getRawMaterialTotalStock = (rm) => {

      // Smart Union Merge Helper: Merges two arrays by 'id', preserving all records without deletion
      const mergeRecordsById = (incomingList, currentList, sortField = 'date', excludedIds = []) => {
        if (!Array.isArray(incomingList) && !Array.isArray(currentList)) return [];
        const excludeSet = new Set(excludedIds || []);
        const map = new Map();
        
        // 1. Masukkan data server
        (incomingList || []).forEach(item => {
          if (item && item.id && !excludeSet.has(item.id)) {
            map.set(item.id, item);
          }
        });
        
        // 2. Pertahankan data lokal (agar tidak pernah tertimpa atau hilang)
        (currentList || []).forEach(item => {
          if (item && item.id && !excludeSet.has(item.id)) {
            if (!map.has(item.id)) {
              map.set(item.id, item);
            }
          }
        });
        
        const result = Array.from(map.values());
        if (sortField) {
          result.sort((a, b) => new Date(b[sortField] || 0) - new Date(a[sortField] || 0));
        }
        return result;
      };

      // Smart Merge for Products with multi-outlet stocks
      const mergeProductsState = (incomingList, currentList, excludedIds = [], outletList = outlets) => {
        if (!Array.isArray(incomingList) && !Array.isArray(currentList)) return [];
        const excludeSet = new Set(excludedIds || []);
        const primaryOId = outletList[0]?.id || 'out-1';
        const map = new Map();
        const normalizeProduct = (p) => {
          const cleanName = cleanProductName(p.name);
          const stocks = { ...(p.stocks || {}) };
          if (Object.keys(stocks).length === 0) {
            stocks[primaryOId] = Number(p.stock) || 0;
          } else if (stocks['out-1'] !== undefined && primaryOId !== 'out-1' && !outletList.some(o => o.id === 'out-1')) {
            if (stocks[primaryOId] === undefined) {
              stocks[primaryOId] = stocks['out-1'];
            }
            delete stocks['out-1'];
          }
          return { ...p, name: cleanName, image: '', stocks };
        };
        (incomingList || []).forEach(p => {
          if (p && p.id && !excludeSet.has(p.id)) {
            map.set(p.id, normalizeProduct(p));
          }
        });
        (currentList || []).forEach(p => {
          if (p && p.id && !excludeSet.has(p.id)) {
            if (!map.has(p.id)) {
              map.set(p.id, normalizeProduct(p));
            }
          }
        });
        return Array.from(map.values());
      };

      // Smart Merge for Users
      const mergeUsersState = (incomingList, currentList, excludedIds = [], outletList = outlets) => {
        if (!Array.isArray(incomingList) && !Array.isArray(currentList)) return [];
        const excludeSet = new Set(excludedIds || []);
        const primaryOId = outletList[0]?.id || 'out-1';
        const map = new Map();
        (incomingList || []).forEach(u => { if (u && u.id && !excludeSet.has(u.id)) map.set(u.id, { ...u, outletId: u.outletId || primaryOId }); });
        (currentList || []).forEach(u => { if (u && u.id && !excludeSet.has(u.id) && !map.has(u.id)) map.set(u.id, { ...u, outletId: u.outletId || primaryOId }); });
        return Array.from(map.values());
      };

      // Smart Merge for Raw Materials with multi-outlet stocks
      const mergeRawMaterialsState = (incomingList, currentList, excludedIds = [], outletList = outlets) => {
        if (!Array.isArray(incomingList) && !Array.isArray(currentList)) return [];
        const excludeSet = new Set(excludedIds || []);
        const primaryOId = outletList[0]?.id || 'out-1';
        const map = new Map();
        const normalizeRM = (rm) => {
          const stocks = { ...(rm.stocks || {}) };
          if (Object.keys(stocks).length === 0) {
            stocks[primaryOId] = Number(rm.stock) || 0;
          } else if (stocks['out-1'] !== undefined && primaryOId !== 'out-1' && !outletList.some(o => o.id === 'out-1')) {
            if (stocks[primaryOId] === undefined) {
              stocks[primaryOId] = stocks['out-1'];
            }
            delete stocks['out-1'];
          }
          return { ...rm, stocks };
        };
        (incomingList || []).forEach(rm => {
          if (rm && rm.id && !excludeSet.has(rm.id)) {
            map.set(rm.id, normalizeRM(rm));
          }
        });
        (currentList || []).forEach(rm => {
          if (rm && rm.id && !excludeSet.has(rm.id)) {
            if (!map.has(rm.id)) {
              map.set(rm.id, normalizeRM(rm));
            } else {
              const existing = map.get(rm.id);
              const mergedStocks = { ...(existing.stocks || {}), ...(rm.stocks || {}) };
              if (mergedStocks['out-1'] !== undefined && primaryOId !== 'out-1' && !outletList.some(o => o.id === 'out-1')) {
                if (mergedStocks[primaryOId] === undefined) {
                  mergedStocks[primaryOId] = mergedStocks['out-1'];
                }
                delete mergedStocks['out-1'];
              }
              map.set(rm.id, { ...existing, ...rm, stocks: mergedStocks });

          }

        return Array.from(map.values());

      // Reusable function: apply and merge server data to state (Non-Destructive Union Merge)
      const applyServerData = (sourceData, setLoadingFalse) => {
        try {
          let currentVoided = voidedTxIds;
          if (sourceData['bjp_voided_txs_v7']) {
            try {
              const parsedVoided = JSON.parse(sourceData['bjp_voided_txs_v7']);
              if (Array.isArray(parsedVoided)) {
                currentVoided = [...new Set([...currentVoided, ...parsedVoided])];
                setVoidedTxIds(currentVoided);
              }
            } catch(e) {}
          }

          let currentDeleted = deletedRecordIds;
          if (sourceData['bjp_deleted_records_v7']) {
            try {
              const parsedDeleted = JSON.parse(sourceData['bjp_deleted_records_v7']);
              if (Array.isArray(parsedDeleted)) {
                currentDeleted = [...new Set([...currentDeleted, ...parsedDeleted])];
                setDeletedRecordIds(currentDeleted);
              }
            } catch(e) {}
          }

          // Resolve outlets first so all other state merges know the real primary outlet (e.g. Sampit)
          let resolvedOutlets = outlets;
          if (sourceData['bjp_outlets_v7']) {
            try {
              const parsedOutlets = JSON.parse(sourceData['bjp_outlets_v7']);
              resolvedOutlets = mergeRecordsById(parsedOutlets, outlets, null, currentDeleted);
              setOutlets(resolvedOutlets);
            } catch(e) {}
          }

          if (sourceData['bjp_users_v7']) {
            const parsed = JSON.parse(sourceData['bjp_users_v7']);
            setUsers(prev => mergeUsersState(parsed, prev, currentDeleted, resolvedOutlets));
          }
          if (sourceData['bjp_products_v7']) {
            const parsed = JSON.parse(sourceData['bjp_products_v7']);
            setProducts(prev => mergeProductsState(parsed, prev, currentDeleted, resolvedOutlets));
          }
          if (sourceData['bjp_transactions_v7']) {
            const parsed = JSON.parse(sourceData['bjp_transactions_v7']);
            setTransactions(prev => {
              const merged = mergeRecordsById(parsed, prev, 'date', [...currentVoided, ...currentDeleted]);
              // Simpan emergency local archive snapshot (arsip lokal tak terhapus)
              try {
                const archiveRaw = localStorage.getItem('bjp_emergency_tx_archive_v7');
                const archive = archiveRaw ? JSON.parse(archiveRaw) : [];
                const finalArchive = mergeRecordsById(merged, archive, 'date', [...currentVoided, ...currentDeleted]);
                localStorage.setItem('bjp_emergency_tx_archive_v7', JSON.stringify(finalArchive));
              } catch (err) {}
              return merged;
            });
          }
          if (sourceData['bjp_stock_receipts_v7']) {

            setStockReceipts(prev => mergeRecordsById(parsed, prev, 'date', currentDeleted));

          if (sourceData['bjp_stock_outs_v7']) {

          if (sourceData['bjp_stock_opnames_v7']) {
            const parsed = JSON.parse(sourceData['bjp_stock_opnames_v7']);
            setStockOpnames(prev => mergeRecordsById(parsed, prev, 'date', currentDeleted));
          }
          if (sourceData['bjp_promos_v7']) {
            const parsed = JSON.parse(sourceData['bjp_promos_v7']);
            setPromos(prev => mergeRecordsById(parsed, prev, 'createdAt', currentDeleted));
          }
          if (sourceData['bjp_printer_logo_v7']) {
            setPrinterLogo(sourceData['bjp_printer_logo_v7']);
          }
          if (sourceData['bjp_printer_settings_v7']) {
            try {
              const parsed = JSON.parse(sourceData['bjp_printer_settings_v7']);
              setPrinterSettings({ ...defaultPrinterSettings, ...parsed });
            } catch (e) {
              console.error('Error parsing printer settings', e);
            }
          }
          if (sourceData['bjp_qris_config_v7']) {
            try {
              const rawQris = sourceData['bjp_qris_config_v7'];
              const parsed = typeof rawQris === 'string' ? JSON.parse(rawQris) : rawQris;
              if (parsed && typeof parsed === 'object') {
                setQrisConfig(prev => {
                  if (parsed.qrisPayload && parsed.qrisPayload.trim().length > 0) {
                    return { ...defaultQrisConfig, ...parsed };
                  }
                  if (prev.qrisPayload && prev.qrisPayload.trim().length > 0) {
                    return prev;
                  }
                  return { ...defaultQrisConfig, ...parsed };
                });
                if (parsed.qrisPayload && parsed.qrisPayload.trim().length > 0) {
                  localStorage.setItem('bjp_qris_config_v7', JSON.stringify(parsed));
                }
              }
            } catch (e) {
              console.error('Error parsing QRIS config', e);
            }
          }
          if (sourceData['bjp_finance_v7']) {
            const f = JSON.parse(sourceData['bjp_finance_v7']);
            if (f.modalUsaha !== undefined) setModalUsaha(f.modalUsaha);
            if (f.expenses) setExpenses(prev => mergeRecordsById(f.expenses, prev, 'date', currentDeleted));
            if (f.incomes) setIncomes(prev => mergeRecordsById(f.incomes, prev, 'date', currentDeleted));
            if (f.profitSplit) setProfitSplit(f.profitSplit);
          }
          if (sourceData['bjp_transfers_v7']) {
            const parsed = JSON.parse(sourceData['bjp_transfers_v7']);
            setTransfers(prev => mergeRecordsById(parsed, prev, 'date', currentDeleted));
          }
          if (sourceData['bjp_raw_materials_v7']) {
            const parsed = JSON.parse(sourceData['bjp_raw_materials_v7']);
            setRawMaterials(prev => mergeRawMaterialsState(parsed, prev, currentDeleted, resolvedOutlets));

          if (sourceData['bjp_raw_material_logs_v7']) {
            const parsed = JSON.parse(sourceData['bjp_raw_material_logs_v7']);
            setRawMaterialLogs(prev => mergeRecordsById(parsed, prev, 'date', currentDeleted));

        // 2. Muat data lokal dulu agar UI langsung muncul seketika (0 detik)
        const localData = getLocalData();

              window.supabaseClient

      // Helper Filter Date

        const targetDate = new Date(dateStr);
        const now = new Date();

        if (dateFilterType === 'today') {
          return targetDate.toDateString() === now.toDateString();
        } else if (dateFilterType === 'weekly') {
          const sevenDaysAgo = new Date();
          sevenDaysAgo.setDate(now.getDate() - 7);
          return targetDate >= sevenDaysAgo && targetDate <= now;
        } else if (dateFilterType === 'monthly') {
          return targetDate.getMonth() === now.getMonth() && targetDate.getFullYear() === now.getFullYear();
        } else if (dateFilterType === 'custom') {
          if (!startDateFilter && !endDateFilter) return true;
          const start = startDateFilter ? new Date(startDateFilter + 'T00:00:00') : new Date('1970-01-01');
          const end = endDateFilter ? new Date(endDateFilter + 'T23:59:59') : new Date('2099-12-31');
          return targetDate >= start && targetDate <= end;
        }
        return true; // 'all'

      // Real Cash & Bank Balances (termasuk pemasukan saldo modal & mutasi setor / tarik kas)
      const saldoKasFisik = (omsetCash + incomesCash - expensesCash) - totalTransferCashToBank + totalTransferBankToCash;
      const saldoBank = (omsetBankNet + incomesBank - expensesBank) + totalTransferCashToBank - totalTransferBankToCash;
      const saldoPerusahaan = saldoKasFisik + saldoBank;
      const labaKotor = totalOmsetNet - totalHpp;
      const labaBersih = labaKotor - totalSemuaPengeluaran;

      // Daily Cashflow Breakdown (Rekap Per Tanggal - Transaksi Lunas & Mutasi)
      const dailyCashflow = useMemo(() => {
        const dateMap = {};

        paidTransactions.forEach(t => {
          const d = t.date ? t.date.slice(0, 10) : 'Tanpa Tanggal';
          if (!dateMap[d]) {
            dateMap[d] = { date: d, cash: 0, qrisGross: 0, transfer: 0, online: 0, other: 0, expenses: 0, incomes: 0, txCount: 0 };
          }
          dateMap[d].txCount += 1;
          const method = (t.paymentMethod || 'cash').toLowerCase();
          if (method === 'cash' || method === 'tunai') {
            dateMap[d].cash += (t.total || 0);
          } else if (method === 'qris') {
            dateMap[d].qrisGross += (t.total || 0);
          } else if (method === 'transfer' || method === 'bank' || method === 'transfer bank') {
            dateMap[d].transfer += (t.total || 0);
          } else if (['online', 'gofood', 'shopeefood', 'grabfood', 'maximfood'].includes(method)) {
            dateMap[d].online += (t.total || 0);
          } else {
            dateMap[d].other += (t.total || 0);
          }
        });

        filteredExpenses.forEach(e => {
          const d = e.date ? e.date.slice(0, 10) : 'Tanpa Tanggal';
          if (!dateMap[d]) {
            dateMap[d] = { date: d, cash: 0, qrisGross: 0, transfer: 0, online: 0, other: 0, expenses: 0, incomes: 0, txCount: 0 };
          }
          dateMap[d].expenses += (e.amount || 0);
        });

        filteredIncomes.forEach(inc => {
          const d = inc.date ? inc.date.slice(0, 10) : 'Tanpa Tanggal';
          if (!dateMap[d]) {
            dateMap[d] = { date: d, cash: 0, qrisGross: 0, transfer: 0, online: 0, other: 0, expenses: 0, incomes: 0, txCount: 0 };
          }
          dateMap[d].incomes = (dateMap[d].incomes || 0) + (inc.amount || 0);
        });

        return Object.values(dateMap).map(row => {
          const qrisFee = Math.round(row.qrisGross * 0.007);
          const qrisNet = row.qrisGross - qrisFee;
          const totalNetOmset = row.cash + qrisNet + row.transfer + (row.online || 0) + (row.other || 0);
          const netCashflow = (totalNetOmset + (row.incomes || 0)) - row.expenses;
          return {
            ...row,
            qrisFee,
            qrisNet,
            totalNetOmset,
            netCashflow
          };
        }).sort((a, b) => (b.date > a.date ? 1 : -1));
      }, [paidTransactions, filteredExpenses, filteredIncomes]);

        if (selectedOutletId === 'all') return showToast('Pilih Outlet spesifik terlebih dahulu!', 'error');
        const product = products.find(p => p.id === productId);
        if (!product) return showToast('Pilih produk untuk ekspor Kartu Stok!', 'error');

        // Build stock card movements: receipts (IN) + transaction sales (OUT)
        const movements = [];

        // IN: receipts
        stockReceipts.filter(r => r.productId === productId && r.outletId === selectedOutletId).forEach(r => {
          movements.push({ date: r.date, type: 'MASUK', source: `Penerimaan dari ${r.supplier || 'Supplier'}`, note: r.note || '-', qtyIn: r.qtyAdded, qtyOut: 0, addedBy: r.addedBy });
        });

        // OUT: transactions containing this product
        transactions.filter(t => t.outletId === selectedOutletId).forEach(t => {
          if (t.items) {
            t.items.forEach(item => {
              if (item.id === product.id || item.name === product.name) {
                movements.push({ date: t.date, type: 'KELUAR', source: `Penjualan #${t.id.slice(-5)}`, note: `Kasir: ${t.cashier || '-'}`, qtyIn: 0, qtyOut: item.qty, addedBy: t.cashier || '-' });
              }
            });
          }
        });

        // OUT: manual stock outs
        stockOuts.filter(r => r.productId === productId && r.outletId === selectedOutletId).forEach(r => {
          movements.push({
            date: r.date,
            type: 'KELUAR',
            source: 'Barang Keluar Manual',
            note: r.note || '-',
            qtyIn: 0,
            qtyOut: r.qtyRemoved,
            addedBy: r.operator || '-'
          });
        });

        // OPNAME: adjustments
        stockOpnames.filter(opn => opn.outletId === selectedOutletId).forEach(opn => {
          if (opn.items) {
            const item = opn.items.find(i => i.productId === product.id);
            if (item) {
              const isSurplus = item.selisih > 0;
              movements.push({ 
                date: opn.date, 
                type: isSurplus ? 'MASUK' : 'KELUAR', 
                source: `Stok Opname #${opn.id.slice(-5)}`, 
                note: item.keterangan, 
                qtyIn: isSurplus ? item.selisih : 0, 
                qtyOut: isSurplus ? 0 : Math.abs(item.selisih), 
                addedBy: opn.operator || '-' 
              });
            }
          }
        });

        // Sort by date ascending
        movements.sort((a, b) => new Date(a.date) - new Date(b.date));

        // Calculate running balance
        let runningQty = 0;
        const cardRows = movements.map(m => {
          runningQty += m.qtyIn - m.qtyOut;
          return { ...m, balance: runningQty };
        });

      const runAiBusinessAudit = async () => {
        setIsAiAnalyzing(true);

        - Total Modal HPP: ${formatRp(totalHpp)}

        - Total Pengeluaran: ${formatRp(totalSemuaPengeluaran)}

            auditReport += `- Saldo Kas Tunai: **${formatRp(saldoKasFisik)}** | Saldo Bank: **${formatRp(saldoBank)}**\n`;
            auditReport += `- Total Saldo Usaha: **${formatRp(saldoPerusahaan)}**\n\n`;

            auditReport += `2. Rekomendasi Strategis F&B:\n`;
            if (totalBiayaBahanBaku > totalOmsetNet * 0.4) {

            } else {
              auditReport += `- Kontrol Bahan Baku: Biaya bahan baku masih terpelihara dengan baik.\n`;
            }

            auditReport += `- Manajemen Likuiditas: Jaga perbandingan kas tunai di laci (${formatRp(saldoKasFisik)}) dan rekening digital (${formatRp(saldoBank)}) agar belanja operasional tetap lancar.\n\n`;

            setAiAnalysis(auditReport);
            setIsAiAnalyzing(false);
            showToast('Audit bisnis selesai diproses!');

        } catch (err) {
          console.error(err);
          setAiAnalysis('Gagal melakukan analisis lokal.');
          setIsAiAnalyzing(false);
        }
      };

      const handleSendAiChat = async () => {
        if (!userChatInput.trim() || isAiChatLoading) return;
        const userMessage = userChatInput.trim();
        setUserChatInput('');
        setAiChatMessages(prev => [...prev, { role: 'user', text: userMessage }]);
        setIsAiChatLoading(true);

        try {
          // Intelligent local F&B responses
          setTimeout(() => {
            let reply = "Saya asisten BosJusPos. ";
            const lower = userMessage.toLowerCase();
            if (lower.includes('promo') || lower.includes('diskon')) {
              reply = "Rekomendasi promo F&B: Buat program 'Happy Hour' jam 14:00-17:00 dengan diskon 15% untuk varian jus buah agar meningkatkan penjualan di jam sepi.";
            } else if (lower.includes('harga') || lower.includes('hpp') || lower.includes('margin')) {
              reply = "Untuk menentukan harga jual F&B yang ideal, gunakan formula: Harga Jual = HPP / (1 - Target Margin %). Standard margin jus buah biasanya 55% - 65%.";
            } else if (lower.includes('resep') || lower.includes('menu')) {
              reply = "Menu viral yang sedang diminati: 'Jus Mango Smoothies Cheese Foam' atau 'Alpukat Kocok Milo Durian'. HPP sekitar Rp 7.500 dengan harga jual Rp 18.000.";
            } else {
              reply = `Mengenai "${userMessage}": Pastikan mengontrol stok buah harian agar tidak cepat membusuk dan selalu catat pengeluaran operasional di menu Keuangan.`;
            }
            setAiChatMessages(prev => [...prev, { role: 'model', text: reply }]);
            setIsAiChatLoading(false);
          }, 600);
        } catch (err) {
          setAiChatMessages(prev => [...prev, { role: 'model', text: "Terjadi kesalahan internal pada asisten lokal." }]);
          setIsAiChatLoading(false);
        }
      };

      // Raw Material Addon Items for POS
      const rawMaterialAddons = useMemo(() => {
        const oId = selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId;
        return rawMaterials
          .filter(rm => rm.isAddon !== false)
          .map(rm => {
            const currentStock = getRawMaterialStock(rm, oId);
            return {
              id: 'addon-' + rm.id,
              rawMaterialId: rm.id,
              name: rm.name,
              category: 'Tambahan',
              price: Number(rm.sellPrice !== undefined && rm.sellPrice !== '' ? rm.sellPrice : (rm.costPrice || 0)),
              costPrice: Number(rm.costPrice || 0),
              cogs: Number(rm.costPrice || 0),
              stock: currentStock,
              unit: rm.unit || 'porsi',
              isUnlimited: false,
              isRawMaterialAddon: true,
              stocks: { [oId]: currentStock }
            };
          });
      }, [rawMaterials, selectedOutletId, outlets]);

      // Filtered Products for POS & Inventory
      const categories = useMemo(() => {
        const uniqueCats = new Set(products.map(p => p.category).filter(Boolean));
        if (rawMaterialAddons.length > 0) {
          uniqueCats.add('Tambahan');
        }
        const sortedCats = Array.from(uniqueCats).sort((a, b) => String(a).localeCompare(String(b)));
        return ['Semua', ...sortedCats];
      }, [products, rawMaterialAddons]);

      const allPosItems = useMemo(() => {
        return [...products, ...rawMaterialAddons];
      }, [products, rawMaterialAddons]);

      const filteredProducts = useMemo(() => {
        return allPosItems.filter(p => {
          const matchSearch = (p.name || '').toLowerCase().includes(searchQuery.toLowerCase());
          const matchCategory = selectedCategory === 'Semua' || p.category === selectedCategory;
          return matchSearch && matchCategory;
        }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      }, [allPosItems, searchQuery, selectedCategory]);

      const filteredInventoryProducts = useMemo(() => {
        return products.filter(p => (p.name || '').toLowerCase().includes(searchTermInventory.toLowerCase()))
                       .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      }, [products, searchTermInventory]);

      const sortedRawMaterials = useMemo(() => {
        const list = rawMaterials.filter(rm => (rm.name || '').toLowerCase().includes(searchTermRawMaterial.toLowerCase()));
        return list.sort((a, b) => {
          if (rawMaterialSort.field === 'stock') {
            const valA = selectedOutletId === 'all' ? getRawMaterialTotalStock(a) : getRawMaterialStock(a, selectedOutletId);
            const valB = selectedOutletId === 'all' ? getRawMaterialTotalStock(b) : getRawMaterialStock(b, selectedOutletId);
            return rawMaterialSort.dir === 'asc' ? valA - valB : valB - valA;
          } else if (rawMaterialSort.field === 'costPrice') {
            const valA = Number(a.costPrice) || 0;
            const valB = Number(b.costPrice) || 0;
            return rawMaterialSort.dir === 'asc' ? valA - valB : valB - valA;
          } else if (rawMaterialSort.field === 'sellPrice') {
            const valA = Number(a.sellPrice !== undefined && a.sellPrice !== '' ? a.sellPrice : a.costPrice) || 0;
            const valB = Number(b.sellPrice !== undefined && b.sellPrice !== '' ? b.sellPrice : b.costPrice) || 0;
            return rawMaterialSort.dir === 'asc' ? valA - valB : valB - valA;
          } else {
            const valA = (a.name || '').toLowerCase();
            const valB = (b.name || '').toLowerCase();
            return rawMaterialSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          }
        });
      }, [rawMaterials, searchTermRawMaterial, rawMaterialSort, selectedOutletId]);

      const validStockReceipts = useMemo(() => {
        const existingProductIds = new Set(products.map(p => p.id));
        return stockReceipts.filter(r => existingProductIds.has(r.productId) && (selectedOutletId === 'all' || r.outletId === selectedOutletId));
      }, [stockReceipts, products, selectedOutletId]);

      const checkRecipeAvailability = (product, requestedQty) => {
        if (!product.recipe || product.recipe.length === 0) return true;
        const currentOutletId = selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId;
        for (const bahan of product.recipe) {
          const rm = rawMaterials.find(r => r.id === bahan.materialId);
          if (!rm) {
            showToast('Bahan baku tidak ditemukan untuk produk ini!', 'error');
            return false;
          }
          const rmStock = getRawMaterialStock(rm, currentOutletId);
          if (rmStock < (bahan.qty * requestedQty)) {
            showToast(`Bahan baku ${rm.name} tidak cukup! Sisa: ${rmStock} ${rm.unit}`, 'error');
            return false;
          }
        }
        return true;
      };

      const addToCart = (product) => {
        const currentOutletId = selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId;
        if (product.isRawMaterialAddon) {
          const rm = rawMaterials.find(m => m.id === product.rawMaterialId);
          const currentRmStock = rm ? getRawMaterialStock(rm, currentOutletId) : 0;
          if (currentRmStock <= 0) return showToast(`Stok bahan baku ${product.name} habis!`, 'error');

          setCart(prev => {
            const existing = prev.find(item => item.id === product.id);
            const nextQty = existing ? existing.qty + 1 : 1;
            if (nextQty > currentRmStock) {
              showToast(`Maksimal stok bahan ${product.name} (${currentRmStock} ${product.unit}) tercapai!`, 'error');
              return prev;
            }
            if (existing) {
              return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
            }
            return [...prev, { 
              ...product, 
              name: `Tambahan: ${cleanProductName(product.name)}`, 
              displayName: product.name,
              image: '', 
              qty: 1, 
              price: product.price, 
              costPrice: product.costPrice, 
              originalPrice: product.price,
              note: '' 
            }];
          });
          return;
        }

        const isUnlimited = isProductUnlimited(product, currentOutletId);
        if (!isUnlimited && getStock(product, currentOutletId) <= 0) return showToast('Stok barang habis!', 'error');
        
        const activePromo = getActivePromo(product.id, currentOutletId);
        const finalPrice = activePromo ? Math.max(0, product.price - activePromo.discountNominal) : product.price;

        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          const nextQty = existing ? existing.qty + 1 : 1;
          
          if (!isUnlimited && nextQty > getStock(product, currentOutletId)) {
            showToast('Maksimal stok fisik tercapai!', 'error');
            return prev;
          }

          if (!checkRecipeAvailability(product, nextQty)) {
            return prev; // Batal masuk keranjang
          }

          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, name: cleanProductName(item.name), image: '', qty: item.qty + 1, price: finalPrice } : item);
          }
          return [...prev, { ...product, name: cleanProductName(product.name), image: '', qty: 1, price: finalPrice, originalPrice: product.price, note: '' }];
        });
      };

      const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));
      
      const updateCartQty = (id, delta) => {
        const currentOutletId = selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId;
        setCart(cart.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            if (newQty < 1) return item;
            if (item.isRawMaterialAddon) {
              const rm = rawMaterials.find(m => m.id === item.rawMaterialId);
              const currentRmStock = rm ? getRawMaterialStock(rm, currentOutletId) : 0;
              if (newQty > currentRmStock) {
                showToast(`Maksimal stok bahan ${item.displayName || item.name} (${currentRmStock} ${item.unit}) tercapai!`, 'error');
                return item;
              }
              return { ...item, qty: newQty };
            }
            if (!isProductUnlimited(item, currentOutletId) && newQty > getStock(item, currentOutletId)) {
              showToast('Maksimal stok fisik tercapai!', 'error');
              return item;
            }
            if (!checkRecipeAvailability(item, newQty)) {
              return item; // Batal tambah qty
            }
            return { ...item, qty: newQty };
          }
          return item;
        }));
      };

      const updateCartNote = (id, note) => {
        setCart(cart.map(item => item.id === id ? { ...item, note } : item));
      };

      const rawSubtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const discountAmount = Math.min(rawSubtotal, Number(discountNominal) || 0);
      const cartTotal = Math.max(0, rawSubtotal - discountAmount);
      const cartHppTotal = cart.reduce((sum, item) => sum + ((item.costPrice || 0) * item.qty), 0);

      const processCheckout = (targetStatus = 'paid') => {
        if (cart.length === 0) return showToast('Keranjang masih kosong!', 'error');
        const numericCash = parseFloat(cashGiven.replace(/\D/g, '')) || 0;
        if (targetStatus === 'paid' && selectedPaymentMethod === 'cash' && numericCash < cartTotal) {
          return showToast('Jumlah uang tunai kurang!', 'error');
        }

        const currentOutletId = selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId;

        const newProducts = products.map(p => {
          const cartItem = cart.find(c => c.id === p.id);
          if (cartItem && !isProductUnlimited(p, currentOutletId)) {
            return { ...p, stocks: { ...p.stocks, [currentOutletId]: Math.max(0, (p.stocks?.[currentOutletId] || 0) - cartItem.qty) } };
          }
          return p;
        });

        // Potong bahan baku berdasarkan resep & item addon, serta catat mutasi log
        let newRawMaterials = [...rawMaterials];
        const newRMLogs = [];
        const checkoutInvId = 'INV-' + Date.now().toString().slice(-6);

        cart.forEach(cartItem => {
          if (cartItem.isRawMaterialAddon) {
            const targetRM = newRawMaterials.find(rm => rm.id === cartItem.rawMaterialId);
            if (targetRM) {
              const usedQty = cartItem.qty;
              const currentStock = getRawMaterialStock(targetRM, currentOutletId);
              const newBal = Math.max(0, currentStock - usedQty);
              const primaryOId = outlets[0]?.id || 'out-1';
              const updatedStocks = { ...(targetRM.stocks || {}) };
              if (updatedStocks[primaryOId] === undefined) {
                updatedStocks[primaryOId] = getRawMaterialStock(targetRM, primaryOId);
              }
              if (primaryOId !== 'out-1' && updatedStocks['out-1'] !== undefined) {
                delete updatedStocks['out-1'];
              }
              updatedStocks[currentOutletId] = newBal;
              newRawMaterials = newRawMaterials.map(rm => rm.id === cartItem.rawMaterialId ? { ...rm, stocks: updatedStocks } : rm);
              newRMLogs.push({
                id: 'rml-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                date: new Date().toISOString(),
                materialId: targetRM.id,
                materialName: targetRM.name,
                unit: targetRM.unit,
                type: 'KELUAR',
                outletId: currentOutletId,
                source: targetStatus === 'paid' ? `Penjualan #${checkoutInvId.slice(-5)}` : `Pesanan #${checkoutInvId.slice(-5)}`,
                note: `Tambahan: ${targetRM.name} (${cartItem.qty} ${targetRM.unit || 'porsi'})`,
                qtyIn: 0,
                qtyOut: usedQty,
                balance: newBal,
                operator: currentUser.name
              });
            }
          } else if (cartItem.recipe && cartItem.recipe.length > 0) {
            cartItem.recipe.forEach(bahan => {
              const targetRM = newRawMaterials.find(rm => rm.id === bahan.materialId);
              if (targetRM) {
                const usedQty = bahan.qty * cartItem.qty;
                const currentStock = getRawMaterialStock(targetRM, currentOutletId);
                const newBal = Math.max(0, currentStock - usedQty);
                const primaryOId = outlets[0]?.id || 'out-1';
                const updatedStocks = { ...(targetRM.stocks || {}) };
                if (updatedStocks[primaryOId] === undefined) {
                  updatedStocks[primaryOId] = getRawMaterialStock(targetRM, primaryOId);
                }
                if (primaryOId !== 'out-1' && updatedStocks['out-1'] !== undefined) {
                  delete updatedStocks['out-1'];
                }
                updatedStocks[currentOutletId] = newBal;
                newRawMaterials = newRawMaterials.map(rm => rm.id === bahan.materialId ? { ...rm, stocks: updatedStocks } : rm);
                newRMLogs.push({
                  id: 'rml-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                  date: new Date().toISOString(),
                  materialId: targetRM.id,
                  materialName: targetRM.name,
                  unit: targetRM.unit,
                  type: 'KELUAR',
                  outletId: currentOutletId,
                  source: targetStatus === 'paid' ? `Penjualan #${checkoutInvId.slice(-5)}` : `Pesanan #${checkoutInvId.slice(-5)}`,
                  note: `${cartItem.name} (${cartItem.qty} porsi)`,
                  qtyIn: 0,
                  qtyOut: usedQty,
                  balance: newBal,
                  operator: currentUser.name
                });
              }
            });
          }
        });

        const newTransaction = {
          id: checkoutInvId,
          outletId: currentOutletId,
          date: new Date().toISOString(),
          items: [...cart],
          subtotal: rawSubtotal,
          discount: discountAmount,
          total: cartTotal,

          ...tx,
          status: 'paid',
          paidDate: new Date().toISOString(),
          paymentMethod: paymentMethod,
          cash: paymentMethod === 'cash' ? numericCash : tx.total,
          change: paymentMethod === 'cash' ? Math.max(0, numericCash - tx.total) : 0,
          cashier: currentUser.name
        };

              stocks: { ...p.stocks, [tx.outletId]: currentStock + cartItem.qty }

          }

        setTransactions(transactions.filter(t => t.id !== tx.id));

      const voidTransaction = (id) => {

          if (p.endDate && p.endDate < today) return false;
          return true;

          updatedStocks[targetOId] = newStockVal;

          updatedStocks = {};

        }

              qtyIn: newStockVal,
              qtyOut: 0,
              balance: newStockVal,
              operator: currentUser?.name || 'Kasir'
            }, ...prev]);
          }
          showToast(`Bahan baku ditambahkan untuk ${outletName}!`);

      };

        const primaryOId = outlets[0]?.id || 'out-1';
        const targetOId = selectedOutletId === 'all' ? primaryOId : selectedOutletId;
        const outletName = outlets.find(o => o.id === targetOId)?.name || targetOId;
        const currentStock = getRawMaterialStock(rm, targetOId);
        const qty = prompt(`Tambah stok "${rm.name}" berapa ${rm.unit}?\n(Cabang: ${outletName}, Stok saat ini: ${currentStock} ${rm.unit})`);
        if (qty && !isNaN(qty) && Number(qty) > 0) {
          const num = Number(qty);
          const note = prompt('Keterangan / Supplier (opsional):', 'Penerimaan bahan');
          const newStock = currentStock + num;
          const updatedStocks = { ...(rm.stocks || {}) };
          if (updatedStocks[primaryOId] === undefined) {
            updatedStocks[primaryOId] = getRawMaterialStock(rm, primaryOId);
          }
          if (primaryOId !== 'out-1' && updatedStocks['out-1'] !== undefined) {
            delete updatedStocks['out-1'];
          }
          updatedStocks[targetOId] = newStock;
          setRawMaterials(rawMaterials.map(r => r.id === rm.id ? { ...r, stocks: updatedStocks } : r));
          setRawMaterialLogs(prev => [{
            id: 'rml-' + Date.now(),
            date: new Date().toISOString(),
            materialId: rm.id,
            materialName: rm.name,
            unit: rm.unit,
            type: 'MASUK',
            outletId: targetOId,
            source: 'Penerimaan Bahan',
            note: note ? `${note} (${outletName})` : `Penambahan stok manual (${outletName})`,
            qtyIn: num,
            qtyOut: 0,
            balance: newStock,
            operator: currentUser?.name || 'Kasir'
          }, ...prev]);
          showToast(`Stok ${rm.name} cabang ${outletName} ditambah ${num} ${rm.unit}!`);
        }
      };

      const handleReduceRawMaterialStock = (rm) => {
        const primaryOId = outlets[0]?.id || 'out-1';
        const targetOId = selectedOutletId === 'all' ? primaryOId : selectedOutletId;
        const outletName = outlets.find(o => o.id === targetOId)?.name || targetOId;
        const currentStock = getRawMaterialStock(rm, targetOId);
        const qty = prompt(`Kurangi stok "${rm.name}" berapa ${rm.unit}?\n(Cabang: ${outletName}, Stok saat ini: ${currentStock} ${rm.unit})`);

          if (num > currentStock) {
            return showToast(`Jumlah melebihi sisa stok (${currentStock} ${rm.unit}) di ${outletName}!`, 'error');

        setIsStockReceiptModalOpen(false);
        setStockReceiptTarget(null);
        showToast(`+${qtyAdded} stok berhasil ditambahkan ke ${stockReceiptTarget.name}!`);
      };

      const openOpnameModal = () => {
        const currentOutletId = selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId;
        const initialItems = products.filter(p => !isProductUnlimited(p, currentOutletId)).map(p => {
          const sysStock = p.stocks?.[currentOutletId] || 0;
          return {
            productId: p.id,
            name: p.name,
            systemStock: sysStock,
            actualStock: sysStock.toString(),
            selisih: 0,
            keterangan: 'Sesuai'
          };
        });
        setOpnameFormItems(initialItems);
        setIsOpnameModalOpen(true);
      };

      const updateOpnameItem = (productId, actualVal) => {
        setOpnameFormItems(prev => prev.map(item => {
          if (item.productId !== productId) return item;
          const actual = parseInt(actualVal) || 0;
          const selisih = actual - item.systemStock;
          let ket = 'Sesuai';
          if (selisih > 0) ket = `Surplus (+${selisih})`;
          else if (selisih < 0) ket = `Selisih Kurang (${selisih})`;
          return { ...item, actualStock: actualVal, selisih, keterangan: ket };
        }));
      };

      const saveStockOpname = () => {
        const currentOutletId = selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId;
        const opnameItemsToSave = [];
        const newProducts = [...products];

        opnameFormItems.forEach(item => {
          const actual = parseInt(item.actualStock);
          if (isNaN(actual) || actual < 0) return;
          const selisih = actual - item.systemStock;
          if (selisih !== 0) {
            opnameItemsToSave.push({
              productId: item.productId,
              productName: item.name,
              systemStock: item.systemStock,
              actualStock: actual,
              selisih,
              keterangan: item.keterangan
            });
            // Update physical product stock
            const pIdx = newProducts.findIndex(p => p.id === item.productId);
            if (pIdx !== -1) {
              newProducts[pIdx] = {
                ...newProducts[pIdx],
                stocks: {
                  ...newProducts[pIdx].stocks,
                  [currentOutletId]: actual
                }
              };
            }
          }
        });

        if (opnameItemsToSave.length > 0) {
          const newOpname = {
            id: 'OPN-' + Date.now().toString().slice(-6),
            outletId: currentOutletId,
            date: opnameFormDate,
            items: opnameItemsToSave,
            operator: currentUser?.name || 'Admin'
          };
          setStockOpnames([newOpname, ...stockOpnames]);
          setProducts(newProducts);
          showToast(`Stok Opname disimpan: ${opnameItemsToSave.length} item disesuaikan.`);
        } else {
          showToast('Tidak ada selisih stok (semua sama dengan sistem).', 'info');
        }
        setIsOpnameModalOpen(false);
      };


      // Modal Expense State
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [expenseForm, setExpenseForm] = useState({ title: '', category: 'Bahan Baku', amount: '', paymentSource: 'cash' });

      const saveExpense = () => {
        if (!expenseForm.title || !expenseForm.amount) return showToast('Isi keterangan & nominal!', 'error');
        setExpenses([{
          id: 'exp-' + generateId(),
          outletId: selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId,
          date: new Date().toISOString(),
          title: expenseForm.title,
          category: expenseForm.category,
          amount: parseFloat(expenseForm.amount) || 0,
          paymentSource: expenseForm.paymentSource || 'cash',
          operator: currentUser?.name || 'Owner'
        }, ...expenses]);
        setExpenseForm({ title: '', category: 'Bahan Baku', amount: '', paymentSource: 'cash' });
        setIsExpenseModalOpen(false);
        showToast('Pengeluaran berhasil dicatat!');
      };

      const deleteExpense = (id) => {
        if (window.confirm('Hapus pencatatan pengeluaran ini?')) {
          setDeletedRecordIds(prev => {
            const next = [...new Set([...prev, id])];
            localStorage.setItem('bjp_deleted_records_v7', JSON.stringify(next));
            return next;
          });
          setExpenses(prev => prev.filter(e => e.id !== id));
          showToast('Pengeluaran berhasil dihapus!');
        }
      };

      // Modal Income State (Catat Pemasukan Saldo Usaha)
      const [isIncomeModalOpen, setIsIncomeModalOpen] = useState(false);
      const [incomeForm, setIncomeForm] = useState({ title: '', category: 'Modal Tambahan', amount: '', paymentDestination: 'cash', date: '' });

      const saveIncome = () => {
        if (!incomeForm.title || !incomeForm.amount) return showToast('Isi keterangan & nominal pemasukan!', 'error');
        const amt = parseFloat((incomeForm.amount || '').toString().replace(/\D/g, ''));
        if (isNaN(amt) || amt <= 0) return showToast('Nominal pemasukan harus lebih dari 0!', 'error');
        
        const newIncome = {
          id: 'inc-' + generateId(),
          outletId: selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId,
          date: incomeForm.date ? new Date(incomeForm.date).toISOString() : new Date().toISOString(),
          title: (incomeForm.title || '').trim(),
          category: incomeForm.category || 'Modal Tambahan',
          amount: amt,
          paymentDestination: incomeForm.paymentDestination || 'cash',
          operator: currentUser?.name || 'Owner'
        };

        setIncomes(prev => [newIncome, ...prev]);
        setIncomeForm({ title: '', category: 'Modal Tambahan', amount: '', paymentDestination: 'cash', date: '' });
        setIsIncomeModalOpen(false);
        showToast('Pemasukan saldo berhasil dicatat!');
      };

      const deleteIncome = (id) => {
        if (window.confirm('Hapus pencatatan pemasukan saldo ini?')) {
          setDeletedRecordIds(prev => {
            const next = [...new Set([...prev, id])];
            localStorage.setItem('bjp_deleted_records_v7', JSON.stringify(next));
            return next;
          });
          setIncomes(prev => prev.filter(i => i.id !== id));
          showToast('Pemasukan saldo berhasil dihapus!');
        }
      };

      // Internal Fund Transfer (Kas <-> Bank) Handlers
      const openTransferModal = (defaultType = 'cash_to_bank') => {
        setTransferForm({
          type: defaultType,
          amount: '',
          note: defaultType === 'cash_to_bank' ? 'Setor tunai kasir ke rekening bank' : 'Tarik tunai dari rekening bank ke kasir',
          date: new Date().toISOString().slice(0, 16)
        });
        setIsTransferModalOpen(true);
      };

      const saveTransfer = (e) => {
        if (e) e.preventDefault();
        const amt = parseFloat((transferForm.amount || '').toString().replace(/\D/g, ''));
        if (isNaN(amt) || amt <= 0) {
          return showToast('Nominal pemindahan harus lebih dari 0!', 'error');
        }
        
        const newTransfer = {
          id: 'trf-' + generateId(),
          outletId: selectedOutletId === 'all' ? (outlets[0]?.id || 'out-1') : selectedOutletId,
          date: transferForm.date ? new Date(transferForm.date).toISOString() : new Date().toISOString(),
          type: transferForm.type, // 'cash_to_bank' | 'bank_to_cash'
          from: transferForm.type === 'cash_to_bank' ? 'cash' : 'bank',
          to: transferForm.type === 'cash_to_bank' ? 'bank' : 'cash',
          amount: amt,
          note: (transferForm.note || '').trim() || (transferForm.type === 'cash_to_bank' ? 'Setoran Kas ke Bank' : 'Penarikan Bank ke Kas'),
          operator: currentUser?.name || 'Kasir / Owner'
        };

        setTransfers(prev => [newTransfer, ...prev]);
        setIsTransferModalOpen(false);
        showToast(`Berhasil memindahkan ${formatRp(amt)} (${newTransfer.type === 'cash_to_bank' ? 'Kas Tunai ke Bank' : 'Bank ke Kas Tunai'})!`);
      };

      const deleteTransfer = (id) => {
        if (window.confirm('Hapus riwayat pemindahan saldo ini? Posisi saldo kas dan bank akan dikembalikan seperti semula.')) {
          setDeletedRecordIds(prev => {
            const next = [...new Set([...prev, id])];
            localStorage.setItem('bjp_deleted_records_v7', JSON.stringify(next));
            return next;
          });
          setTransfers(prev => prev.filter(tr => tr.id !== id));
          showToast('Riwayat pemindahan saldo dihapus!');
        }
      };

      const Toast = () => (
        toast.show && (
          <div className={`fixed bottom-5 right-5 p-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 font-semibold text-[#228B22] animate-bounce ${toast.type === 'error' ? 'bg-red-500' : 'bg-[#7CFC00]'}`}>
            <Icon name={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} size={20}/>
            {toast.message}
          </div>
        )
      );

      // Loading Screen
      if (isLoading) {
        return (
          <div className="min-h-screen bg-[#F0FDF4] flex items-center justify-center p-4">
            <div className="text-[#228B22] font-bold text-xl animate-pulse flex flex-col items-center gap-4">
              <div className="w-16 h-16 border-4 border-[#228B22] border-t-transparent rounded-full animate-spin"></div>
              Memuat Data dari Supabase Database...
            </div>
          </div>
        );
      }

      // Login Screen
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-[#F0FDF4] flex items-center justify-center p-4">
            <Toast />
            <div className="w-full max-w-md bg-white/90 border border-[#BBF7D0] p-8 rounded-3xl shadow-2xl backdrop-blur-xl relative overflow-hidden">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-gradient-to-tr from-[#7CFC00] to-[#32CD32] rounded-2xl flex items-center justify-center text-[#228B22] font-black text-2xl mx-auto mb-4 shadow-xl shadow-[#7CFC00]/30">
                  BJ
                </div>
                <h1 className="text-3xl font-black text-[#228B22] tracking-tight">BosJusPos</h1>
                <p className="text-[#2E8B57] mt-1 text-xs">Sistem Kasir, Keuangan & Asisten AI UMKM</p>
              </div>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-[10px] font-bold text-[#2E8B57] mb-1 uppercase">Nama Akun</label>
                  <input type="text" value={loginName} onChange={e => setLoginName(e.target.value)} required placeholder="Contoh: Owner Bos" className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-4 py-3 text-[#228B22] text-sm focus:outline-none focus:border-[#228B22]"/>
                </div>
                <div>
                  <label className="block text-[10px] font-bold text-[#2E8B57] mb-1 uppercase">Password</label>
                  <input type="password" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} required placeholder="Password..." className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-4 py-3 text-[#228B22] text-sm focus:outline-none focus:border-[#228B22]"/>
                </div>
                <button type="submit" className="w-full bg-[#7CFC00] hover:bg-[#6ADD00] text-[#228B22] font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-[#7CFC00]/20 text-sm">
                  Masuk Aplikasi
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#F0FDF4] text-[#228B22] flex flex-col">
          <Toast />
          
          {/* Top Header Bar */}
          {activeTab === 'pos' ? (
            <header className="no-print sticky top-0 z-40 flex flex-wrap justify-between items-center px-4 py-2.5 bg-white border-b border-[#BBF7D0] backdrop-blur-md gap-3 shadow-xl">
              <div className="flex items-center gap-3">
                <button onClick={() => handleTabSwitch('home')} className="flex items-center gap-2 px-4 py-2 bg-[#7CFC00]/10 hover:bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30 rounded-2xl text-xs font-black transition-all shadow-md active:scale-95">
                  <Icon name="arrow-left" size={16}/> Kembali ke Menu Utama / Dashboard
                </button>
                <div className="hidden sm:flex items-center gap-2 border-l border-[#BBF7D0] pl-3">
                  <span className="text-xs font-black text-[#228B22]">Mode Kasir (POS)</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {isCloudSyncing ? (
                  <div className="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 text-[#228B22] border border-[#BBF7D0] rounded-xl text-[10px] font-bold animate-pulse" title="Sedang menyinkronkan data dengan Supabase Database...">
                    <Icon name="refresh" size={12} className="animate-spin text-[#228B22]"/>
                    <span className="hidden sm:inline">Sinkron Supabase...</span>
                  </div>
                ) : (
                  <div className="flex items-center gap-1.5 px-2.5 py-1 bg-[#DCFCE7]/70 text-[#2E8B57] border border-[#BBF7D0] rounded-xl text-[10px] font-bold" title="Tersambung ke Supabase Database">
                    <Icon name="cloud" size={12} className="text-[#3CB371]"/>
                    <span className="hidden sm:inline">Supabase Siap</span>
                  </div>
                )}
                <div className="flex items-center gap-1.5 bg-[#F0FDF4] px-3 py-1.5 rounded-xl border border-[#BBF7D0] text-xs">
                  <Icon name="store" size={14} className="text-[#228B22]"/>
                  {currentUser.role === 'owner' ? (
                    <select value={selectedOutletId} onChange={e => setSelectedOutletId(e.target.value)} className="bg-transparent text-xs text-[#228B22] font-bold focus:outline-none cursor-pointer">
                      <option value="all" className="bg-white text-[#228B22]">Semua Outlet</option>
                      {outlets.map(o => (
                        <option key={o.id} value={o.id} className="bg-white text-[#228B22]">{o.name}</option>
                      ))}
                    </select>
                  ) : (
                    <span className="text-[#228B22] font-bold">{outlets.find(o => o.id === selectedOutletId)?.name || 'Outlet'}</span>
                  )}
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 bg-[#DCFCE7] rounded-xl border border-[#86EFAC]">
                  <span className="text-xs font-bold text-[#228B22]">{currentUser.name}</span>
                  <span className={`text-[9px] uppercase px-2 py-0.5 rounded-full font-bold ${currentUser.role === 'owner' ? 'bg-amber-500/20 text-amber-400' : 'bg-cyan-500/20 text-cyan-400'}`}>
                    {currentUser.role}
                  </span>
                </div>

                <button onClick={handleLogout} title="Keluar Akun" className="p-2 text-[#2E8B57] hover:text-red-400 bg-[#DCFCE7] hover:bg-red-500/10 rounded-xl transition-all">
                  <Icon name="logout" size={16}/>
                </button>
              </div>
            </header>
          ) : (
            <header className="no-print sticky top-0 z-40 flex flex-wrap justify-between items-center px-4 py-3 bg-white/90 border-b border-[#BBF7D0] backdrop-blur-md gap-3">
              <div className="flex items-center gap-3">
                <div onClick={() => handleTabSwitch('home')} className="w-10 h-10 bg-gradient-to-tr from-[#7CFC00] to-[#32CD32] rounded-2xl flex items-center justify-center text-[#228B22] font-black shadow-lg shadow-[#7CFC00]/20 cursor-pointer hover:scale-105 transition-transform">
                  BJ
                </div>
                <div>
                  <h1 className="text-lg font-black text-[#228B22] flex items-center gap-1.5">
                    BosJusPos
                    <span className="text-[10px] bg-[#7CFC00]/20 text-emerald-300 px-2 py-0.5 rounded-full border border-[#228B22]/30">v2.0</span>
                  </h1>
                  <p className="text-[11px] text-[#2E8B57] font-medium">Kasir, Keuangan & Saldo Usaha</p>
                </div>
              </div>

              {/* Navigation Tabs Bar when inside app */}
              <div className="hidden md:flex items-center bg-[#F0FDF4] p-1 rounded-2xl border border-[#BBF7D0] text-xs">
                <button onClick={() => handleTabSwitch('home')} className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-colors ${activeTab === 'home' ? 'bg-[#DCFCE7] text-[#228B22]' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>
                  <Icon name="home" size={14}/> Dashboard
                </button>
                {hasAccess(currentUser, 'pos') && (
                  <button onClick={() => handleTabSwitch('pos')} className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-colors ${activeTab === 'pos' ? 'bg-[#7CFC00] text-[#228B22] shadow-md shadow-[#7CFC00]/20' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>
                    <Icon name="cart" size={14}/> Kasir (POS)
                  </button>
                )}
                {hasAccess(currentUser, 'sales_report') && (
                  <button onClick={() => handleTabSwitch('sales_report')} className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-colors ${activeTab === 'sales_report' ? 'bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>
                    <Icon name="trending" size={14}/> Penjualan
                  </button>
                )}
                {hasAccess(currentUser, 'inventory') && (
                  <button onClick={() => handleTabSwitch('inventory')} className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-colors ${activeTab === 'inventory' ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>
                    <Icon name="package" size={14}/> Stok
                  </button>
                )}
                {hasAccess(currentUser, 'finance') && (
                  <button onClick={() => handleTabSwitch('finance')} className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-colors ${activeTab === 'finance' ? 'bg-purple-600 text-[#228B22] shadow-md shadow-purple-600/20' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>
                    <Icon name="dollar-sign" size={14}/> Keuangan
                  </button>
                )}
                {hasAccess(currentUser, 'ai_advisor') && (
                  <button onClick={() => handleTabSwitch('ai_advisor')} className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-colors ${activeTab === 'ai_advisor' ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-[#228B22] shadow-md shadow-purple-500/20' : 'text-[#2E8B57] hover:text-[#228B22]'}`}>
                    <Icon name="sparkles" size={14} className="text-amber-300"/> AI Advisor
                  </button>
                )}
              </div>

              {/* Outlet Selector & Profile Bar */}
              <div className="flex items-center gap-2 flex-wrap">
                {isCloudSyncing ? (
                  <div className="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 text-[#228B22] border border-[#BBF7D0] rounded-xl text-[10px] font-bold animate-pulse" title="Sedang menyinkronkan data dengan Supabase Database...">
                    <Icon name="refresh" size={12} className="animate-spin text-[#228B22]"/>
                    <span className="hidden sm:inline">Sinkron Supabase...</span>
                  </div>
                ) : (
                  <div className="flex items-center gap-1.5 px-2.5 py-1 bg-[#DCFCE7]/70 text-[#2E8B57] border border-[#BBF7D0] rounded-xl text-[10px] font-bold" title="Tersambung ke Supabase Database">
                    <Icon name="cloud" size={12} className="text-[#3CB371]"/>
                    <span className="hidden sm:inline">Supabase Siap</span>
                  </div>
                )}
                <div className="flex items-center gap-1.5 bg-[#F0FDF4] px-3 py-1.5 rounded-xl border border-[#BBF7D0] text-xs">
                  <Icon name="store" size={14} className="text-[#228B22]"/>
                  {currentUser.role === 'owner' ? (
                    <>
                      <select value={selectedOutletId} onChange={e => setSelectedOutletId(e.target.value)} className="bg-transparent text-xs text-[#228B22] font-bold focus:outline-none cursor-pointer">
                        <option value="all" className="bg-white text-[#228B22]">Semua Outlet</option>
                        {outlets.map(o => (
                          <option key={o.id} value={o.id} className="bg-white text-[#228B22]">{o.name}</option>
                        ))}
                      </select>
                      <button onClick={() => { setEditingOutlet(null); setOutletForm({ name: '', address: '', phone: '' }); setIsOutletModalOpen(true); }} title="Kelola Outlet & Cabang (Khusus Owner)" className="p-1 text-[#2E8B57] hover:text-[#228B22]"><Icon name="plus" size={14}/></button>
                    </>
                  ) : (
                    <span className="text-[#228B22] font-bold">{outlets.find(o => o.id === selectedOutletId)?.name || 'Outlet'}</span>
                  )}
                </div>

                {hasAccess(currentUser, 'printer') && (
                  <button onClick={() => { setPrinterForm(printerSettings); setIsPrinterModalOpen(true); }} title="Pengaturan Printer" className="flex items-center gap-1.5 px-3 py-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl border border-[#86EFAC] text-xs font-bold">
                    <Icon name="printer" size={14} className="text-amber-400"/> Printer
                  </button>
                )}
                {hasAccess(currentUser, 'qris_settings') && (
                  <button onClick={() => { setQrisForm(qrisConfig); setIsQrisModalOpen(true); }} title="Pengaturan QRIS GoPay Merchant" className="flex items-center gap-1.5 px-3 py-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl border border-[#86EFAC] text-xs font-bold">
                    <Icon name="qr-code" size={14} className="text-emerald-600"/> QRIS
                  </button>
                )}
                {currentUser.role === 'owner' && (
                  <button onClick={() => setIsStaffModalOpen(true)} title="Manajemen Pegawai" className="flex items-center gap-1.5 px-3 py-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl border border-[#86EFAC] text-xs font-bold">
                    <Icon name="user-cog" size={14} className="text-cyan-400"/> Pegawai
                  </button>
                )}

                <div className="flex items-center gap-2 px-3 py-1.5 bg-[#DCFCE7] rounded-xl border border-[#86EFAC]">
                  <span className="text-xs font-bold text-[#228B22]">{currentUser.name}</span>
                  <span className={`text-[9px] uppercase px-2 py-0.5 rounded-full font-bold ${currentUser.role === 'owner' ? 'bg-amber-500/20 text-amber-400' : 'bg-cyan-500/20 text-cyan-400'}`}>
                    {currentUser.role}
                  </span>
                </div>

                <button onClick={handleLogout} title="Keluar Akun" className="p-2 text-[#2E8B57] hover:text-red-400 bg-[#DCFCE7] hover:bg-red-500/10 rounded-xl transition-all">
                  <Icon name="logout" size={16}/>
                </button>
              </div>
            </header>
          )}

          {/* Mobile Bottom Navigation (Hidden in POS mode to maximize full screen space) */}
          {activeTab !== 'pos' && (
            <div className="no-print md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 border-t border-[#BBF7D0] p-2 flex justify-around backdrop-blur-md text-[10px]">
              <button onClick={() => handleTabSwitch('home')} className={`flex flex-col items-center gap-1 py-1 px-2 ${activeTab === 'home' ? 'text-[#228B22] font-bold' : 'text-[#2E8B57]'}`}>
                <Icon name="home" size={18}/> Home
              </button>
              {hasAccess(currentUser, 'pos') && (
                <button onClick={() => handleTabSwitch('pos')} className={`flex flex-col items-center gap-1 py-1 px-2 ${activeTab === 'pos' ? 'text-[#228B22] font-bold' : 'text-[#2E8B57]'}`}>
                  <Icon name="cart" size={18}/> Kasir
                </button>
              )}
              {hasAccess(currentUser, 'sales_report') && (
                <button onClick={() => handleTabSwitch('sales_report')} className={`flex flex-col items-center gap-1 py-1 px-2 ${activeTab === 'sales_report' ? 'text-amber-400 font-bold' : 'text-[#2E8B57]'}`}>
                  <Icon name="trending" size={18}/> Laporan
                </button>
              )}

                    </span>
                    <span className="inline-flex items-center gap-1 text-xs bg-blue-50 text-blue-700 font-bold px-2.5 py-1 rounded-xl border border-blue-200">
                      <Icon name="shopping-bag" size={13}/> Take Away: {channelBreakdown.take_away.count}
                    </span>
                    <span className="inline-flex items-center gap-1 text-xs bg-green-50 text-green-700 font-bold px-2.5 py-1 rounded-xl border border-green-300">
                      <Icon name="truck" size={13} className="text-green-600"/> GoFood: {channelBreakdown.gofood.count}
                    </span>
                    <span className="inline-flex items-center gap-1 text-xs bg-orange-50 text-orange-700 font-bold px-2.5 py-1 rounded-xl border border-orange-300">
                      <Icon name="truck" size={13} className="text-orange-600"/> Shopee: {channelBreakdown.shopeefood.count}
                    </span>
                    <span className="inline-flex items-center gap-1 text-xs bg-emerald-50 text-emerald-800 font-bold px-2.5 py-1 rounded-xl border border-emerald-300">
                      <Icon name="truck" size={13} className="text-emerald-700"/> Grab: {channelBreakdown.grabfood.count}
                    </span>
                    <span className="inline-flex items-center gap-1 text-xs bg-amber-50 text-amber-800 font-bold px-2.5 py-1 rounded-xl border border-amber-300">
                      <Icon name="truck" size={13} className="text-amber-700"/> Maxim: {channelBreakdown.maximfood.count}
                    </span>
                  </div>

                  <div className="overflow-x-auto rounded-2xl border border-[#BBF7D0]">
                    <table className="w-full text-left text-xs text-[#228B22]">
                      <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                        <tr>
                          <th className="px-4 py-3">No. Invoice</th>
                          <th className="px-4 py-3">Layanan & Info</th>
                          <th className="px-4 py-3">Tanggal & Jam</th>
                          <th className="px-4 py-3">Kasir</th>
                          <th className="px-4 py-3">Detail Items & Total Cup</th>
                          <th className="px-4 py-3">Metode & Status</th>
                          <th className="px-4 py-3 text-right">Total Tagihan</th>
                          <th className="px-4 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#BBF7D0] font-mono-code">
                        {filteredTransactions.length === 0 ? (
                          <tr>
                            <td colSpan="8" className="text-center py-8 text-[#3CB371] italic">
                              Tidak ada transaksi penjualan pada periode ini.
                            </td>
                          </tr>
                        ) : (
                          filteredTransactions.map(t => {
                            const orderMeta = getOrderTypeMeta(t.orderType);
                            const isPending = (t.status || 'paid') === 'pending';
                            const txCupCount = (t.items || []).reduce((sum, it) => sum + (Number(it.qty) || 0), 0);

                            return (
                              <tr key={t.id} className={`transition-colors ${isPending ? 'bg-amber-50/50 hover:bg-amber-50' : 'hover:bg-[#DCFCE7]'}`}>
                                <td className="px-4 py-3 font-bold text-[#228B22]">
                                  {t.id}
                                </td>
                                <td className="px-4 py-3 font-sans">
                                  <div className="space-y-1">
                                    <span className={`inline-flex items-center gap-1 font-bold text-[10px] px-2 py-0.5 rounded-md border ${orderMeta.badgeColor}`}>
                                      <Icon name={orderMeta.icon || 'utensils'} size={11}/>
                                      {orderMeta.shortLabel}
                                    </span>
                                    {t.customerNote && (
                                      <div className="text-[11px] font-bold text-[#228B22] line-clamp-1">
                                        {t.customerNote}
                                      </div>
                                    )}
                                  </div>
                                </td>
                                <td className="px-4 py-3 text-[#2E8B57]">{new Date(t.date).toLocaleString('id-ID')}</td>
                                <td className="px-4 py-3 font-sans">{t.cashier || 'Kasir'}</td>
                                <td className="px-4 py-3 font-sans">
                                  <div className="max-w-xs space-y-0.5">
                                    {t.items?.map((it, idx) => (
                                      <div key={idx} className="text-[11px] text-[#228B22]">
                                        <span className="font-bold text-amber-500">{it.qty}x</span> {it.name}
                                        {it.note && <span className="text-[10px] text-[#2E8B57] italic block pl-4 font-mono">* {it.note}</span>}
                                      </div>
                                    ))}
                                    <div className="pt-1 flex items-center gap-2">
                                      <span className="inline-block bg-[#DCFCE7] text-[#228B22] font-black text-[10px] px-2 py-0.5 rounded-md border border-[#86EFAC]">
                                        Total: {txCupCount} Cup
                                      </span>
                                      {t.discount > 0 && (
                                        <span className="text-[10px] text-amber-700 font-bold">Diskon: -{formatRp(t.discount)}</span>
                                      )}
                                    </div>
                                  </div>
                                </td>
                                <td className="px-4 py-3 font-sans">
                                  <div className="space-y-1">
                                    {isPending ? (
                                      <span className="inline-flex items-center gap-1 bg-amber-50 text-amber-700 border border-amber-300 font-black text-[10px] px-2 py-0.5 rounded-md uppercase animate-pulse">
                                        <Icon name="clock" size={11} className="text-amber-600"/> Belum Dibayar
                                      </span>
                                    ) : (
                                      <span className={`uppercase font-bold text-[10px] px-2.5 py-0.5 rounded-md border inline-block ${
                                        (t.paymentMethod || '').toLowerCase() === 'qris'
                                          ? 'bg-cyan-50 text-cyan-700 border-cyan-200'
                                          : (t.paymentMethod || '').toLowerCase() === 'transfer'
                                          ? 'bg-purple-50 text-purple-700 border-purple-200'
                                          : 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                      }`}>
                                        {t.paymentMethod || 'cash'} (Lunas)
                                      </span>
                                    )}
                                  </div>
                                </td>
                                <td className="px-4 py-3 text-right font-black text-[#228B22] font-sans">{formatRp(t.total)}</td>
                                <td className="px-4 py-3 text-center">
                                  <div className="flex items-center justify-center gap-1.5">
                                    {isPending && (
                                      <button 
                                        onClick={() => { setSettleModalTx(t); setSettlePaymentMethod('cash'); setSettleCashGiven(''); }} 
                                        className="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg text-[10px] font-black shadow-sm flex items-center gap-1 transition-transform active:scale-95"
                                        title="Lunasi Tagihan"
                                      >
                                        <Icon name="check-circle" size={12}/> Lunasi
                                      </button>
                                    )}
                                    <button onClick={() => { setLastReceipt(t); setIsReceiptModalOpen(true); }} className="p-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-lg transition-colors" title="Cetak Struk">
                                      <Icon name="printer" size={13}/>
                                    </button>
                                    {currentUser.role === 'owner' && (
                                      <button onClick={() => voidTransaction(t.id)} className="p-1.5 bg-[#DCFCE7] hover:bg-red-500/10 text-red-400 rounded-lg transition-colors" title="Void / Batalkan Transaksi">
                                        <Icon name="trash" size={13}/>
                                      </button>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                      {filteredTransactions.length > 0 && (
                        <tfoot>
                          <tr className="bg-[#F0FDF4] font-bold text-xs border-t-2 border-[#BBF7D0]">
                            <td colSpan="4" className="px-4 py-3 text-right text-[#2E8B57] font-sans uppercase">
                              TOTAL OMSET LUNAS ({paidTransactions.length} Transaksi)
                            </td>
                            <td className="px-4 py-3 font-sans">
                              <span className="bg-emerald-100 text-emerald-900 font-black text-xs px-2.5 py-1 rounded-lg border border-emerald-300">
                                Total: {totalCupSold} Cup
                              </span>
                            </td>
                            <td></td>
                            <td className="px-4 py-3 text-right font-black text-sm text-[#228B22] font-sans">
                              {formatRp(totalOmset)}
                            </td>
                            <td></td>
                          </tr>
                        </tfoot>
                      )}
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* MODUL KASIR (POS) */}
            {activeTab === 'pos' && (
