                                  <span className="text-cyan-400 font-bold bg-cyan-400/10 px-2.5 py-0.5 rounded-full text-[10px]">Tak Terbatas</span>
                                ) : (
                                  <span className={`font-bold px-2.5 py-0.5 rounded-full text-[10px] ${getStock(p) <= p.minStock ? 'text-red-400 bg-red-400/10 animate-pulse' : 'text-[#228B22] bg-[#DCFCE7]'}`}>
                                    {getStock(p)} item {getStock(p) <= p.minStock && '(Stok Rendah)'}
                                  </span>
                                )}
                              </td>
                              <td className="px-4 py-3">
                                <div className="flex items-center justify-center gap-1.5">
                                  <button onClick={() => openStockReceiptModal(p)} className="flex items-center gap-1 px-2.5 py-1.5 bg-[#7CFC00]/10 hover:bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30 rounded-lg text-[10px] font-bold transition-colors" title="Tambah Stok / Penerimaan Barang">
                                    <Icon name="plus" size={11}/> Masuk
                                  </button>
                                  <button onClick={() => openStockOutModal(p)} className="flex items-center gap-1 px-2.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 rounded-lg text-[10px] font-bold transition-colors" title="Kurangi Stok / Barang Keluar">
                                    <Icon name="minus" size={11}/> Keluar
                                  </button>
                                   <button onClick={() => { setStockCardProductId(p.id); setInventorySubTab('stock_card'); }} className="p-1.5 bg-cyan-50 hover:bg-cyan-100 text-cyan-600 rounded-lg transition-colors border border-cyan-200" title="Lihat Kartu Stok Produk"><Icon name="clock" size={13}/></button>
                                  {hasAccess(currentUser, 'inv_edit_product') && (
                                    <button onClick={() => openProductModal(p)} className="p-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-cyan-400 rounded-lg transition-colors" title="Edit Produk"><Icon name="edit" size={13}/></button>
                                  )}
                                  {hasAccess(currentUser, 'inv_delete_product') && (
                                    <button onClick={() => deleteProduct(p.id)} className="p-1.5 bg-[#DCFCE7] hover:bg-red-500/10 text-red-400 rounded-lg transition-colors" title="Hapus Produk"><Icon name="trash" size={13}/></button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
                )}

                {/* Riwayat Penerimaan Stok */}
                {inventorySubTab === 'receipts' && (
                  <div className="bg-white border border-amber-500/20 rounded-3xl overflow-hidden shadow-xl">
                    <div className="px-6 py-4 border-b border-[#BBF7D0] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                      <div className="flex items-center gap-2 flex-wrap">
                        <Icon name="clock" size={16} className="text-amber-400"/>
                        <span className="font-black text-[#228B22] text-sm">Riwayat Penerimaan & Penambahan Stok</span>
                        <span className="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">{validStockReceipts.length} entri</span>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="text-[#2E8B57] text-[10px] font-bold">Filter Produk:</span>
                        <select value={stockHistoryProductId} onChange={e => setStockHistoryProductId(e.target.value)} className="bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] px-2 py-1 rounded-lg focus:outline-none">
                          <option value="all">Semua Produk</option>
                          {products.map(p => (
                            <option key={p.id} value={p.id}>{p.name}{isProductUnlimited(p) ? ' (Tak Terbatas)' : ''}</option>
                          ))}
                        </select>
                        <button onClick={() => exportStockReceiptExcel(stockHistoryProductId)} className="flex items-center gap-1.5 bg-[#7CFC00] hover:bg-[#7CFC00] text-[#228B22] px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-md shadow-[#7CFC00]/20">
                          <Icon name="download" size={12}/> Export Excel
                        </button>
                      </div>
                    </div>

                    {validStockReceipts.length === 0 ? (
                      <div className="py-16 text-center text-[#3CB371]">
                        <Icon name="package" size={40} className="mx-auto mb-3 opacity-30"/>
                        <p className="text-sm">Belum ada riwayat penerimaan stok.</p>
                        <p className="text-xs mt-1">Klik tombol <span className="text-[#228B22] font-bold">+ Stok</span> pada produk untuk mencatat penerimaan barang.</p>
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-[#228B22]">
                          <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                            <tr>
                              <th className="px-4 py-3">Tanggal & Jam</th>
                              <th className="px-4 py-3">Produk</th>
                              <th className="px-4 py-3">Outlet</th>
                              <th className="px-4 py-3">Supplier / Keterangan</th>
                              <th className="px-4 py-3 text-center">Stok Sebelum</th>
                              <th className="px-4 py-3 text-center">Jumlah Masuk</th>
                              <th className="px-4 py-3 text-center">Stok Setelah</th>
                              <th className="px-4 py-3">Dicatat Oleh</th>
                              <th className="px-4 py-3 text-center">Aksi</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#BBF7D0]">
                            {validStockReceipts
                              .filter(r => stockHistoryProductId === 'all' || r.productId === stockHistoryProductId)
                              .map(r => {
                                const outletName = outlets.find(o => o.id === r.outletId)?.name || '-';
                                const rcptDate = new Date(r.date).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                                return (
                                  <tr key={r.id} className="hover:bg-[#DCFCE7] transition-colors">
                                    <td className="px-4 py-3 text-[#2E8B57] font-mono text-[11px]">{rcptDate}</td>
                                    <td className="px-4 py-3">
                                      <span className="font-bold text-[#228B22]">{r.productName}</span>
                                    </td>
                                    <td className="px-4 py-3">{outletName}</td>
                                    <td className="px-4 py-3">
                                      <div className="text-[#228B22]">{r.supplier || <span className="text-slate-600 italic">-</span>}</div>
                                      {r.note && <div className="text-[10px] text-[#3CB371] mt-0.5">{r.note}</div>}
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      <span className="bg-[#DCFCE7] px-2 py-0.5 rounded-md text-[#2E8B57]">{r.qtyBefore}</span>
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      <span className="bg-[#7CFC00]/20 border border-[#228B22]/30 text-[#228B22] font-black px-2.5 py-0.5 rounded-md">+{r.qtyAdded}</span>
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      <span className="bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 font-black px-2.5 py-0.5 rounded-md">{r.qtyAfter}</span>
                                    </td>
                                    <td className="px-4 py-3 text-[#2E8B57]">{r.addedBy}</td>
                                    <td className="px-4 py-3 text-center">
                                      {hasAccess(currentUser, 'inv_delete_action') && (
                                        <button onClick={() => deleteStockReceipt(r.id)} className="p-1.5 bg-red-500/10 text-red-500 hover:bg-red-500/20 rounded-lg transition-colors" title="Hapus Riwayat"><Icon name="trash" size={14}/></button>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })
                            }
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}

                {/* Riwayat Keluar Produk */}
                {inventorySubTab === 'outs' && (
                  <div className="bg-white border border-red-500/20 rounded-3xl overflow-hidden shadow-xl mt-4">
                    <div className="px-6 py-4 border-b border-[#BBF7D0] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                      <div className="flex items-center gap-2 flex-wrap">
                        <Icon name="arrow-up" size={16} className="text-red-500"/>
                        <span className="font-black text-[#228B22] text-sm">Riwayat Keluar Produk</span>
                        <span className="text-[10px] bg-red-500/20 text-red-500 border border-red-500/30 px-2 py-0.5 rounded-full font-bold">
                          {stockOuts.filter(r => (stockOutProductId === 'all' || r.productId === stockOutProductId) && (selectedOutletId === 'all' || r.outletId === selectedOutletId)).length} entri
                        </span>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="text-[#2E8B57] text-[10px] font-bold">Filter Produk:</span>
                        <select value={stockOutProductId} onChange={e => setStockOutProductId(e.target.value)} className="bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] px-2 py-1 rounded-lg focus:outline-none">
                          <option value="all">Semua Produk</option>
                          {products.map(p => (
                            <option key={p.id} value={p.id}>{p.name}{isProductUnlimited(p) ? ' (Tak Terbatas)' : ''}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    {stockOuts.filter(r => selectedOutletId === 'all' || r.outletId === selectedOutletId).length === 0 ? (
                      <div className="py-16 text-center text-[#3CB371]">
                        <Icon name="package" size={40} className="mx-auto mb-3 opacity-30"/>
                        <p className="text-sm">Belum ada riwayat stok keluar.</p>
                        <p className="text-xs mt-1">Klik tombol <span className="text-red-500 font-bold">- Keluar</span> pada produk untuk mencatat barang keluar.</p>
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-[#228B22]">
                          <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                            <tr>
                              <th className="px-4 py-3">Tanggal & Jam</th>
                              <th className="px-4 py-3">Produk</th>
                              <th className="px-4 py-3">Outlet</th>
                              <th className="px-4 py-3">Keterangan</th>
                              <th className="px-4 py-3 text-center">Stok Sebelum</th>
                              <th className="px-4 py-3 text-center">Jumlah Keluar</th>
                              <th className="px-4 py-3 text-center">Stok Setelah</th>
                              <th className="px-4 py-3">Dicatat Oleh</th>
                              <th className="px-4 py-3 text-center">Aksi</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#BBF7D0]">
                            {stockOuts
                              .filter(r => (stockOutProductId === 'all' || r.productId === stockOutProductId) && (selectedOutletId === 'all' || r.outletId === selectedOutletId))
                              .map(r => {
                                const outletName = outlets.find(o => o.id === r.outletId)?.name || '-';
                                const rcptDate = new Date(r.date).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                                return (
                                  <tr key={r.id} className="hover:bg-[#DCFCE7] transition-colors">
                                    <td className="px-4 py-3 text-[#2E8B57] font-mono text-[11px]">{rcptDate}</td>
                                    <td className="px-4 py-3">
                                      <span className="font-bold text-[#228B22]">{r.productName}</span>
                                    </td>
                                    <td className="px-4 py-3">{outletName}</td>
                                    <td className="px-4 py-3">
                                      <div className="text-[#228B22]">{r.note || <span className="text-slate-600 italic">-</span>}</div>
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      <span className="bg-[#DCFCE7] px-2 py-0.5 rounded-md text-[#2E8B57]">{r.qtyBefore}</span>
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      <span className="bg-red-500/20 border border-red-500/30 text-red-500 font-black px-2.5 py-0.5 rounded-md">-{r.qtyRemoved}</span>
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      <span className="bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 font-black px-2.5 py-0.5 rounded-md">{r.qtyAfter}</span>
                                    </td>
                                    <td className="px-4 py-3 text-[#2E8B57]">{r.operator}</td>
                                    <td className="px-4 py-3 text-center">
                                      {hasAccess(currentUser, 'inv_delete_action') && (
                                        <button onClick={() => deleteStockOut(r.id)} className="p-1.5 bg-red-500/10 text-red-500 hover:bg-red-500/20 rounded-lg transition-colors" title="Hapus Riwayat & Kembalikan Stok"><Icon name="trash" size={14}/></button>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })
                            }
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}

                {/* STOCK CARD / KARTU STOK */}
                {inventorySubTab === 'stock_card' && (() => {
                  const scProduct = products.find(p => p.id === stockCardProductId);

                  // Build movements: IN from receipts, OUT from transactions, OUT from stockOuts, OPNAME adjustments
                  const movements = [];
                  if (scProduct) {
                    stockReceipts.filter(r => r.productId === stockCardProductId && (selectedOutletId === 'all' || r.outletId === selectedOutletId)).forEach(r => {
                      movements.push({ date: r.date, type: 'MASUK', source: r.supplier ? `Penerimaan (${r.supplier})` : 'Penerimaan Stok', note: r.note || '-', qtyIn: r.qtyAdded, qtyOut: 0, by: r.addedBy || '-' });
                    });
                    transactions.filter(t => selectedOutletId === 'all' || t.outletId === selectedOutletId).forEach(t => {
                      if (t.items) {
                        t.items.forEach(item => {
                          if (item.id === stockCardProductId || item.name === scProduct.name) {
                            movements.push({ date: t.date, type: 'KELUAR', source: `Penjualan #${t.id.slice(-5)}`, note: `Kasir: ${t.cashier || '-'}`, qtyIn: 0, qtyOut: item.qty, by: t.cashier || '-' });
                          }
                        });
                      }
                    });
                    stockOuts.filter(r => r.productId === stockCardProductId && (selectedOutletId === 'all' || r.outletId === selectedOutletId)).forEach(r => {
                      movements.push({
                        date: r.date,
                        type: 'KELUAR',
                        source: 'Barang Keluar Manual',
                        note: r.note || '-',
                        qtyIn: 0,
                        qtyOut: r.qtyRemoved,
                        by: r.operator || '-'
                      });
                    });
                    // OPNAME adjustments
                    stockOpnames.filter(opn => selectedOutletId === 'all' || opn.outletId === selectedOutletId).forEach(opn => {
                      if (opn.items) {
                        const opItem = opn.items.find(i => i.productId === stockCardProductId);
                        if (opItem) {
                          const isSurplus = opItem.selisih > 0;
                          movements.push({
                            date: opn.date,
                            type: isSurplus ? 'MASUK' : 'KELUAR',
                            source: `Mutasi Opname #${opn.id}`,
                            note: opItem.keterangan,
                            qtyIn: isSurplus ? opItem.selisih : 0,
                            qtyOut: isSurplus ? 0 : Math.abs(opItem.selisih),
                            by: opn.operator || '-'
                          });
                        }
                      }
                    });
                    movements.sort((a, b) => new Date(a.date) - new Date(b.date));
                  }

                  let runningQty = 0;
                  const cardRows = movements.map(m => {
                    runningQty += m.qtyIn - m.qtyOut;
                    return { ...m, balance: runningQty };
                  });
                  const totalIn = cardRows.reduce((s, r) => s + r.qtyIn, 0);
                  const totalOut = cardRows.reduce((s, r) => s + r.qtyOut, 0);
                  const currentBalance = cardRows.length > 0 ? cardRows[cardRows.length - 1].balance : (isProductUnlimited(scProduct) ? 0 : (scProduct ? getStock(scProduct) : 0));

                  return (
                    <div className="bg-white border border-cyan-500/20 rounded-3xl overflow-hidden shadow-xl">
                      {/* Header */}
                      <div className="px-6 py-4 border-b border-[#BBF7D0] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div className="flex items-center gap-2 flex-wrap">
                          <div className="w-8 h-8 bg-cyan-500/10 border border-cyan-500/20 rounded-xl flex items-center justify-center text-cyan-400">
                            <Icon name="package" size={18}/>
                          </div>
                          <div>
                            <div className="font-black text-[#228B22] text-sm flex items-center gap-2">
                              Kartu Stok (Stock Card)
                              <span className="text-[10px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded-full font-bold">{cardRows.length} mutasi</span>
                              {isProductUnlimited(scProduct) && <span className="text-[10px] bg-cyan-50 text-cyan-600 border border-cyan-300 px-2 py-0.5 rounded-full font-bold">Stok Tak Terbatas</span>}
                            </div>
                            <div className="text-[11px] text-[#2E8B57]">{scProduct ? scProduct.name : 'Pilih produk di bawah'}</div>
                          </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                          <select
                            value={stockCardProductId}
                            onChange={e => setStockCardProductId(e.target.value)}
                            className="bg-[#F0FDF4] border border-[#86EFAC] text-xs text-[#228B22] px-3 py-1.5 rounded-xl focus:outline-none focus:border-cyan-500"
                          >
                            <option value="">-- Pilih Produk --</option>
                            {products.map(p => (
                              <option key={p.id} value={p.id}>{p.name}{isProductUnlimited(p) ? ' (Tak Terbatas)' : ''}</option>
                            ))}
                          </select>
                          {stockCardProductId && (
                            <button onClick={() => exportStockCardExcel(stockCardProductId)} className="flex items-center gap-1.5 bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-md shadow-cyan-600/20">
                              <Icon name="download" size={12}/> Export Excel
                            </button>
                          )}
                          <button onClick={() => setInventorySubTab('products')} className="flex items-center gap-1 bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 px-3 py-1.5 rounded-xl text-[11px] font-black transition-all" title="Tutup Kartu Stok">
                            <Icon name="x" size={12}/> Tutup
                          </button>
                        </div>
                      </div>

                      {selectedOutletId === 'all' ? (
                        <div className="py-16 text-center text-[#3CB371]">
                          <Icon name="store" size={40} className="mx-auto mb-3 opacity-40"/>
                          <p className="text-sm">Silakan pilih satu Outlet spesifik di menu atas untuk melihat Kartu Stok.</p>
                        </div>
                      ) : !stockCardProductId ? (
                        <div className="py-16 text-center text-[#3CB371]">
                          <Icon name="package" size={40} className="mx-auto mb-3 opacity-40"/>
                          <p className="text-sm">Pilih produk di atas untuk melihat Kartu Stok.</p>
                        </div>
                      ) : cardRows.length === 0 ? (
                        <div className="py-16 text-center text-[#3CB371]">
                          <Icon name="package" size={40} className="mx-auto mb-3 opacity-40"/>
                          <p className="text-sm font-bold text-[#228B22]">{scProduct?.name}</p>
                          <p className="text-xs mt-1">Belum ada mutasi stok (penerimaan / penjualan) untuk produk ini.</p>
                        </div>
                      ) : (
                        <>
                          {/* Summary Bar */}
                          <div className="grid grid-cols-3 divide-x divide-[#BBF7D0] border-b border-[#BBF7D0]">
                            <div className="px-5 py-3 text-center">
                              <div className="text-[10px] text-[#2E8B57] font-bold uppercase">Total Masuk</div>
                              <div className="text-[#228B22] font-black text-lg">+{totalIn}</div>
                            </div>
                            <div className="px-5 py-3 text-center">
                              <div className="text-[10px] text-[#2E8B57] font-bold uppercase">Total Keluar (Terjual)</div>
                              <div className="text-red-400 font-black text-lg">-{totalOut}</div>
                            </div>
                            <div className="px-5 py-3 text-center">
                              <div className="text-[10px] text-[#2E8B57] font-bold uppercase">Saldo Stok Saat Ini</div>
                              <div className="text-cyan-400 font-black text-lg">{currentBalance}</div>
                            </div>
                          </div>

                          {/* Table */}
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-[#228B22]">
                              <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                                <tr>
                                  <th className="px-4 py-3">Tanggal & Jam</th>
                                  <th className="px-4 py-3">Jenis Mutasi</th>
                                  <th className="px-4 py-3">Sumber / Keterangan</th>
                                  <th className="px-4 py-3">Catatan</th>
                                  <th className="px-4 py-3 text-center text-[#228B22]">Masuk (+)</th>
                                  <th className="px-4 py-3 text-center text-red-400">Keluar (-)</th>
                                  <th className="px-4 py-3 text-center">Saldo</th>
                                  <th className="px-4 py-3">Petugas</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-[#BBF7D0]">
                                {cardRows.map((row, i) => (
                                  <tr key={i} className={`hover:bg-[#DCFCE7] transition-colors ${row.type === 'MASUK' ? 'bg-emerald-950/10' : 'bg-red-950/10'}`}>
                                    <td className="px-4 py-3 text-[#2E8B57] text-[11px] font-mono">
                                      {new Date(row.date).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                                    </td>
                                    <td className="px-4 py-3">
                                      <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-black ${row.type === 'MASUK' ? 'bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}`}>
                                        {row.type === 'MASUK' ? '+' : '-'} {row.type}
                                      </span>
                                    </td>
                                    <td className="px-4 py-3 text-[#228B22]">{row.source}</td>
                                    <td className="px-4 py-3 text-[#3CB371] text-[11px]">{row.note}</td>
                                    <td className="px-4 py-3 text-center">
                                      {row.qtyIn > 0 ? <span className="text-[#228B22] font-black">+{row.qtyIn}</span> : <span className="text-slate-700">-</span>}
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      {row.qtyOut > 0 ? <span className="text-red-400 font-black">-{row.qtyOut}</span> : <span className="text-slate-700">-</span>}
                                    </td>
                                    <td className="px-4 py-3 text-center">
                                      <span className="bg-[#DCFCE7] border border-[#86EFAC] text-[#228B22] font-black px-2.5 py-0.5 rounded-md">{row.balance}</span>
                                    </td>
                                    <td className="px-4 py-3 text-[#2E8B57]">{row.by}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </>
                      )}
                    </div>
                  );
                })()}

                {/* STOK OPNAME SECTION */}
                {inventorySubTab === 'opname' && (
                  <div className="bg-white border border-orange-500/20 rounded-3xl overflow-hidden shadow-xl">
                    <div className="px-6 py-4 border-b border-[#BBF7D0] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                      <div>
                        <div className="font-black text-[#228B22] text-sm flex items-center gap-2">
                          <Icon name="package" size={16} className="text-orange-400"/> Stok Opname
                          <span className="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-bold">{stockOpnames.length} riwayat</span>
                        </div>
                        <div className="text-[11px] text-[#2E8B57]">Input stok fisik untuk penyesuaian otomatis ke Kartu Stok</div>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <button onClick={openOpnameModal} className="flex items-center gap-1.5 bg-orange-500 hover:bg-orange-600 text-[#228B22] px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-md shadow-orange-500/20">
                          <Icon name="plus" size={12}/> Buat Opname Baru
                        </button>
                        <button onClick={exportOpnameExcel} className="flex items-center gap-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] px-3 py-1.5 rounded-xl text-[11px] font-bold border border-[#86EFAC]">
                          <Icon name="download" size={12}/> Export Excel
                        </button>
                      </div>
                    </div>

                    {/* Opname date filter */}
                    <div className="px-6 py-3 border-b border-[#BBF7D0] flex flex-wrap items-center gap-2 text-xs">
                      <span className="text-[#2E8B57] font-bold text-[10px] uppercase">Dari:</span>
                      <input type="date" value={opnameFilterStartInput} onChange={e => setOpnameFilterStartInput(e.target.value)} className="bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] p-1.5 rounded-lg focus:outline-none"/>
                      <span className="text-[#3CB371] font-bold">s/d</span>
                      <span className="text-[#2E8B57] font-bold text-[10px] uppercase">Sampai:</span>
                      <input type="date" value={opnameFilterEndInput} onChange={e => setOpnameFilterEndInput(e.target.value)} className="bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] p-1.5 rounded-lg focus:outline-none"/>
                      <button onClick={() => { setOpnameFilterStart(opnameFilterStartInput); setOpnameFilterEnd(opnameFilterEndInput); }} className="bg-orange-500 hover:bg-orange-600 text-[#228B22] font-bold px-3 py-1.5 rounded-lg text-xs transition-colors">Jalankan Filter</button>
                      {(opnameFilterStart || opnameFilterEnd) && (
                        <button onClick={() => { setOpnameFilterStart(''); setOpnameFilterEnd(''); setOpnameFilterStartInput(''); setOpnameFilterEndInput(''); }} className="text-red-400 hover:text-red-300 font-bold text-[10px] px-2 py-1 rounded-lg border border-red-500/20">Reset</button>
                      )}
                    </div>

                    {/* Opname history table */}
                    {stockOpnames.filter(op => {
                      if (selectedOutletId !== 'all' && op.outletId !== selectedOutletId) return false;
                      if (opnameFilterStart && new Date(op.date) < new Date(opnameFilterStart)) return false;
                      if (opnameFilterEnd && new Date(op.date) > new Date(opnameFilterEnd + 'T23:59:59')) return false;
                      return true;
                    }).length === 0 ? (
                      <div className="py-16 text-center text-[#3CB371] flex flex-col items-center justify-center">
                        <Icon name="package" size={40} className="text-emerald-500 opacity-60 mb-2"/>
                        <p className="text-sm">Belum ada riwayat Stok Opname.</p>
                        <p className="text-xs mt-1 text-slate-600">Klik "Buat Opname Baru" untuk mulai.</p>
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-[#228B22]">
                          <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                            <tr>
                              <th className="px-4 py-3">ID Opname</th>
                              <th className="px-4 py-3">Tanggal</th>
                              <th className="px-4 py-3">Outlet</th>
                              <th className="px-4 py-3">Operator</th>
                              <th className="px-4 py-3">Produk</th>
                              <th className="px-4 py-3 text-center">Sistem</th>
                              <th className="px-4 py-3 text-center">Fisik</th>
                              <th className="px-4 py-3 text-center">Selisih</th>
                              <th className="px-4 py-3">Ket</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#BBF7D0]">
                            {stockOpnames.filter(op => {
                              if (selectedOutletId !== 'all' && op.outletId !== selectedOutletId) return false;
                              if (opnameFilterStart && new Date(op.date) < new Date(opnameFilterStart)) return false;
                              if (opnameFilterEnd && new Date(op.date) > new Date(opnameFilterEnd + 'T23:59:59')) return false;
                              return true;
                            }).map(op => {
                              const outletName = outlets.find(o => o.id === op.outletId)?.name || '-';
                              return op.items.map((it, idx) => (
                                <tr key={`${op.id}-${idx}`} className="hover:bg-[#DCFCE7] transition-colors">
                                  {idx === 0 && (
                                    <>
                                      <td className="px-4 py-3 font-mono text-orange-400 font-bold" rowSpan={op.items.length}>{op.id}</td>
                                      <td className="px-4 py-3 text-[#2E8B57]" rowSpan={op.items.length}>{new Date(op.date).toLocaleDateString('id-ID')}</td>
                                      <td className="px-4 py-3" rowSpan={op.items.length}>{outletName}</td>
                                      <td className="px-4 py-3" rowSpan={op.items.length}>{op.operator}</td>
                                    </>
                                  )}
                                  <td className="px-4 py-3 font-bold text-[#228B22]">{it.productName}</td>
                                  <td className="px-4 py-3 text-center">{it.qtySistem}</td>
                                  <td className="px-4 py-3 text-center font-bold text-[#228B22]">{it.qtyFisik}</td>
                                  <td className="px-4 py-3 text-center">
                                    <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black ${it.selisih > 0 ? 'bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30' : it.selisih < 0 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-[#DCFCE7] text-[#2E8B57]'}`}>
                                      {it.selisih > 0 ? '+' : ''}{it.selisih}
                                    </span>
                                  </td>
                                  <td className="px-4 py-3 text-[#3CB371] text-[11px]">{it.keterangan}</td>
                                </tr>
                              ));
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}

                {/* RAW MATERIALS SECTION */}
                {inventorySubTab === 'raw_materials' && hasAccess(currentUser, 'inv_raw_material') && (
                  <div className="bg-white border border-purple-500/20 rounded-3xl overflow-hidden shadow-xl">
                    <div className="px-6 py-4 border-b border-[#BBF7D0] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                      <div className="flex-1">
                        <div className="font-black text-[#228B22] text-sm flex items-center gap-2">
                          <Icon name="package" size={16} className="text-purple-400" /> Manajemen Bahan Baku
                          <span className="text-[10px] bg-purple-500/20 text-purple-500 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold">{rawMaterials.length} Bahan</span>
                        </div>
                        <div className="text-[11px] text-[#2E8B57]">Kelola stok bahan mentah yang digunakan sebagai resep produk.</div>
                      </div>
                      
                      <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <div className="relative flex-1 sm:w-44">
                          <Icon name="search" size={14} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-[#3CB371]"/>
                          <input type="text" value={searchTermRawMaterial} onChange={(e) => setSearchTermRawMaterial(e.target.value)} placeholder="Cari bahan..." className="w-full bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl pl-8 pr-3 py-1.5 text-[#228B22] text-xs focus:border-purple-500"/>
                        </div>
                        <select 
                          value={`${rawMaterialSort.field}-${rawMaterialSort.dir}`} 
                          onChange={(e) => {
                            const parts = e.target.value.split('-');
                            setRawMaterialSort({ field: parts[0], dir: parts[1] });
                          }}
                          className="bg-[#F0FDF4] border border-[#BBF7D0] text-xs text-[#228B22] font-bold rounded-xl px-2.5 py-1.5 focus:border-purple-500 focus:outline-none"
                          title="Urutkan daftar bahan baku"
                        >
                          <option value="stock-desc">Urut: Stok Terbanyak</option>
                          <option value="stock-asc">Urut: Stok Paling Sedikit</option>
                          <option value="name-asc">Urut: Nama (A-Z)</option>
                          <option value="name-desc">Urut: Nama (Z-A)</option>
                          <option value="costPrice-desc">Urut: HPP Tertinggi</option>
                          <option value="costPrice-asc">Urut: HPP Terendah</option>
                        </select>
                        <button onClick={() => setShowRawMaterialStockCard(v => !v)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-sm ${showRawMaterialStockCard ? 'bg-purple-600 text-white shadow-purple-500/20' : 'bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] border border-[#86EFAC]'}`}>
                          <Icon name="clock" size={12}/> {showRawMaterialStockCard ? 'Tutup Stock Card' : 'Stock Card Bahan Baku'}
                        </button>
                        <button onClick={exportRawMaterialsExcel} className="flex items-center gap-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] border border-[#86EFAC] px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-sm">
                          <Icon name="download" size={12}/> Excel
                        </button>
                        <button onClick={() => openRawMaterialModal()} className="flex items-center gap-1.5 bg-purple-500 hover:bg-purple-600 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-md shadow-purple-500/20">
                          <Icon name="plus" size={12}/> Tambah Bahan Baku
                        </button>
                      </div>
                    </div>

                    {rawMaterials.length === 0 ? (
                      <div className="py-16 text-center text-[#3CB371]">
                        <Icon name="package" size={40} className="mx-auto mb-3 opacity-50" />
                        <p className="text-sm">Belum ada bahan baku yang terdaftar.</p>
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-[#228B22]">
                          <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black select-none">
                            <tr>
                              <th 
                                onClick={() => setRawMaterialSort(prev => ({ field: 'name', dir: prev.field === 'name' && prev.dir === 'asc' ? 'desc' : 'asc' }))} 
                                className="px-4 py-3 cursor-pointer hover:text-purple-600 transition-colors"
                                title="Klik untuk mengurutkan nama"
                              >
                                <div className="flex items-center gap-1">
                                  <span>Nama Bahan Baku</span>
                                  <span className="text-[9px] font-bold text-purple-600 font-mono">{rawMaterialSort.field === 'name' ? (rawMaterialSort.dir === 'asc' ? ' (A-Z)' : ' (Z-A)') : ''}</span>
                                </div>
                              </th>
                              <th 
                                onClick={() => setRawMaterialSort(prev => ({ field: 'stock', dir: prev.field === 'stock' && prev.dir === 'desc' ? 'asc' : 'desc' }))} 
                                className="px-4 py-3 text-right cursor-pointer hover:text-purple-600 transition-colors"
                                title="Klik untuk mengurutkan berdasarkan stok"
                              >
                                <div className="flex items-center justify-end gap-1">
                                  <span>Stok Saat Ini</span>
                                  <span className="text-[9px] font-bold text-purple-600 font-mono">{rawMaterialSort.field === 'stock' ? (rawMaterialSort.dir === 'desc' ? ' (Banyak)' : ' (Sedikit)') : ''}</span>
                                </div>
                              </th>
                              <th 
                                onClick={() => setRawMaterialSort(prev => ({ field: 'costPrice', dir: prev.field === 'costPrice' && prev.dir === 'desc' ? 'asc' : 'desc' }))} 
                                className="px-4 py-3 text-right cursor-pointer hover:text-purple-600 transition-colors"
                                title="Klik untuk mengurutkan HPP"
                              >
                                <div className="flex items-center justify-end gap-1">
                                  <span>HPP / Modal</span>
                                  <span className="text-[9px] font-bold text-purple-600 font-mono">{rawMaterialSort.field === 'costPrice' ? (rawMaterialSort.dir === 'desc' ? ' (Tinggi)' : ' (Rendah)') : ''}</span>
                                </div>
                              </th>
                              <th className="px-4 py-3 text-right">Harga Jual Kasir</th>
                              <th className="px-4 py-3 text-center">Menu Kasir</th>
                              <th className="px-4 py-3 text-center">Aksi</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#BBF7D0]/50 bg-white">
                            {sortedRawMaterials.map((rm) => (
                              <tr key={rm.id} className="hover:bg-[#DCFCE7]/50 transition-colors">
                                <td className="px-4 py-3 font-bold">{rm.name}</td>
                                <td className="px-4 py-3 text-right">
                                  <div className="flex flex-col items-end gap-1">
                                    <span className="px-2 py-1 rounded-lg font-bold bg-emerald-50 text-emerald-600">
                                      {selectedOutletId === 'all' ? getRawMaterialTotalStock(rm) : getRawMaterialStock(rm)} {rm.unit}
                                    </span>
                                    {selectedOutletId === 'all' && outlets.length > 1 && (
                                      <div className="flex flex-wrap justify-end gap-1 text-[9px]">
                                        {outlets.map(o => (
                                          <span key={o.id} className="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200">
                                            {o.name}: <strong className="text-emerald-700">{getRawMaterialStock(rm, o.id)}</strong>
                                          </span>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                </td>
                                <td className="px-4 py-3 text-right font-bold text-[#2E8B57]">
                                  {formatRp(rm.costPrice || 0)}
                                </td>
                                <td className="px-4 py-3 text-right font-black text-[#228B22]">
                                  {formatRp(rm.sellPrice !== undefined && rm.sellPrice !== '' ? rm.sellPrice : (rm.costPrice || 0))}
                                </td>
                                <td className="px-4 py-3 text-center">
                                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                    rm.isAddon !== false ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-500'
                                  }`}>
                                    {rm.isAddon !== false ? 'Aktif di Kasir' : 'Non-aktif'}
                                  </span>
                                </td>
                                <td className="px-4 py-3">
                                  <div className="flex justify-center items-center gap-1.5">
                                    <button onClick={() => handleAddRawMaterialStock(rm)} className="px-2 py-1.5 bg-purple-500/10 hover:bg-purple-500/20 text-purple-600 rounded-lg transition-colors text-[10px] font-bold flex items-center gap-1" title="Tambah Stok"><Icon name="plus" size={11}/> Stok</button>
                                    <button onClick={() => handleReduceRawMaterialStock(rm)} className="px-2 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-lg transition-colors text-[10px] font-bold flex items-center gap-1" title="Kurangi Stok"><Icon name="minus" size={11}/> Stok</button>
                                    <button onClick={() => openRawMaterialModal(rm)} className="p-1.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-cyan-400 rounded-lg transition-colors" title="Edit Bahan"><Icon name="edit" size={13}/></button>
                                    <button onClick={() => deleteRawMaterial(rm.id)} className="p-1.5 bg-[#DCFCE7] hover:bg-red-500/10 text-red-400 rounded-lg transition-colors" title="Hapus Bahan"><Icon name="trash" size={13}/></button>
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}

                    {/* STOCK CARD / RIWAYAT MUTASI BAHAN BAKU */}
                    {showRawMaterialStockCard && (() => {
                      const filteredLogs = rawMaterialLogs.filter(log => {
                        const matchMaterial = rawMaterialStockCardId === 'all' || log.materialId === rawMaterialStockCardId;
                        const logOutlet = log.outletId || outlets[0]?.id || 'out-1';
                        const matchOutlet = selectedOutletId === 'all' || logOutlet === selectedOutletId;
                        return matchMaterial && matchOutlet;
                      });
                      const totalIn = filteredLogs.reduce((sum, l) => sum + (l.qtyIn || 0), 0);
                      const totalOut = filteredLogs.reduce((sum, l) => sum + (l.qtyOut || 0), 0);
                      const selectedRM = rawMaterials.find(r => r.id === rawMaterialStockCardId);
                      const activeOutletName = selectedOutletId === 'all' ? 'Semua Cabang' : (outlets.find(o => o.id === selectedOutletId)?.name || selectedOutletId);

                      return (
                        <div className="border-t border-purple-500/20 p-6 bg-[#F0FDF4]/30">
                          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
                            <div>
                              <div className="font-black text-[#228B22] text-sm flex items-center gap-2">
                                <Icon name="clock" size={16} className="text-purple-600"/>
                                Stock Card (Riwayat Mutasi Bahan Baku)
                                <span className="text-[10px] bg-purple-500/20 text-purple-600 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold">{filteredLogs.length} mutasi</span>
                              </div>
                              <div className="text-[11px] text-[#2E8B57]">
                                Cabang: <span className="font-bold text-purple-700">{activeOutletName}</span> | {selectedRM ? `Riwayat mutasi untuk ${selectedRM.name}` : 'Semua riwayat penerimaan, pengurangan manual, dan pemotongan resep kasir'}
                              </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                              <span className="text-[10px] font-bold text-[#2E8B57]">Filter Bahan:</span>
                              <select
                                value={rawMaterialStockCardId}
                                onChange={e => setRawMaterialStockCardId(e.target.value)}
                                className="bg-white border border-[#86EFAC] text-xs text-[#228B22] px-3 py-1.5 rounded-xl focus:outline-none focus:border-purple-500 font-bold"
                              >
                                <option value="all">Semua Bahan Baku</option>
                                {rawMaterials.map(rm => (
                                  <option key={rm.id} value={rm.id}>{rm.name} ({rm.unit})</option>
                                ))}
                              </select>
                              <button
                                onClick={() => exportRawMaterialStockCardExcel(rawMaterialStockCardId)}
                                className="flex items-center gap-1.5 bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-md shadow-purple-600/20"
                              >
                                <Icon name="download" size={12}/> Export Excel
                              </button>
                            </div>
                          </div>

                          {/* Summary Bar */}
                          <div className="grid grid-cols-3 divide-x divide-[#BBF7D0] bg-white rounded-2xl border border-[#BBF7D0] mb-4 shadow-sm">
                            <div className="px-4 py-3 text-center">
                              <div className="text-[10px] text-[#2E8B57] font-bold uppercase">Total Masuk (Penerimaan)</div>
                              <div className="text-[#228B22] font-black text-base md:text-lg">+{totalIn}</div>
                            </div>
                            <div className="px-4 py-3 text-center">
                              <div className="text-[10px] text-[#2E8B57] font-bold uppercase">Total Keluar (Terpakai/Manual)</div>
                              <div className="text-red-500 font-black text-base md:text-lg">-{totalOut}</div>
                            </div>
                            <div className="px-4 py-3 text-center">
                              <div className="text-[10px] text-[#2E8B57] font-bold uppercase">Sisa Saldo Stok ({activeOutletName})</div>
                              <div className="text-purple-600 font-black text-base md:text-lg">
                                {selectedRM ? `${selectedOutletId === 'all' ? getRawMaterialTotalStock(selectedRM) : getRawMaterialStock(selectedRM)} ${selectedRM.unit}` : `${rawMaterials.reduce((sum, r) => sum + (selectedOutletId === 'all' ? getRawMaterialTotalStock(r) : getRawMaterialStock(r)), 0)} (Total)`}
                              </div>
                            </div>
                          </div>

                          {/* Table Logs */}
                          {filteredLogs.length === 0 ? (
                            <div className="py-10 text-center text-[#3CB371] bg-white rounded-2xl border border-[#BBF7D0]">
                              <Icon name="clock" size={32} className="mx-auto mb-2 opacity-40"/>
                              <p className="text-xs font-bold">Belum ada riwayat mutasi untuk bahan baku ini di {activeOutletName}.</p>
                              <p className="text-[11px] text-slate-500 mt-0.5">Mutasi otomatis dicatat saat tambah stok, kurang stok, atau penjualan resep di kasir.</p>
                            </div>
                          ) : (
                            <div className="overflow-x-auto bg-white rounded-2xl border border-[#BBF7D0]">
                              <table className="w-full text-left text-xs text-[#228B22]">
                                <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                                  <tr>
                                    <th className="px-3 py-2.5">Tanggal & Jam</th>
                                    <th className="px-3 py-2.5">Outlet / Cabang</th>
                                    <th className="px-3 py-2.5">Bahan Baku</th>
                                    <th className="px-3 py-2.5">Jenis Mutasi</th>
                                    <th className="px-3 py-2.5">Sumber / Keterangan</th>
                                    <th className="px-3 py-2.5">Catatan</th>
                                    <th className="px-3 py-2.5 text-center text-[#228B22]">Masuk (+)</th>
                                    <th className="px-3 py-2.5 text-center text-red-500">Keluar (-)</th>
                                    <th className="px-3 py-2.5 text-center">Saldo</th>
                                    <th className="px-3 py-2.5">Petugas</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-[#BBF7D0]/60">
                                  {filteredLogs.map(log => {
                                    const logOutletId = log.outletId || outlets[0]?.id || 'out-1';
                                    const logOutletName = outlets.find(o => o.id === logOutletId)?.name || logOutletId;
                                    return (
                                      <tr key={log.id} className={`hover:bg-[#DCFCE7]/60 transition-colors ${log.type === 'MASUK' ? 'bg-emerald-50/30' : 'bg-red-50/30'}`}>
                                        <td className="px-3 py-2 font-mono text-[11px] text-[#2E8B57]">
                                          {new Date(log.date).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                                        </td>
                                        <td className="px-3 py-2 font-semibold text-purple-700 text-[11px]">
                                          {logOutletName}
                                        </td>
                                        <td className="px-3 py-2 font-bold text-[#228B22]">{log.materialName}</td>
                                        <td className="px-3 py-2">
                                          <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black ${log.type === 'MASUK' ? 'bg-[#7CFC00]/20 text-[#228B22] border border-[#228B22]/30' : 'bg-red-500/20 text-red-500 border border-red-500/30'}`}>
                                            {log.type === 'MASUK' ? '+' : '-'} {log.type}
                                          </span>
                                        </td>
                                        <td className="px-3 py-2 text-[#228B22]">{log.source}</td>
                                        <td className="px-3 py-2 text-[#3CB371] text-[11px]">{log.note}</td>
                                        <td className="px-3 py-2 text-center">
                                          {log.qtyIn > 0 ? <span className="text-[#228B22] font-black">+{log.qtyIn} {log.unit}</span> : <span className="text-slate-400">-</span>}
                                        </td>
                                        <td className="px-3 py-2 text-center">
                                          {log.qtyOut > 0 ? <span className="text-red-500 font-black">-{log.qtyOut} {log.unit}</span> : <span className="text-slate-400">-</span>}
                                        </td>
                                        <td className="px-3 py-2 text-center">
                                          <span className="bg-[#DCFCE7] border border-[#86EFAC] text-[#228B22] font-black px-2 py-0.5 rounded-md text-[11px]">{log.balance} {log.unit}</span>
                                        </td>
                                        <td className="px-3 py-2 text-[#2E8B57]">{log.operator || '-'}</td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      );
                    })()}
                  </div>
                )}

                {/* PROMO MANAGER SECTION */}
                {inventorySubTab === 'promo' && hasAccess(currentUser, 'inv_promo') && (() => {
                  const filteredPromos = promos.filter(p => selectedOutletId === 'all' || !p.outletId || p.outletId === 'all' || p.outletId === selectedOutletId);
                  return (
                  <div className="bg-white border border-amber-500/20 rounded-3xl overflow-hidden shadow-xl">
                    <div className="px-6 py-4 border-b border-[#BBF7D0] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                      <div>
                        <div className="font-black text-[#228B22] text-sm flex items-center gap-2">
                          <Icon name="tag" size={16} className="text-amber-500"/> Kelola Promo Diskon
                          <span className="text-[10px] bg-amber-500/20 text-amber-500 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">{filteredPromos.length} Promo Aktif</span>
                        </div>
                        <div className="text-[11px] text-[#2E8B57]">Buat jadwal promo diskon otomatis untuk produk tertentu</div>
                      </div>
                      <button onClick={() => openPromoModal()} className="flex items-center gap-1.5 bg-amber-400 hover:bg-amber-500 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-md shadow-amber-400/20">
                        <Icon name="plus" size={12}/> Buat Promo Baru
                      </button>
                    </div>

                    {filteredPromos.length === 0 ? (
                      <div className="py-16 text-center text-[#3CB371]">
                        <Icon name="tag" size={40} className="mx-auto mb-3 opacity-40"/>
                        <p className="text-sm">Belum ada promo yang dibuat.</p>
                        <p className="text-xs mt-1 text-slate-600">Klik "Buat Promo Baru" untuk mulai menarik pelanggan!</p>
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-[#228B22]">
                          <thead className="bg-[#F0FDF4] text-[#2E8B57] text-[10px] uppercase font-black">
                            <tr>
                              <th className="px-4 py-3">Nama Promo</th>
                              <th className="px-4 py-3">Target Cabang</th>
                              <th className="px-4 py-3">Jadwal Promo</th>
                              <th className="px-4 py-3">Diskon (Rp)</th>
                              <th className="px-4 py-3">Produk Terpilih</th>
                              <th className="px-4 py-3 text-center">Aksi</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#BBF7D0]">
                            {filteredPromos.map(promo => {
                              const isActive = (!promo.startDate || promo.startDate <= new Date().toISOString().slice(0, 10)) && (!promo.endDate || promo.endDate >= new Date().toISOString().slice(0, 10));
                              const targetOutletName = promo.outletId === 'all' || !promo.outletId ? 'Semua Cabang' : (outlets.find(o => o.id === promo.outletId)?.name || promo.outletId);
                              return (
                              <tr key={promo.id} className="hover:bg-[#DCFCE7] transition-colors group">
                                <td className="px-4 py-3">
                                  <div className="font-bold text-[#228B22] flex items-center gap-2">
                                    {promo.name}
                                    {isActive && <span className="text-[8px] bg-amber-400 text-white px-1.5 py-0.5 rounded-full">AKTIF</span>}
                                  </div>
                                </td>
                                <td className="px-4 py-3">
                                  <span className="text-[10px] bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded-full font-bold">
                                    {targetOutletName}
                                  </span>
                                </td>
                                <td className="px-4 py-3 text-[#2E8B57] font-mono text-[10px]">
                                  {promo.startDate ? promo.startDate : 'Selamanya'} s/d {promo.endDate ? promo.endDate : 'Selamanya'}
                                </td>
                                <td className="px-4 py-3 font-bold text-amber-500">
                                  -{formatRp(promo.discountNominal)}
                                </td>
                                <td className="px-4 py-3 text-[10px] text-[#3CB371]">
                                  {promo.productIds.length} Produk
                                </td>
                                <td className="px-4 py-3">
                                  <div className="flex items-center justify-center gap-2">
                                    <button onClick={() => openPromoModal(promo)} className="p-1.5 bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 rounded-lg transition-colors" title="Edit Promo"><Icon name="edit" size={14}/></button>
                                    <button onClick={() => deletePromo(promo.id)} className="p-1.5 bg-red-500/10 text-red-500 hover:bg-red-500/20 rounded-lg transition-colors" title="Hapus Promo"><Icon name="trash" size={14}/></button>
                                  </div>
                                </td>
                              </tr>
                            )})}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                  );
                })()}

              </div>
            )}

            {/* AI ADVISOR TAB */}
            {activeTab === 'ai_advisor' && (
              <div className="space-y-6 max-w-5xl mx-auto">
                
                <div className="bg-gradient-to-r from-purple-900/40 to-white border border-purple-500/30 p-6 rounded-3xl shadow-xl">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                    <div>
                      <h2 className="text-xl font-black text-[#228B22] flex items-center gap-2">
                        <Icon name="bot" className="text-purple-400" size={24}/> BosJus AI Business Audit
                      </h2>
                      <p className="text-[#228B22] text-xs mt-1">Evaluasi kesehatan finansial & rekomendasi strategi operasional otomatis.</p>
                    </div>
                    <button onClick={runAiBusinessAudit} disabled={isAiAnalyzing} className="flex items-center gap-2 bg-purple-600 hover:bg-purple-500 text-[#228B22] px-4 py-2.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-purple-500/20">
                      <Icon name="sparkles" size={16}/> {isAiAnalyzing ? 'Menganalisis...' : 'Jalankan Audit AI'}
                    </button>
                  </div>

                  {aiAnalysis ? (
                    <div className="bg-[#F0FDF4]/80 border border-[#BBF7D0] rounded-2xl p-5 text-[#228B22] text-xs leading-relaxed whitespace-pre-line">
                      {aiAnalysis}
                    </div>
                  ) : (
                    <div className="p-8 text-center text-[#2E8B57] bg-[#F0FDF4]/40 rounded-2xl border border-dashed border-[#BBF7D0] space-y-2">
                      <Icon name="bot" size={36} className="mx-auto text-purple-400/50"/>
                      <p className="text-xs font-medium">Klik tombol "Jalankan Audit AI" di atas untuk mendapatkan analisis terperinci.</p>
                    </div>
                  )}
                </div>

                {/* AI Interactive Chat Console */}
                <div className="bg-white border border-[#BBF7D0] rounded-3xl p-5 shadow-xl flex flex-col h-[400px]">
                  <h3 className="text-sm font-bold text-[#228B22] mb-3 flex items-center gap-2 pb-3 border-b border-[#BBF7D0]">
                    <Icon name="message" size={16} className="text-[#228B22]"/> Tanya BosJus AI Assistant
                  </h3>

                  <div className="flex-1 overflow-y-auto space-y-3 pr-2 mb-3">
                    {aiChatMessages.map((msg, idx) => (
                      <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[80%] rounded-2xl p-3 text-xs leading-relaxed ${msg.role === 'user' ? 'bg-[#7CFC00] text-[#228B22]' : 'bg-[#DCFCE7] text-[#228B22] border border-[#86EFAC]'}`}>
                          {msg.text}
                        </div>
                      </div>
                    ))}
                    <div ref={chatBottomRef}/>
                  </div>

                  <div className="flex gap-2 border-t border-[#BBF7D0] pt-3">
                    <input type="text" value={userChatInput} onChange={e => setUserChatInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSendAiChat()} placeholder="Tanyakan seputar harga menu, promo, atau efisiensi biaya..." className="flex-1 bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-4 py-2.5 text-xs text-[#228B22] focus:outline-none focus:border-purple-500"/>
                    <button onClick={handleSendAiChat} disabled={isAiChatLoading} className="bg-purple-600 hover:bg-purple-500 text-[#228B22] px-4 py-2.5 rounded-xl font-bold transition-all text-xs flex items-center gap-1.5">
                      <Icon name="send" size={14}/> Kirim
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Tambah Stok / Penerimaan Barang */}
            {isStockReceiptModalOpen && stockReceiptTarget && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-[#228B22]/20 rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
                  <button onClick={() => { setIsStockReceiptModalOpen(false); setStockReceiptTarget(null); }} className="absolute top-4 right-4 text-[#3CB371] hover:text-[#228B22] bg-[#DCFCE7] rounded-full p-1.5"><Icon name="x" size={18}/></button>

                  {/* Header Modal */}
                  <div className="flex items-center gap-3 mb-5">
                    <div className="w-12 h-12 bg-[#7CFC00]/10 border border-[#228B22]/20 rounded-2xl flex items-center justify-center text-[#228B22]">
                      <Icon name="package" size={24}/>
                    </div>
                    <div>
                      <div className="text-[10px] text-[#228B22] font-bold uppercase tracking-wide">Penerimaan Stok / Tambah Barang</div>
                      <h3 className="text-base font-black text-[#228B22] leading-tight">{stockReceiptTarget.name}</h3>
                      <div className="text-xs text-[#2E8B57]">Stok Saat Ini: <span className="text-amber-400 font-bold">{getStock(stockReceiptTarget)} item</span></div>
                    </div>
                  </div>

                  <div className="space-y-4">
                    {/* Jumlah Stok Masuk */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1.5 block">Jumlah Stok Masuk <span className="text-red-400">*</span></label>
                      <div className="flex items-center gap-2">
                        <button onClick={() => setStockReceiptForm(f => ({...f, qty: Math.max(0, (parseInt(f.qty)||0) - 1).toString()}))} className="w-10 h-10 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-black text-lg flex items-center justify-center border border-[#86EFAC]">-</button>
                        <input
                          type="number"
                          min="0"
                          value={stockReceiptForm.qty}
                          onChange={e => setStockReceiptForm(f => ({...f, qty: e.target.value}))}
                          placeholder="0"
                          className="flex-1 bg-[#F0FDF4] border border-[#86EFAC] focus:border-[#228B22] rounded-xl px-4 py-2.5 text-lg font-black text-[#228B22] text-center focus:outline-none"
                        />
                        <button onClick={() => setStockReceiptForm(f => ({...f, qty: ((parseInt(f.qty)||0) + 1).toString()}))} className="w-10 h-10 bg-[#7CFC00]/20 hover:bg-[#7CFC00]/30 text-[#228B22] border border-[#228B22]/30 rounded-xl font-black text-lg flex items-center justify-center">+</button>
                      </div>
                      {stockReceiptForm.qty && parseInt(stockReceiptForm.qty) > 0 && (
                        <div className="mt-1.5 text-xs text-[#228B22] font-bold text-center">
                          Stok akan menjadi: <span className="text-[#228B22]">{getStock(stockReceiptTarget) + parseInt(stockReceiptForm.qty)}</span> item
                        </div>
                      )}
                    </div>

                    {/* Quick Add Buttons */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1.5 block">Tambah Cepat</label>
                      <div className="grid grid-cols-5 gap-1.5">
                        {[5, 10, 20, 50, 100].map(n => (
                          <button key={n} onClick={() => setStockReceiptForm(f => ({...f, qty: n.toString()}))} className={`py-1.5 rounded-lg text-xs font-bold border transition-colors ${stockReceiptForm.qty === n.toString() ? 'bg-[#7CFC00]/20 border-[#228B22]/40 text-[#228B22]' : 'bg-[#DCFCE7] border-[#86EFAC] text-[#228B22] hover:bg-[#BBF7D0]'}`}>
                            +{n}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Supplier */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1.5 block">Nama Supplier / Pemasok</label>
                      <input
                        type="text"
                        value={stockReceiptForm.supplier}
                        onChange={e => setStockReceiptForm(f => ({...f, supplier: e.target.value}))}
                        placeholder="cth: Pak Budi, CV Sinar Jaya..."
                        className="w-full bg-[#F0FDF4] border border-[#86EFAC] focus:border-[#228B22] rounded-xl px-3 py-2.5 text-xs text-[#228B22] focus:outline-none"
                      />
                    </div>

                    {/* Catatan */}
                    <div>
                      <label className="text-[10px] font-bold text-[#2E8B57] uppercase mb-1.5 block">Catatan Tambahan</label>
                      <textarea
                        value={stockReceiptForm.note}
                        onChange={e => setStockReceiptForm(f => ({...f, note: e.target.value}))}
                        placeholder="cth: Batch baru, kualitas A, harga promo..."
                        rows={2}
                        className="w-full bg-[#F0FDF4] border border-[#86EFAC] focus:border-[#228B22] rounded-xl px-3 py-2.5 text-xs text-[#228B22] focus:outline-none resize-none"
                      />
                    </div>

                    {/* Info Tanggal */}
                    <div className="bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl px-3 py-2 flex items-center gap-2 text-xs text-[#2E8B57]">
                      <Icon name="clock" size={13} className="text-[#3CB371]"/>
                      Dicatat otomatis: <span className="text-[#228B22] font-bold">{new Date().toLocaleString('id-ID')}</span>
                      &nbsp;- Oleh: <span className="text-[#228B22] font-bold">{currentUser.name}</span>
                    </div>

                    {/* Action Buttons */}
                    <div className="flex gap-2 pt-1">
                      <button onClick={() => { setIsStockReceiptModalOpen(false); setStockReceiptTarget(null); }} className="flex-1 py-2.5 bg-[#DCFCE7] hover:bg-[#BBF7D0] text-[#228B22] rounded-xl font-bold text-sm border border-[#86EFAC] transition-colors">Batal</button>
                      <button onClick={saveStockReceipt} className="flex-1 py-2.5 bg-[#7CFC00] hover:bg-emerald-400 text-[#228B22] rounded-xl font-bold text-sm shadow-lg shadow-[#7CFC00]/20 transition-colors flex items-center justify-center gap-2">
                        <Icon name="plus" size={16}/> Simpan Penerimaan
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Barang Keluar / Stok Out */}
            {isStockOutModalOpen && stockReceiptTarget && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <div className="bg-white border border-red-500/20 rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
                  <button onClick={() => { setIsStockOutModalOpen(false); setStockReceiptTarget(null); }} className="absolute top-4 right-4 text-red-400 hover:text-red-600 bg-red-500/10 rounded-full p-1.5"><Icon name="x" size={18}/></button>

                  {/* Header Modal */}
                  <div className="flex items-center gap-3 mb-5">
                    <div className="w-12 h-12 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center text-red-500">
                      <Icon name="package" size={24}/>
                    </div>
                    <div>
                      <div className="text-[10px] text-red-500 font-bold uppercase tracking-wide">Pengurangan Stok / Barang Keluar</div>
                      <h3 className="text-base font-black text-red-600 leading-tight">{stockReceiptTarget.name}</h3>
                      <div className="text-xs text-red-400">Stok Saat Ini: <span className="font-bold text-red-500">{getStock(stockReceiptTarget)} item</span></div>
                    </div>
                  </div>

                  <form onSubmit={saveStockOut} className="space-y-4">
                    {/* Jumlah Stok Keluar */}
                    <div>
                      <label className="text-[10px] font-bold text-red-500 uppercase mb-1.5 block">Jumlah Keluar <span className="text-red-400">*</span></label>
                      <div className="flex items-center gap-2">
                        <button type="button" onClick={() => setStockOutForm(f => ({...f, qty: Math.max(0, (parseInt(f.qty)||0) - 1).toString()}))} className="w-10 h-10 bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-xl font-black text-lg flex items-center justify-center border border-red-500/30">-</button>
                        <input
                          type="number"
                          min="0"
                          value={stockOutForm.qty}
                          onChange={e => setStockOutForm(f => ({...f, qty: e.target.value}))}
                          placeholder="0"
                          className="flex-1 bg-red-50 border border-red-200 focus:border-red-500 rounded-xl px-4 py-2.5 text-lg font-black text-red-500 text-center focus:outline-none"
                        />
